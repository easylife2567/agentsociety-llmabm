<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
  <title id="title">理论框架升级图</title>
  <desc id="desc">从经典数字哀悼的注意力激增与衰减，升级到 Coleman 宏观—微观—宏观框架下的算法策展与用户表达循环。</desc>

  <defs>
    <style>
      .cn { font-family: "Source Han Sans SC", "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f252b; }
      .math { font-family: "Times New Roman", "STIX Two Text", serif; fill: #1f252b; }
      .panel-title { font-size: 30px; font-weight: 650; }
      .node-title { font-size: 26px; font-weight: 650; }
      .body { font-size: 21px; font-weight: 400; }
      .small { font-size: 18px; font-weight: 400; fill: #4c5660; }
      .tiny { font-size: 16px; font-weight: 400; fill: #59636d; }
      .label { font-size: 18px; font-weight: 600; }
      .blue { fill: #3e6b89; }
      .red { fill: #b85c4a; }
      .stroke { fill: none; stroke: #252b31; stroke-width: 2.6; }
      .thin { fill: none; stroke: #59636d; stroke-width: 2; }
      .blue-stroke { fill: none; stroke: #3e6b89; stroke-width: 3; }
      .red-stroke { fill: none; stroke: #b85c4a; stroke-width: 3; }
      .dash { stroke-dasharray: 9 8; }
      .dot { stroke-dasharray: 3 7; stroke-linecap: round; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#252b31"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#3e6b89"/>
    </marker>
    <clipPath id="macro-chart-clip"><rect x="1360" y="620" width="270" height="105"/></clipPath>
  </defs>

  <rect width="1800" height="1200" fill="#ffffff"/>

  <!-- Panel (a): benchmark pattern -->
  <rect x="55" y="45" width="1690" height="335" rx="4" fill="#ffffff" stroke="#252b31" stroke-width="2.4"/>
  <text x="82" y="90" class="cn panel-title">(a) 经典数字哀悼：注意力的 spike + decay</text>

  <!-- Axes -->
  <line x1="125" y1="320" x2="1320" y2="320" class="stroke" marker-end="url(#arrow)"/>
  <line x1="125" y1="320" x2="125" y2="132" class="stroke" marker-end="url(#arrow)"/>
  <text x="1335" y="327" class="cn small">时间</text>
  <text x="79" y="240" class="cn small" text-anchor="middle" transform="rotate(-90 79 240)">公众注意力</text>

  <!-- Event and spike-decay curve -->
  <line x1="352" y1="133" x2="352" y2="320" class="thin dash"/>
  <text x="352" y="122" class="cn small" text-anchor="middle">死亡事件</text>
  <path d="M126 304 C230 304, 310 304, 338 294 C350 290, 357 270, 362 224 C368 166, 379 143, 391 164 C432 230, 502 261, 582 278 C690 301, 850 304, 1310 304" class="blue-stroke"/>

  <!-- Stage ticks and labels -->
  <line x1="352" y1="320" x2="352" y2="343" class="thin"/>
  <line x1="525" y1="320" x2="525" y2="343" class="thin"/>
  <line x1="745" y1="320" x2="745" y2="343" class="thin"/>
  <line x1="980" y1="320" x2="980" y2="343" class="thin"/>
  <text x="438" y="352" class="cn tiny" text-anchor="middle">注意力激增</text>
  <text x="635" y="352" class="cn tiny" text-anchor="middle">线上哀悼</text>
  <text x="862" y="352" class="cn tiny" text-anchor="middle">二次创作</text>
  <text x="1145" y="352" class="cn tiny" text-anchor="middle">记忆沉淀</text>

  <!-- Benchmark note -->
  <rect x="1390" y="135" width="285" height="118" rx="3" fill="#f5f7f8" stroke="#aeb6bd" stroke-width="1.6"/>
  <text x="1532" y="177" class="cn label blue" text-anchor="middle">效标基线</text>
  <text x="1532" y="213" class="cn body" text-anchor="middle">先复现经典形态</text>
  <text x="1532" y="280" class="cn tiny" text-anchor="middle">关注“被记住多少”</text>

  <!-- Theoretical upgrade -->
  <line x1="900" y1="384" x2="900" y2="432" class="blue-stroke" marker-end="url(#arrow-blue)"/>
  <rect x="562" y="393" width="676" height="34" fill="#ffffff"/>
  <text x="900" y="418" class="cn body" text-anchor="middle">
    <tspan font-weight="650">理论升级：</tspan>
    <tspan>从“被记住多少”到“被记住什么”</tspan>
  </text>

  <!-- Panel (b): Coleman framework -->
  <rect x="55" y="450" width="1690" height="700" rx="4" fill="#ffffff" stroke="#252b31" stroke-width="2.4"/>
  <text x="82" y="495" class="cn panel-title">(b) Coleman 宏观—微观—宏观框架下的表征转移</text>

  <!-- Macro A -->
  <rect x="90" y="530" width="360" height="160" rx="3" fill="#ffffff" stroke="#252b31" stroke-width="2.4"/>
  <text x="115" y="570" class="cn node-title"><tspan class="blue">A</tspan><tspan>  宏观情境</tspan></text>
  <line x1="115" y1="586" x2="425" y2="586" stroke="#aeb6bd" stroke-width="1.5"/>
  <text x="270" y="622" class="cn body" text-anchor="middle">死亡事件</text>
  <text x="270" y="658" class="cn body" text-anchor="middle">初始话语构成</text>

  <!-- Macro C -->
  <rect x="1305" y="520" width="405" height="245" rx="3" fill="#ffffff" stroke="#252b31" stroke-width="2.4"/>
  <text x="1332" y="560" class="cn node-title"><tspan class="blue">C</tspan><tspan>  宏观形态</tspan></text>
  <text x="1508" y="597" class="cn body" text-anchor="middle">逝后数字表征转移</text>

  <!-- Macro outcome inset chart -->
  <line x1="1360" y1="725" x2="1640" y2="725" class="thin" marker-end="url(#arrow)"/>
  <line x1="1360" y1="725" x2="1360" y2="620" class="thin" marker-end="url(#arrow)"/>
  <text x="1650" y="731" class="cn tiny">时间</text>
  <text x="1342" y="675" class="cn tiny" text-anchor="middle" transform="rotate(-90 1342 675)">内容占比</text>
  <g clip-path="url(#macro-chart-clip)">
    <path d="M1362 637 C1410 644, 1450 682, 1500 706 C1550 721, 1595 723, 1635 723" class="blue-stroke dot"/>
    <path d="M1362 711 C1400 708, 1420 669, 1452 656 C1484 646, 1512 690, 1548 702 C1585 712, 1610 712, 1635 711" class="stroke"/>
    <path d="M1362 721 C1445 721, 1490 710, 1525 678 C1560 646, 1598 638, 1635 638" class="red-stroke dash"/>
  </g>
  <text x="1618" y="650" class="cn tiny red">玩梗</text>
  <text x="1606" y="701" class="cn tiny">悼念</text>
  <text x="1594" y="720" class="cn tiny blue">教育</text>
  <text x="1508" y="752" class="cn small" text-anchor="middle">教育 → 悼念 → 玩梗</text>

  <!-- Macro relationship and A-to-B descent -->
  <path d="M450 610 H1285" class="thin dash" marker-end="url(#arrow)"/>
  <rect x="672" y="584" width="390" height="52" fill="#ffffff"/>
  <text x="867" y="604" class="cn tiny" text-anchor="middle">宏观情境经算法组织的信息流</text>
  <text x="867" y="627" class="cn tiny" text-anchor="middle">进入个体表达过程</text>
  <path d="M270 690 V785" class="blue-stroke" marker-end="url(#arrow-blue)"/>
  <text x="291" y="748" class="cn label blue">A→B</text>

  <!-- Micro process group -->
  <rect x="82" y="775" width="1638" height="310" rx="3" fill="#fbfcfc" stroke="#59636d" stroke-width="2" stroke-dasharray="9 7"/>
  <rect x="103" y="758" width="190" height="35" fill="#ffffff"/>
  <text x="112" y="789" class="cn node-title"><tspan class="blue">B</tspan><tspan>  微观过程</tspan></text>

  <!-- Micro step 1 -->
  <rect x="110" y="820" width="350" height="175" rx="3" fill="#ffffff" stroke="#252b31" stroke-width="2.2"/>
  <text x="135" y="856" class="cn label blue">1</text>
  <text x="285" y="856" class="cn label" text-anchor="middle">算法组织的信息环境</text>
  <text x="285" y="894" class="cn body" text-anchor="middle">随机 · 时序 · 兴趣</text>
  <line x1="135" y1="916" x2="435" y2="916" stroke="#d1d6da" stroke-width="1.4"/>
  <text x="285" y="949" class="cn small" text-anchor="middle">算法策展：选择性曝光</text>

  <!-- Micro step 2 -->
  <rect x="500" y="820" width="410" height="175" rx="3" fill="#ffffff" stroke="#252b31" stroke-width="2.2"/>
  <text x="525" y="856" class="cn label blue">2</text>
  <text x="705" y="856" class="cn label" text-anchor="middle">用户表达决策</text>
  <text x="705" y="901" class="math" font-size="27" font-style="italic" text-anchor="middle">U<tspan baseline-shift="sub" font-size="18">i</tspan> = B<tspan baseline-shift="sub" font-size="18">i</tspan> + R<tspan baseline-shift="sub" font-size="18">i</tspan>(D<tspan baseline-shift="sub" font-size="18">i</tspan> − B<tspan baseline-shift="sub" font-size="18">i</tspan>)</text>
  <text x="705" y="935" class="cn tiny" text-anchor="middle">既有倾向 B<tspan baseline-shift="sub" font-size="12">i</tspan> · 意见气候 D<tspan baseline-shift="sub" font-size="12">i</tspan> · 注意力响应 R<tspan baseline-shift="sub" font-size="12">i</tspan></text>
  <text x="705" y="970" class="cn small" text-anchor="middle">建模前提：认知框架</text>

  <!-- Micro step 3 -->
  <rect x="950" y="820" width="320" height="175" rx="3" fill="#ffffff" stroke="#252b31" stroke-width="2.2"/>
  <text x="975" y="856" class="cn label blue">3</text>
  <text x="1110" y="856" class="cn label" text-anchor="middle">发声 / 沉默</text>
  <text x="1110" y="894" class="cn body" text-anchor="middle">群体内容产出</text>
  <line x1="975" y1="916" x2="1245" y2="916" stroke="#d1d6da" stroke-width="1.4"/>
  <text x="1110" y="945" class="cn tiny" text-anchor="middle">沉默：沉默的螺旋</text>
  <text x="1110" y="973" class="cn tiny" text-anchor="middle">退潮：注意力衰减</text>

  <!-- Micro step 4 -->
  <rect x="1310" y="820" width="365" height="175" rx="3" fill="#ffffff" stroke="#252b31" stroke-width="2.2"/>
  <text x="1335" y="856" class="cn label blue">4</text>
  <text x="1492" y="856" class="cn label" text-anchor="middle">内容池更新</text>
  <text x="1492" y="900" class="cn body" text-anchor="middle">用户产出 + 真实数据注入</text>
  <line x1="1335" y1="922" x2="1650" y2="922" stroke="#d1d6da" stroke-width="1.4"/>
  <text x="1492" y="956" class="cn small" text-anchor="middle">份额与绝对量变化</text>

  <!-- Micro arrows -->
  <line x1="460" y1="907" x2="494" y2="907" class="stroke" marker-end="url(#arrow)"/>
  <line x1="910" y1="907" x2="944" y2="907" class="stroke" marker-end="url(#arrow)"/>
  <line x1="1270" y1="907" x2="1304" y2="907" class="stroke" marker-end="url(#arrow)"/>

  <!-- Feedback loop -->
  <path d="M1492 995 V1035 H285 V1001" class="blue-stroke" marker-end="url(#arrow-blue)"/>
  <rect x="710" y="1016" width="355" height="34" fill="#fbfcfc"/>
  <text x="887" y="1041" class="cn small blue" text-anchor="middle">曝光—表达—再分发</text>

  <!-- B-to-C emergence -->
  <path d="M1492 820 V772" class="blue-stroke" marker-end="url(#arrow-blue)"/>
  <rect x="1510" y="780" width="185" height="28" fill="#ffffff"/>
  <text x="1520" y="800" class="cn label blue">B→C  聚合涌现</text>

  <!-- Methodological boundary -->
  <line x1="100" y1="1104" x2="1700" y2="1104" stroke="#d1d6da" stroke-width="1.4"/>
  <text x="900" y="1136" class="cn small" text-anchor="middle">固定个体类型 · 切换推荐制度 · 观察宏观轨迹差异</text>
  <text x="900" y="1165" class="cn tiny" text-anchor="middle">检验对象：策展机制与行为设定；认知框架作为建模前提</text>
</svg>
