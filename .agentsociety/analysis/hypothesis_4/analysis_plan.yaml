research_question: 沿用原图3/4口径，以按用户确认视为等价的新旧模型版本合并三臂各10seed，检验晚期玩梗供给及选择性表达/再展示结论是否稳定；明确时序制度的排序与生成帖更快入池未分离。
primary_metrics:
- late_meme_posts
- late_meme_share
- own_share
- meme_post_rate
- cross_generated_share
target_tables:
- seed10_run_metrics
- seed10_weekly_metrics
confirmatory_claims:
- 在W19–W22，兴趣与时序制度的玩梗型作者供给总量和份额高于随机制度；检查原结论是否在新增7seed内仍同向。
- 差异体现在玩梗群体所见、发帖率及生成玩梗帖跨群体再展示；不预设兴趣优于时序。
exploratory_notes: 固定原窗口W19–W22；按作者类型posted统计；先run内比例再seed均值；旧3、新7、合计10分层。同seed配对、方向计数、逐一剔除seed、精确双侧符号翻转检验，15对比/层Holm校正；t区间为seed间均值不确定性，不能当模型版本因果检验。W13悼念峰和W12–W22轨迹作原口径描述。
  2026-10-24用户解释口径修订：版本视为本研究等价，全10为主分析，旧3/新7仅作补充批次检查；指标、窗口、统计方法和原结果不变。
simulation_limitations: 当前时序臂的排序、Agent生成帖批末入池/周内回流及候选规则同时变化，不能分离纯排序贡献；外部真实帖三臂共享发布时间资格。供给作者类型不等于正文独立语义分类；10槽数值feed不等于正文提示前5条或实际阅读；版本号保留溯源，按用户确认等价处理；不动消融。
eda_profile: quick-stats
eda_profiles: []
table_checks:
- table: seed10_run_metrics
  min_rows: 30
  columns:
  - cohort
  - seed
  - arm
  - late_meme_share
- table: seed10_weekly_metrics
  min_rows: 330
  columns:
  - week
  - arm
  - seed
