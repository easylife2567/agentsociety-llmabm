<title id="title">算法策展与逝者数字表征：整体研究框架</title><desc id="desc">现实数据识别时序与平台差异，并为多智能体模型提供输入和参数参照。模型以可见性配置、选择性表达和内容回流构成反馈循环，通过三种策展制度和三种组件干预比较供给、参与及可见位置。</desc>
