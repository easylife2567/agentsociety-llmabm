<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="63.75mm" viewBox="0 0 2400 850" role="img" aria-labelledby="title desc"><title id="title">An orbital map of complementary empirical and simulation studies</title><desc id="desc">White-background orbital schematic with restrained semantic accents. Left 35 percent: platform corpus, coding, temporal and platform analyses. Right 65 percent: visibility configuration, selective expression and content recirculation form the proposed mechanism. Curved arcs show process, not data proportions. Mourning icons indicate context only. Types are fixed. Exposure history is updated by contact regardless of posting.</desc><defs>
