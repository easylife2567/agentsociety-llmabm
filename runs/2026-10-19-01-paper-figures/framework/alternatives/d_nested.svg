<text x="876" y="551" class="math" text-anchor="middle" style="font-size:35px">U<tspan baseline-shift="sub" font-size="22">it</tspan><tspan> = B</tspan><tspan baseline-shift="sub" font-size="22">i</tspan><tspan> + R</tspan><tspan baseline-shift="sub" font-size="22">it</tspan><tspan>(D</tspan><tspan baseline-shift="sub" font-size="22">it</tspan><tspan> − B</tspan><tspan baseline-shift="sub" font-size="22">i</tspan><tspan>)</tspan></text>
<text x="877" y="597" class="xs" text-anchor="middle">R → 0 ⇒ U → B   |   Below threshold: no post</text>
