<rect x="48" y="664" width="2304" height="88" rx="10" fill="#F1F3F5" stroke="#ACB6BE" stroke-width="2"/>
<text x="69" y="698" class="xs" text-anchor="start" style="fill:#46515C">COMPARE</text>
<text x="257" y="698" class="s" text-anchor="start">Random · Chronological · Interest-based   ×   3 seeds = 9 main runs</text>
<text x="69" y="736" class="xs" text-anchor="start" style="fill:#46515C">INTERVENE</text>
<text x="257" y="736" class="s" text-anchor="start">Interest-based: B=0 / D=1 / R=1   ×   3 paired repeats</text>
<text x="48" y="792" class="xs" text-anchor="start" style="fill:#46515C">Full-model reference reused; generation configurations differ between batches.</text>
