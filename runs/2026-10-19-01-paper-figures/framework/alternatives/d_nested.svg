<text x="263" y="294" class="h" text-anchor="middle" style="fill:#FFFFFF">DIGITAL MOURNING</text>
<text x="76" y="349" class="b" text-anchor="start" style="fill:#FFFFFF">Empirical analysis</text>
<text x="76" y="392" class="b" text-anchor="start" style="fill:#FFFFFF">49,930 posts</text>
<text x="76" y="443" class="xs" text-anchor="start" style="fill:#FFFFFF">Douyin + Xiaohongshu</text>
<text x="76" y="482" class="xs" text-anchor="start" style="fill:#FFFFFF">Temporal / platform patterns</text>
<path d="M76 512 H450" fill="none" stroke="#83919D" stroke-width="2"/>
<text x="76" y="553" class="s" text-anchor="start" style="fill:#FFFFFF">Mechanism investigation</text>
<text x="76" y="593" class="s" text-anchor="start" style="fill:#FFFFFF">100 agents · 5 fixed types</text>
<rect x="506" y="105" width="912" height="113" rx="5" fill="#E8F2F8" stroke="#0072B2" stroke-width="2"/>
<text x="529" y="146" class="s" text-anchor="start" style="fill:#0072B2">FROZEN EXTERNAL SAMPLES</text>
<text x="529" y="191" class="s" text-anchor="start">Time-stamped · shared by regimes within each seed</text>
<rect x="1446" y="105" width="906" height="113" rx="5" fill="#F1F3F5" stroke="#ACB6BE" stroke-width="2"/>
<text x="1469" y="146" class="s" text-anchor="start" style="fill:#46515C">FIXED AGENT PROFILES</text>
<text x="1469" y="191" class="s" text-anchor="start">Type + threshold · W12–W22 · one weekly opportunity</text>
<rect x="506" y="301" width="355" height="167" rx="5" fill="#E8F2F8" stroke="#0072B2" stroke-width="2"/>
<text x="528" y="341" class="h" text-anchor="start" style="fill:#0072B2">CURATE</text>
