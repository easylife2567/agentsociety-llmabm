<text x="912" y="341" class="h" text-anchor="start" style="fill:#9C4300">ACTIVATE</text>
<rect x="1274" y="301" width="560" height="167" rx="5" fill="#FFF0E4" stroke="#D55E00" stroke-width="2"/>
<text x="1296" y="341" class="h" text-anchor="start" style="fill:#9C4300">GENERATE</text>
<rect x="1863" y="301" width="489" height="167" rx="5" fill="#FFF0E4" stroke="#D55E00" stroke-width="2"/>
<text x="1885" y="341" class="h" text-anchor="start" style="fill:#9C4300">PUBLISH</text>
<text x="529" y="385" class="s" text-anchor="start">Pool → personal feed</text>
<text x="529" y="424" class="s" text-anchor="start">≤10 eligible posts</text>
<text x="911" y="381" class="xs" text-anchor="start">B baseline · D climate</text>
<text x="911" y="417" class="xs" text-anchor="start">R prior-exposure weight</text>
<text x="911" y="452" class="xs" text-anchor="start">U ≥ fixed threshold?</text>
<text x="1297" y="385" class="s" text-anchor="start">Persona + ≤5 feed excerpts</text>
<text x="1297" y="424" class="s" text-anchor="start">≤120 characters each</text>
