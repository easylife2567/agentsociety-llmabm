<path d="M1923 433 H1949" fill="none" stroke="#D55E00" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#orange)"/>
<path d="M992 239 V275 H223 V324" fill="none" stroke="#0072B2" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
