<text x="1113" y="592" class="s" text-anchor="middle">No → no post this turn</text>
<rect x="428" y="554" width="470" height="57" rx="7" fill="#FFFFFF" stroke="#46515C" stroke-width="2" stroke-dasharray="8 6"/>
<text x="663" y="592" class="s" text-anchor="middle">Prior same-type exposure</text>
<path d="M603 528 V550" fill="none" stroke="#46515C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray)" stroke-dasharray="7 6"/>
<text x="438" y="636" class="xs" text-anchor="start" style="fill:#46515C">Store for later actions</text>
<path d="M898 582 H920 V541 H1352 V532" fill="none" stroke="#46515C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray)" stroke-dasharray="7 6"/>
<text x="1309" y="582" class="s" text-anchor="start" style="fill:#46515C">R</text>
<path d="M2153 528 V643 H222 V532" fill="none" stroke="#0072B2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<rect x="1370" y="567" width="981" height="58" rx="7" fill="#FFFFFF" stroke="#0072B2" stroke-width="2"/>
<text x="1392" y="605" class="s" text-anchor="start" style="fill:#0072B2">Chronological: after batch · random / interest: next week</text>
<text x="1201" y="636" class="xs" text-anchor="middle" style="fill:#46515C">R → 0 ⇒ U → B</text>
<rect x="48" y="664" width="2304" height="88" rx="10" fill="#F1F3F5" stroke="#ACB6BE" stroke-width="2"/>
<text x="69" y="698" class="xs" text-anchor="start" style="fill:#46515C">COMPARE</text>
<text x="257" y="698" class="s" text-anchor="start">Random · Chronological · Interest-based   ×   3 seeds = 9 main runs</text>
<text x="69" y="736" class="xs" text-anchor="start" style="fill:#46515C">INTERVENE</text>
<text x="257" y="736" class="s" text-anchor="start">Interest-based: B=0 / D=1 / R=1   ×   3 paired repeats</text>
<text x="48" y="792" class="xs" text-anchor="start" style="fill:#46515C">Full-model reference reused; generation configurations differ between batches.</text>
