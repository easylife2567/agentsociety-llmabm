<text x="176" y="144" class="s" text-anchor="start" style="fill:#46515C">OBSERVE</text>
<text x="176" y="186" class="s" text-anchor="start">49,930 posts · two platforms</text>
<text x="176" y="221" class="xs" text-anchor="start" style="fill:#46515C">Douyin + Xiaohongshu</text>
<rect x="666" y="105" width="651" height="134" rx="12" fill="#E8F2F8" stroke="#0072B2" stroke-width="2"/>
<text x="690" y="145" class="s" text-anchor="start" style="fill:#0072B2">FROZEN INPUT</text>
<text x="690" y="186" class="b" text-anchor="start">Time-stamped external samples</text>
<text x="690" y="221" class="xs" text-anchor="start" style="fill:#46515C">Shared across regimes within each seed</text>
<rect x="1350" y="105" width="1002" height="134" rx="12" fill="#F1F3F5" stroke="#ACB6BE" stroke-width="2"/>
<g transform="translate(1392 159) scale(0.7)"><circle cy="0" r="13" fill="#FFFFFF" stroke="#17212B" stroke-width="2"/><path d="M-23 45 V30 Q-23 14 0 14 Q23 14 23 30 V45 Z" fill="#F1F3F5" stroke="#17212B" stroke-width="2"/></g>
<text x="1440" y="147" class="s" text-anchor="start" style="fill:#46515C">FIXED CONDITIONS</text>
<text x="1440" y="187" class="b" text-anchor="start">100 agents · 5 types · W12–W22</text>
<text x="1440" y="221" class="xs" text-anchor="start" style="fill:#46515C">One opportunity / agent / week · fixed types and thresholds</text>
<rect x="48" y="328" width="350" height="200" rx="12" fill="#E8F2F8" stroke="#0072B2" stroke-width="2"/>
<text x="69" y="370" class="h" text-anchor="start" style="fill:#0072B2">01  Candidate pool</text>
<rect x="428" y="328" width="350" height="200" rx="12" fill="#E8F2F8" stroke="#0072B2" stroke-width="2"/>
<text x="449" y="370" class="h" text-anchor="start" style="fill:#0072B2">02  Personal feed</text>
<rect x="808" y="328" width="610" height="200" rx="12" fill="#FFF0E4" stroke="#D55E00" stroke-width="2"/>
<text x="829" y="370" class="h" text-anchor="start" style="fill:#9C4300">03  Expression rule</text>
<rect x="1448" y="328" width="475" height="200" rx="12" fill="#FFF0E4" stroke="#D55E00" stroke-width="2"/>
<text x="1469" y="370" class="h" text-anchor="start" style="fill:#9C4300">04  Generate</text>
<rect x="1953" y="328" width="399" height="200" rx="12" fill="#FFF0E4" stroke="#D55E00" stroke-width="2"/>
<text x="1974" y="370" class="h" text-anchor="start" style="fill:#9C4300">05  Publish</text>
<text x="70" y="415" class="s" text-anchor="start">Eligible external +</text>
<text x="70" y="454" class="s" text-anchor="start">generated posts</text>
