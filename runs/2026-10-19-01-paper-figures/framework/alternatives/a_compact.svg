<text x="450" y="507" class="s" text-anchor="start">≤10 posts per action</text>
<text x="831" y="417" class="s" text-anchor="start">B baseline · D climate · R history</text>
<text x="1113" y="463" class="math" text-anchor="middle" style="font-size:37px">U<tspan baseline-shift="sub" font-size="22">it</tspan><tspan> = B</tspan><tspan baseline-shift="sub" font-size="22">i</tspan><tspan> + R</tspan><tspan baseline-shift="sub" font-size="22">it</tspan><tspan>(D</tspan><tspan baseline-shift="sub" font-size="22">it</tspan><tspan> − B</tspan><tspan baseline-shift="sub" font-size="22">i</tspan><tspan>)</tspan></text>
<text x="1113" y="507" class="s" text-anchor="middle">U ≥ fixed individual threshold?</text>
<text x="1471" y="415" class="s" text-anchor="start">Persona + ≤5 feed excerpts</text>
<text x="1471" y="455" class="s" text-anchor="start">≤120 characters per excerpt</text>
