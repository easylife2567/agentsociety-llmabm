<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="63.75mm" viewBox="0 0 2400 850" role="img" aria-labelledby="title desc"><title id="title">Complementary evidence for the reorganization of public representation</title><desc id="desc">Two complementary studies of postmortem public representation. Empirical and simulation panel areas: 40:60 (2350×270 versus 2350×405). Visibility configuration, selective expression and content recirculation form the proposed mechanism. All authors retain fixed types. Candle and flower icons indicate the mourning context, not a variable or a result.</desc><defs>
