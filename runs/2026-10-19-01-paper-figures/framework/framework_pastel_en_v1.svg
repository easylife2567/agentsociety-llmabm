<text x="287" y="945" class="head" text-anchor="middle">Curation regimes</text>
<text x="287" y="986" class="small" text-anchor="middle">Random · Chronological</text>
<text x="287" y="1020" class="small" text-anchor="middle">Interest-based</text>
<text x="287" y="1060" class="tiny muted" text-anchor="middle">Selection, retention and recirculation</text>
<rect id="baseline" x="590" y="385" width="550" height="150" rx="0" fill="#FFFFFF" stroke="#A5B99B" stroke-width="2.4"/>
<text x="615" y="425" class="head" text-anchor="start">B · Baseline expression utility</text>
<text x="615" y="468" class="small" text-anchor="start">Usual expression level calibrated</text>
<text x="615" y="501" class="small" text-anchor="start">from pre-event content supply.</text>
<rect id="climate" x="590" y="565" width="550" height="180" rx="0" fill="#FFFFFF" stroke="#A5B99B" stroke-width="2.4"/>
<text x="615" y="607" class="head" text-anchor="start">D · Opinion-climate response</text>
<text x="615" y="650" class="small" text-anchor="start">Current same-type content share</text>
<text x="615" y="684" class="small" text-anchor="start">relative to the type’s population share.</text>
<text x="615" y="718" class="tiny muted" text-anchor="start">Bounded nonlinear response</text>
<rect id="prior-history-weight" x="590" y="775" width="550" height="210" rx="0" fill="#FFFFFF" stroke="#A5B99B" stroke-width="2.4"/>
<text x="615" y="818" class="head" text-anchor="start">R · Exposure-dependent weight</text>
<text x="615" y="862" class="small" text-anchor="start">Based on prior cumulative contact</text>
<text x="615" y="896" class="small" text-anchor="start">with same-type content.</text>
<text x="615" y="950" class="tiny muted" text-anchor="start">Declines as cumulative exposure increases.</text>
<path d="M500 655 H586" fill="none" stroke="#171717" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M500 830 H545 V1094 H1120 V989" fill="none" stroke="#557B64" stroke-width="3" stroke-linejoin="round" marker-end="url(#state)" stroke-dasharray="10 7"/>
<text x="590" y="1042" class="small" text-anchor="start">Store current same-type exposure</text>
<text x="590" y="1075" class="small" text-anchor="start">for subsequent turns</text>
<path d="M1140 460 H1152 V885 H1140" fill="none" stroke="#65785F" stroke-width="2.5"/>
<path d="M1140 655 H1152" fill="none" stroke="#65785F" stroke-width="2.5"/>
<path d="M1152 655 H1185 V495 H1226" fill="none" stroke="#171717" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect id="utility" x="1230" y="385" width="495" height="205" rx="20" fill="#FFFFFF" stroke="#E2C65A" stroke-width="2.4"/>
<text x="1477" y="430" class="head" text-anchor="middle">Compute expression utility</text>
<text x="1477" y="494" class="math" text-anchor="middle">U<tspan baseline-shift="sub" font-size="24">it</tspan><tspan> = B</tspan><tspan baseline-shift="sub" font-size="24">i</tspan><tspan> + R</tspan><tspan baseline-shift="sub" font-size="24">it</tspan><tspan>(D</tspan><tspan baseline-shift="sub" font-size="24">it</tspan><tspan> − B</tspan><tspan baseline-shift="sub" font-size="24">i</tspan><tspan>)</tspan></text>
<text x="1477" y="548" class="math" text-anchor="middle">R → 0 ⇒ U → B</text>
<path d="M1477 590 V636" fill="none" stroke="#171717" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polygon id="threshold-diamond" points="1477,640 1705,735 1477,830 1250,735" fill="#FFFFFF" stroke="#E2C65A" stroke-width="3.5"/>
<text x="1477" y="726" class="head" text-anchor="middle">Utility ≥ individual</text>
<text x="1477" y="762" class="head" text-anchor="middle">threshold?</text>
<path d="M1705 735 H1811" fill="none" stroke="#171717" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1746" y="716" class="small" text-anchor="middle">Yes</text>
<path d="M1477 830 V925" fill="none" stroke="#171717" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1496" y="890" class="small" text-anchor="start">No</text>
