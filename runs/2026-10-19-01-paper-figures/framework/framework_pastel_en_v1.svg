<text x="2180" y="912" class="head" text-anchor="middle">Successful publication</text>
<text x="2180" y="954" class="small" text-anchor="middle">New post enters the</text>
<text x="2180" y="988" class="small" text-anchor="middle">regime-specific return process.</text>
<path d="M1837 1017 H2423" fill="none" stroke="#F0B58E" stroke-width="2"/>
<text x="2130" y="1056" class="tiny" text-anchor="middle">Track supply by fixed author type and later exposure</text>
