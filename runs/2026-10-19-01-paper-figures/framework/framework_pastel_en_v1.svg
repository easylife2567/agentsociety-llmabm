<path d="M1650 1365 V1435" fill="none" stroke="#C9CEC9" stroke-width="2"/>
<text x="75" y="1387" class="head" text-anchor="start">Main experiment</text>
<text x="75" y="1425" class="small" text-anchor="start">3 regimes × 3 seeds = 9 runs</text>
<text x="880" y="1387" class="head" text-anchor="start">Interest-based ablations</text>
<text x="880" y="1425" class="small" text-anchor="start">B = 0 · D = 1 · R = 1; 3 paired repeats each</text>
<text x="1675" y="1387" class="head" text-anchor="start">Observed outcomes</text>
<text x="1675" y="1425" class="small" text-anchor="start">Exposure · participation · supply · re-exposure</text>
<text x="1260" y="1487" class="tiny muted" text-anchor="middle">Ablations reuse the full-model reference; separate batches used different generation-service configurations.</text>
