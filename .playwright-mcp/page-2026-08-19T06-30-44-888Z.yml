          - paragraph [ref=f19e338]: 摘要：2025年，中国游戏市场实际销售收入为3 507.89亿元，同比增长7.68%。与此同时，用户规模达6.83亿人，同比增长1.35%。两项数据均再创新高。面对外部环境不确定性的挑战和新旧动能转换的压力，中国游戏产业始终坚持高质量发展，有效发挥了稳预期、促增长功能，落实国家发展战略，为激发全民族文化创新创造活力，繁荣发展社会主义文化注入了强劲动能。同时，国际形势复杂，我国游戏“出海”也受到多方面因素...
