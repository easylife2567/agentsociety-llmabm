          - paragraph [ref=f19e450]: 摘要：本文全面综述了国际深空探测任务设计的最新进展，涵盖月球探测、大行星探测及小天体探测领域。月球探测方面，介绍了美国Artemis计划、中国探月工程等地月空间战略布局；大行星探测方面，回顾了水星、金星、火星及木星、土星等外行星的探测历史与现状；小天体探测方面，探讨了其技术难点及科学意义，详述了小行星飞越、环绕、采样和撞击等任务。在此基础上，总结了深空探测任务的启示与发展趋势；结合我国深空探测能力与国际...
