            - text: ",NCM)的全固态锂电池（ASSLIBs），因其固态电解质结构带来的高安全性以及高理论比容量，成为目前最具发展前景的锂电池技术。然而该固态锂电池体系的发展面临多重挑战：高镍正极固有的阳离子混排、颗粒内部微裂纹、气体与过渡金属溶出等缺陷，其面向固态电池应用新增的包含内部孔隙导致的离子传输阻塞、脱嵌引发的颗粒体积收缩、接触失效的结构劣化以及..."
          - generic [ref=f19e533]:
            - generic [ref=f19e534]: 主编荐语
            - generic [ref=f19e536]: 张丹（编辑部主任）： 本文分别从高镍正极材料以及其与固态电解质的界面角度出发，详细描述了包括锂/镍（Li+/Ni2+）混排、晶内与晶间微裂纹、气体释放与过渡金属溶出在内的材料本征结构失效机理以及其与固态电解质间界面存在的机械接触失效、空间电荷层、界面化学/电化学副反应等匹配问题。回顾总结了目前为止针对高镍正极材料在固态电池中应用的具体改性策略进展，其中包括针对高镍正极材料本身的改性策略以及高镍正极材料/固态电解质界面改性策略。并提出高镍正极材料在固态电池中的应用在未来的发展趋势。
