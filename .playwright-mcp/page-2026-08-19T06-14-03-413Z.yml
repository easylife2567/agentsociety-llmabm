            - generic [ref=f11e454]: 罗斌（执行主编）： 本文面向深空探测任务总体设计需求，系统梳理了近七十年来国际深空探测任务的发展脉络与最新进展，覆盖月球、大行星及小天体三大方向。文章在对比分析全球任务经验以及前人研究的基础上，进一步汇总提炼出：深空探测“技术—科学”双轮驱动、多目标多任务与智能自主化的发展趋势，并结合我国能力基础提出海王星行星系探测、近地小行星大规模飞越、月球洞穴勘测与Apophis探测等具有前瞻性的任务设想，为我国未来深空探测任务论证与轨道设计提供了结构化参考。建议重点研读第1–3章的任务梳理与表格化对比，以及第4章“启示与建议”（尤其4.1与4.2）中对趋势判断与任务机会的凝练总结。
