            - generic [ref=f11e309]: 章连香（执行主编）： 本文基于无数科研工作者对X射线光电子能谱(XPS)数据处理无从下手的困惑，主要介绍XPS数据的处理方法及分析步骤。通过对发表文献总结发现，大多数科研工作并不了解XPS常用的权威数据库，大多是盲目引用，这个趋势正愈演愈烈。然而，很多已发表文献有不同类型的分析错误。本文为XPS的数据处理方法提供了参考，建议重点阅读第二章的分析工具及第三章的分析方法和技巧，以了解常用的数据库、荷电校准、元素定性定量及自洽的重要性等，文章末尾也列举了一些常见的分析错误，希望对科研能起到抛砖引玉的作用，让更多科研工作者在分析时能避免错误，正确地指引科研道路，为科研的发展添砖加瓦。
