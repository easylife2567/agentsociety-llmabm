      - list [ref=e112]:
        - listitem [ref=e113]: "{Reference Type}: Newspaper Article {Title}: 别只顾一时热流量而忘了安全冷思考 {Author}: 白华宇 {Secondary Title}: 大众健康报 {Date}: 2026-01-21 {Pages}: 011 {Publisher}: 大众健康报 {Notes}: 51-0075 {URL}: https://link.cnki.net/doi/10.28213/n.cnki.ndzjk.2026.000077 {DOI}: 10.28213/n.cnki.ndzjk.2026.000077 {Database Provider}: CNKI"
        - listitem [ref=e114]: "{Reference Type}: Newspaper Article {Title}: 打“假”短视频 回归真流量 {Author}: 崔玲玲 {Secondary Title}: 山西日报 {Date}: 2025-05-07 {Pages}: 011 {Publisher}: 山西日报 {Notes}: 14-0001 {URL}: https://link.cnki.net/doi/10.28713/n.cnki.nshxr.2025.002316 {DOI}: 10.28713/n.cnki.nshxr.2025.002316 {Database Provider}: CNKI"
        - listitem [ref=e115]: "{Reference Type}: Thesis {Title}: Y互联网教育公司IP营销策略优化研究 {Author}: 李鸿轩 {Tertiary Author}: 贾利军 {Publisher}: 华东师范大学 {Type of Work}: 硕士 {Year}: 2024 {Keywords}: IP营销;内容营销;营销策略优化 {Abstract}: 随着流量时代以及自媒体时代的到来,个人IP成为当下营销的热词,IP营销成为大势所趋。同时,我国研究生招生规模持续扩大,随着线上教育的兴起,考研教育培训行业竞争愈加激烈。各大考研教育培训公司对市场占有率的竞争方式,从传统营销策略纷纷转向IP营销的营销策略,以寻求破局。 本文以Y互联网教育公司为例,探讨了其在不同用户阶段的IP营销中存在的问题,并分析了如何突破困境,以维持IP营销的可持续发展。 基于上述背景,本文以Y互联网教育公司为例,聚焦其IP营销的策略方式,并采用文献研究法、案例分析法和访谈法等研究方法,深入分析了考研行业互联网教育公司的IP营销现状,基于内容营销5A理论模型中的“认知、吸引、问询、行动、拥护”五个阶段,分析了其IP营销策略存在的问题。研究发现,Y公司在内容营销维度的IP营销过程中,用户关注度不平衡、用户互动量不稳定、用户问询意愿下降、用户购买意愿减弱以及用户黏性弱易流失。究其原因是IP影响力势能有差距、IP内容创作有特殊性、IP内容引流能力较弱、IP内容转化率待提高以及IP内容难以沉淀用户。 针对这些问题,本文针对5A的五个阶段提出了一系列优化改进对策,包括扩充名师规模提升用户能见度、精细化内容运营来加强内容吸引力、拓展用户周期增强内容引流力、经营KOC合作完善内容获客力以及提升口碑营销塑造内容转粉力。 这些研究成果旨在提升Y公司IP营销的效果,同时对于Y公司在考研教育市场的长远发展具有重大意义,也为其他教育企业在制定IP营销策略时提供了宝贵的借鉴。 {URL}: https://link.cnki.net/doi/10.27149/d.cnki.ghdsu.2024.001060 {DOI}: 10.27149/d.cnki.ghdsu.2024.001060 {Database Provider}: CNKI"
        - listitem [ref=e116]: "{Reference Type}: Newspaper Article {Title}: 网络主播为博流量虚构学历经历 {Author}: 韩丹东; 张婉莹; 李丹 {Secondary Title}: 法治日报 {Date}: 2024-10-25 {Pages}: 004 {Publisher}: 法治日报 {Notes}: 11-0313 {URL}: https://link.cnki.net/doi/10.28241/n.cnki.nfzrb.2024.006418 {DOI}: 10.28241/n.cnki.nfzrb.2024.006418 {Database Provider}: CNKI"
        - listitem [ref=e117]: "{Reference Type}: Journal Article {Title}: 解析流量密码：基于电商直播带货的研究 {Author}: 李亘; 许加彪 {Author Address}: 内蒙古师范大学新闻传播学院;陕西师范大学新闻与传播学院; {Journal}: 传媒 {Year}: 2024 {Volume}: {Issue}: 15 {Pages}: 70-72 {Keywords}: 流量密码;直播带货;电商平台 {Abstract}: 作为互联网新经济业态的重要组成部分，直播带货在流量思维的主导下成为电商行业新的增长爆发点，更成为值得深入探讨的议题之一。从电商的角度出发，获取流量的要义体现在对主播人设、直播间策略以及平台机制的精心设计之中。通过对这三个层面采取不同策略，最终达成吸引关注、聚集流量的现实诉求。总体而言，“主播、直播间、平台”三维一体的联动布局能产生更加可观的流量效应，这也是电商直播带货获取流量的关键所在。 {ISBN/ISSN}: 1009-9263 {Notes}: 11-4574/G2 {URL}: https://kns.cnki.net/kcms2/article/abstract?v=wYvQo-F_OPYUna9lFQerXtGNgjCuYfV8amC366GIUNiOuKpsJ_tIxA5KH-WQu0en3TBgcGlpoTVLXgTEY7_3sXm326j-T3Y6ZSIueWWWlDR_CWtzQCOWjrgAJJg-hoJf2BAjOSDFDahO8RflpC8B09pm6bU0VK71IOYpBrtHpo_VmghgNVB4Yls8uN5BqSVj&uniplatform=NZKPT&language=CHS {Database Provider}: CNKI"
        - listitem [ref=e118]: "{Reference Type}: Thesis {Title}: 自媒体传播中企业法人名誉权的侵害与保护研究 {Author}: 刘燕 {Tertiary Author}: 杨秀 {Publisher}: 重庆大学 {Type of Work}: 博士 {Year}: 2024 {Keywords}: 自媒体;侵权;企业法人名誉;社会共治 {Abstract}: 数字化时代下,自媒体平台作为信息传播的重要渠道,不仅展现出了空前的活力,同时其也极大地拓宽了公众的舆论表达空间。据相关统计,自2014年起,我国自媒体行业的从业者数量呈指数级增长,至2021年,已有近千万人加入这一行业,共同构建了一个庞大而复杂的自媒体生态系统。然而,自媒体影响力的膨胀也带来了一系列挑战,特别是对企业而言,其名誉权益在自媒体的浪潮中变得尤为脆弱。 企业,作为具有公共和商业双重属性的经济实体,其声誉正逐渐成为自媒体追求流量和商业利益的牺牲品。具体表现为一些自媒体为了吸引眼球和增加流量,不惜对热点事件和企业进行恶意炒作,甚至形成了一种“借题发挥-引导舆论-积累粉丝-获取收益”的灰色营销模式,他们通过制造和传播虚假信息,通过跨平台的自媒体网络对企业形象造成严重损害。此外,网络黑公关、恶意差评、敲诈勒索等违法行为也对公共利益和企业法人名誉权构成了巨大威胁。因此,如何有效规范自媒体传播活动并更好地保护企业法人的名誉权,已然成为一个亟待解决的重要问题。 本文主要回答了五个方面的问题。第一,自媒体传播中企业法人名誉权的立法和司法保护现状如何?第二,自媒体侵害企业法人名誉权的重要影响因素和传播规律是怎样的?第三,自媒体传播中不同主体侵害企业法人名誉权的主要类型及法律治理困境如何?第四,我国企业法人名誉权保护面临怎样的整体性治理问题?第五,如何构建符合自媒体传播语境的企业法人名誉侵权的共治体系? 本文包含绪论和结语在内,共计十章。其中第二章至第九章是论文的核心部分,这八章内容贯穿了理论与实践、立法与司法、治理问题与解决对策等多个层面,以尽可能从多个维度展现对研究主题的思考。具体而言: 首先是理论层面,第二章阐明了“自媒体”的广义内涵,认为自媒体的范畴不应仅限于微博、微信公众号、短视频等载体平台,应从更宽泛的视角予以理解,还包括运营这些账号进行信息传播活动的主体,以及其在各种社交媒体空间中的传播实践。同时还辨析了法人名誉权的复合权利属性,分析了言论自由与企业名誉权保护的张力关系,并论述了商业言论、法人名誉权的人格权理念、平台责任以及社会共治等相关理论基础。 其次是制度层面,第三章梳理和评析了《民法典》关于企业法人名誉权保护的立法现状及法律变革,并总结了行政法、经济法、刑法和平台治理领域的相关制度实践,揭示出我国在企业法人名誉权保护上已初步形成多元主体协同治理的体系框架。此外,本章还将视野延伸至国际层面,对比分析了国内... {URL}: https://link.cnki.net/doi/10.27670/d.cnki.gcqdu.2024.000290 {DOI}: 10.27670/d.cnki.gcqdu.2024.000290 {Database Provider}: CNKI"
        - listitem [ref=e119]: "{Reference Type}: Newspaper Article {Title}: 网红言论过边界应纳入劣迹名单监管 {Author}: 文丽娟; 王艺韬 {Secondary Title}: 法治日报 {Date}: 2024-03-26 {Pages}: 004 {Publisher}: 法治日报 {Notes}: 11-0313 {URL}: https://link.cnki.net/doi/10.28241/n.cnki.nfzrb.2024.001730 {DOI}: 10.28241/n.cnki.nfzrb.2024.001730 {Database Provider}: CNKI"
        - listitem [ref=e120]: "{Reference Type}: Journal Article {Title}: 985院校传播学教授流量不如网红，新闻学还能学吗？ {Journal}: 上海广播电视研究 {Year}: 2023 {Issue}: 3 {Pages}: 8-10 {Abstract}: <正>在2023年全国高考结束之际，考生们开始将目光投向志愿填报，畅想自己未来的职业道路。全网拥有2500万粉丝的“网红”考研培训老师张雪峰却在直播中放话：“中国本科专业目录里边，你闭着眼睛摸一个都比新闻好。”“孩子非要报新闻学，我一定把他打晕。”“一个985院校教新闻传播的教授，自媒体账号粉丝数和流量不如我，这里面是不是多少有点问题？”随着张雪峰的言论热度持续攀升，不少大学新闻学院教授加入战局，各抒己见，吸引了一大波围观群众。 {ISBN/ISSN}: 2096-4242 {Notes}: 31-2127/G2 {URL}: https://kns.cnki.net/kcms2/article/abstract?v=wYvQo-F_OPae4wypvd5DonxV-DaCj9BUfDHSYUl9qDL2vbba2WT0oK7FkGkEbNqivyRlvimMfF1Z9kFWXOtGMyNDMgZ2W0dlqYOH0maWe3w3kiNYWOS2TfhV8YvLCQLK8G8xFhvQuCUSYm-NT9SHRSMUfy2LWqkgW-xaVU2nrhz9kstWsBQ5RkiipcGg_IGO&uniplatform=NZKPT&language=CHS {Database Provider}: CNKI"
        - listitem [ref=e121]: "{Reference Type}: Thesis {Title}: 流量明星“人设崩塌”现象的批判研究 {Author}: 刘皓琼 {Tertiary Author}: 魏传光 {Publisher}: 暨南大学 {Type of Work}: 硕士 {Year}: 2023 {Keywords}: 流量明星;“人设崩塌”;批判 {Abstract}: 在当前的语境中,“人设”已经从一种技术话语转向社会话语的建构,其内涵和外延的表意也拥有了更为丰富的阐释面向。近一时期流量明星“人设崩塌”现象触发的社会问题不断,逐渐引发社会各界对流量明星发展问题的关注。作为特殊的精神生产的传播者,流量明星在满足人民多样化文化需求、提高人民群众文化素养等方面发挥着积极的作用。然而,流量明星在现实的发展中却存在着违反法律法规、突破道德底线等不良导向性问题,这表明对于流量明星“人设崩塌”现象的有关研究值得我们进一步发散拓展。 以往关于“人设”的文献更多集中于研究“人设”产生的动力因素和粉丝文化视域下的“人设”,包括分析“人设”的定义、“人设”的塑造方式和“人设”的影响等,较少从批判的角度对流量明星“人设崩塌”现象进行研究。本文基于流量明星“人设崩塌”现象在娱乐圈的现实表现,对其产生缘由和社会影响进行反思,并进一步挖掘嵌入在流量明星“人设崩塌”现象背后的实质内容。在此基础上,本文尝试从国家层面的思想引领力、政治引领力和体制引领力,社会层面来自经纪公司、媒体、粉丝的监管合力,个人层面来自明星自身的自觉力,这些方面对流量明星“人设崩塌”现象的治理路径展开论述,期望对改善流量明星“人设崩塌”现象有所裨益。 本文以批判反思的态度看待流量明星“人设崩塌”现象,希望能够去除各方关于流量明星“人设”问题的偏见,也希望能够引发关于流量明星健康发展问题的深思考。 {URL}: https://link.cnki.net/doi/10.27167/d.cnki.gjinu.2023.001514 {DOI}: 10.27167/d.cnki.gjinu.2023.001514 {Database Provider}: CNKI"
        - listitem [ref=e122]: "{Reference Type}: Thesis {Title}: 流量明星对青少年思想道德的影响及对策研究 {Author}: 钟丹凤 {Tertiary Author}: 陈志勇 {Publisher}: 福建师范大学 {Type of Work}: 硕士 {Year}: 2022 {Keywords}: 流量明星;青少年;道德 {Abstract}: 流量明星是伴随着互联网的发展孕育而生的新兴群体,他们往往因光鲜亮丽的外表和在某一领域的突出能力,深得青少年粉丝群体的喜爱。流量明星对青少年粉丝影响力大,一方面,他们积极的一面能够为广大青少年树立正向的示范作用;另一方面,部分流量明星给青少年带来了负面的影响,主要体现在:行为失范,误导青少年模仿效仿;引导失位,纵容青少年偏激行为;违法失德,扭曲青少年的价值观。物有本末,事有终始。知所先后,则近道已。要解决青少年追逐流量明星过程中产生的种种负面现象,必须要找出背后的原因。从表面上看,原因在于流量明星的德不配位和青少年的心理尚未发展成熟。然而背后有更深层次的社会诱因,与资本追逐利润的天性、影视行业的浮躁风气、饭圈不良文化的侵蚀、媒介革命的冲击挑战、学校审美教育的缺失是分不开的。因此,政府、流量明星、学校应协同发力,关心青少年的健康成长,加强对青少年的引导与纠偏。政府要引导流量明星成为德艺双馨的艺人,将关注度和流量转化为正能量,让流量回归正途。学校必须要积极关注流量明星的作品对青少年价值观的输出,加强思想政治教育工作的创新发展。政府应持续整治娱乐圈相关乱象,相关部门协同联动,线上线下齐抓共管,营造风清气正的环境。 {URL}: https://link.cnki.net/doi/10.27019/d.cnki.gfjsu.2022.001692 {DOI}: 10.27019/d.cnki.gfjsu.2022.001692 {Database Provider}: CNKI"
        - listitem [ref=e123]: "{Reference Type}: Thesis {Title}: 微观权力视域下两性纠纷引发的在线“讨公道”行为及其规制研究 {Author}: 李晓蔚 {Tertiary Author}: 蒋晓丽 {Publisher}: 四川大学 {Type of Work}: 博士 {Year}: 2022 {Keywords}: 在线“讨公道”;微观权力;行动者网络;话语分析;博弈机制 {Abstract}: “讨公道”是中国社会里一个既常见又重要的观念。在日常生活中,人们常用“公道自在人心”“是非自有公论”来对个体的社会交往行为进行评判,“讨公道”则是中国人处理社会纠纷的重要方式。在信息技术的高速发展下,政治、经济、文化等社会系统的运行已然与互联网技术深度融合,人们也习惯于“云端相会”,在此技术架构之上所构建的社交媒体平台成为生产“公论”的重要空间,公开而持续的在线“讨公道”行动已从一种异常的、次要的、局部的或暂时的行动,逐步成为常态的、重要的、广泛的实践,成为人们在日常生活中处理纠纷、展开抗争的重要武器。简言之,在线“讨公道”这一现象既反映了我国社会交往的文化语境,又体现了当下互联网技术对人际交往原则、纠纷处理方式的影响。 在各种类型的人际交往纠纷中,两性纠纷则是最基础、也是最受关注的方面之一。随着社会文明的发展和两性交往方式的多样化,传统的伦理道德价值观念受到冲击,人们的感性生活在经济、技术、文化等多重因素的影响下引发的社会问题逐渐显现。对中国互联网近十年的网络舆情热点事件的分析也证实了,随着新媒体政务的快速发展、网络舆论引导的普及、法律政策制度的完善以及互联网对日常生活的深度嵌入,中国社会网络舆情的关注点经历了一个从“社会与法”到“社会民生”的转变过程,而网络行动的关注对象呈现出从“公共政策”转向“公序良俗”的显著趋势,越来越多地从社会公共事件向私人领域的两性纠纷事件转移。尽管存在争议,两性纠纷引发的在线“讨公道”行为在社交媒体中越来越成为一种“新常态”。 2020年被网民戏称为“瓜年”,两性纠纷引发的在线“讨公道”事件在社交媒体上层出不穷,造成了巨大的社会影响。这些事件之所以能在全社会范围内快速传播并在社会场域的博弈中实现权力关系的逆转,主要有源自于四个条件:第一,互联网社会高流动性、低组织性的空间特性;第二,两性纠纷的话题特殊性;第三,事件危害社会规范的程度;第四,人物身份的公共性。其中,第四个由于涉及公众人物而更容易引起舆论关注并引发广泛抨击,但作为一种类型化的现象,前三个条件则更为基础。在这样的社会环境下,两性纠纷中的在线“讨公道”者利用了何种方式介入了原有的不公格局,改变力量对比关系、进而达到自己的目的?这种“权力”又是如何产生、传递和运行的?显而易见的经验是,这类“私对私”的事件研究不同于传统“私对公”的社会抗争研究或网络舆论监督研究。不仅如此,两性纠纷各方当事人的情感矛盾和利益诉求孰重孰轻、孰是孰... {URL}: https://link.cnki.net/doi/10.27342/d.cnki.gscdu.2022.001174 {DOI}: 10.27342/d.cnki.gscdu.2022.001174 {Database Provider}: CNKI"
        - listitem [ref=e124]: "{Reference Type}: Thesis {Title}: 自媒体侵权民事责任法律问题研究 {Author}: 孙连滨 {Tertiary Author}: 翟云岭 {Publisher}: 大连海事大学 {Type of Work}: 博士 {Year}: 2021 {Keywords}: 自媒体侵权;责任构成;责任承担;损害客体;抗辩事由 {Abstract}: 互联网大数据时代的到来使得信息传播具有了新的内涵,以微博、微信、短视频以及其他社交媒体为代表的自媒体已经成为网民获取信息和社会交往的重要渠道。但与此同时,以自媒体为媒介实施的侵权行为频频发生。大量的自媒体侵权行为涉及的损害客体、侵权责任构成、责任分配等诸多方面,均有其明显的特殊性。尽管现实中各种冲突问题日益凸显,法学理论界与实务界对此亦有所关注,但是针对自媒体侵权问题的专项研讨尚显不足。因此,对于自媒体侵权涉及的诸多法律问题的研究是很有必要的。 笔者基于自媒体侵权的特殊属性,结合已有的法律规范与司法实践,同时参考了国外对自媒体侵权问题的立法与实践,对自媒体侵权责任中涉及的基本法律问题进行系统性研究。力求厘清担当内容发布者与传播者角色的自媒体平台用户和作为网络服务提供者角色的自媒体平台等主体的权利义务,重点在于明晰自媒体侵权责任认定、承担、限制等方面的规则。期望为我国自媒体侵权责任法律规制的完善提供理论依据和立法建议。 全文共六章,主要内容如下: 第一章以自媒体定义、自媒体侵权行为发生的场域入手,对自媒体侵权类型以及自媒体侵权参与主体的义务构造予以分析,之后对自媒体侵权的特殊性加以归纳,并以实证分析的方式说明自媒体侵权近年呈现出的新态势,提出基于自媒体侵权的特殊性完善对其予以规制的法律制度的必要性。 第二章研究自媒体侵权的责任构成,结合自媒体侵权的特征探究自媒体侵权行为造成损害结果后责任认定的边界,其中恰当适用于自媒体侵权责任的归责原则以及构成要件是这个部分的研究重点。纵观自媒体侵权责任归责原则,目前整体上是适用过错责任原则,如果从利益平衡、责任分配以及受害人保护的角度考虑,设基于不同主体确定不同的举证责任进行差异化的综合运用更加合理。对于自媒体侵权责任的构成要件,行为的违法性是责任构成的关键,不同行为主体的过错需要被区分解析,损害结果体现了自媒体传播特点,因果关系要件也有其自身的复杂性。 第三章通过对自媒体侵权损害客体的扩展从而推进对自媒体侵权责任的理解。既有的学术研究以及出台的相应法律法规一般是将自媒体侵权的客体限定在人格权中或者是知识产权中,这种限定实际上是极大程度地缩小了自媒体侵权损害客体的范围,不利于我国自媒体侵权纠纷的解决。如果扩充无形人格权的范围,将自媒体环境中体现为某种含有个人可识别特征的信息并入进去,赋予主体对这些权益的控制、决定权利,加之承认商品化人格权相对独立的法律地位,协同认可自媒体活动中权... {URL}: https://link.cnki.net/doi/10.26989/d.cnki.gdlhu.2021.000122 {DOI}: 10.26989/d.cnki.gdlhu.2021.000122 {Database Provider}: CNKI"
        - listitem [ref=e125]: "{Reference Type}: Journal Article {Title}: 流量时代下90后对轻奢品牌的消费心理及购买意愿研究 {Author}: 楚静; 黄晟 {Author Address}: 北京第二外国语学院中瑞酒店管理学院;英国莱斯特大学; {Journal}: 中国商论 {Year}: 2021 {Volume}: {Issue}: 16 {Pages}: 27-30 {Keywords}: 90后消费者;轻奢品牌;消费心理 {Abstract}: 90后逐渐成为当今中国轻奢侈品市场消费的重要组成部分。文章以1990年至1999年出生的公民为研究对象,通过问卷调查,研究90后对轻奢侈品消费的态度,以及流量明星、社交媒体营销对轻奢侈品牌消费的影响程度。研究发现:第一,明星效应及社交媒体广告对90后消费者的影响比较大;第二,对于不同的社交媒体平台及公众人物影响并无太大差别;第三,轻奢侈品牌的设计是90后消费者最为在意的因素。基于此,对于90后的消费者,文章建议轻奢品牌的管理者使用社交媒体和明星效应进行营销的同时,也应注重产品本身的时尚设计。 {ISBN/ISSN}: 2096-0298 {Notes}: 10-1337/F {URL}: https://link.cnki.net/doi/10.19699/j.cnki.issn2096-0298.2021.16.027 {DOI}: 10.19699/j.cnki.issn2096-0298.2021.16.027 {Database Provider}: CNKI"
        - listitem [ref=e126]: "{Reference Type}: Thesis {Title}: 算法推荐新闻对受众价值观的影响及其引导机制研究 {Author}: 李巧雯 {Tertiary Author}: 孙丽君;王邵军 {Publisher}: 山东财经大学 {Type of Work}: 硕士 {Year}: 2021 {Keywords}: 算法推荐;价值观;今日头条;引导机制 {Abstract}: 随着大数据与人工智能时代的到来,算法推荐作为一种全新的新闻传播形式,逐渐在众多新传播技术中占据重要地位,成为现如今网络新闻的主流分发模式。当下,这种依据大数据分析用户画像的新闻推荐技术,能够满足受众对信息的个性化需求,也在技术与观念层面为新闻传播行业带来重大突破。但我国网络发展环境变化复杂,人们的利益诉求多样,随着算法推荐的应用与发展,“信息茧房”效应、“回音室”效应等相继出现,其延伸出来诸多负面影响尤其是对受众价值观的影响格外明显。处在信息化社会中,人们的思想道德与精神文明程度等价值观体系直接关系到国家与民族未来的精神面貌。算法推荐新闻作为直接面向大众、为大众提供精神文化产品的重要方式之一,在普及应用的过程中是否符合社会主流价值观、能否平衡社会效益和经济效益的关系,决定它未来的发展趋势。本文试图运用个案分析法——以“今日头条”为例,结合文献研究法和跨学科研究法,对算法推荐新闻与受众价值观的相关概念、理论等进行基础梳理,综合阐释算法推荐新闻对受众价值观的影响层面及其引导机制构建的方法与缘由;分别从算法推荐新闻对受众个体价值观的影响和对受众群体价值观的影响两方面展开分析,重点从算法推荐新闻对个体价值观发生条件、形成过程和对群体价值观构建过程、确证过程中总结产生影响的表现;并提出了在算法推荐新闻的生产与消费过程中对受众价值观的正确引导机制,即要解决受众价值观引导问题,需要政府、企业、受众及公众人物共同作为。总之,在算法推荐新闻及其他大数据的实际应用中,要平衡好技术价值与受众价值观引导。让人们享有更高质量的精神文化生活,树立积极健康的价值观,这对共促文明进步、建设精神文明社会具有重大意义。 {URL}: https://link.cnki.net/doi/10.27274/d.cnki.gsdjc.2021.000804 {DOI}: 10.27274/d.cnki.gsdjc.2021.000804 {Database Provider}: CNKI"
        - listitem [ref=e127]: "{Reference Type}: Journal Article {Title}: 算法推荐隐私保护机制研究 {Author}: 夏梦颖 {Author Address}: 华东政法大学马克思主义学院; {Journal}: 编辑学刊 {Year}: 2021 {Volume}: {Issue}: 3 {Pages}: 24-29 {Keywords}: 算法推荐;隐私;平台;机制 {Abstract}: 平台算法推荐分发模式引发用户隐私风险,一方面因算法内在功能设计而触发隐私泄露风险,另一方面因算法在智能传播领域的不当使用,易导致舆论操纵,产生虚假流量,助推虚假信息泛滥,加速涉私信息传播二次伤害。算法推荐消解传统区分公众人物和普通用户的隐私保护制度,无法应对用户面临的隐私风险;消解平台信息内容审核制度,无法规制涉私非法信息的传播;消解传统法律追责思路,导致平台推卸隐私保护责任。应当建立算法推荐风险管理和日常管理机制,完善算法选择技术机制,以防算法推荐不当涉私信息,增强平台对用户隐私权益的保护。 {ISBN/ISSN}: 1007-3884 {Notes}: 31-1116/G2 {URL}: https://kns.cnki.net/kcms2/article/abstract?v=wYvQo-F_OPZle08ac3Zl9FOAOBvV6eBzw5KUCkG0HcBi2yrHszUQYAg7yS5bDHjp9oASY7w_wvtvnAalpbz_so-5Kc4rJ4Tkl8bJwDqcczETzrINILan6jMjf1U3SRvFp__Yv1EptKYN9HXG2l8vxkhZ1Tu3adeT4qls_kwo1mOheHg--iyqNPL3sQ4T8wat&uniplatform=NZKPT&language=CHS {Database Provider}: CNKI"
        - listitem [ref=e128]: "{Reference Type}: Thesis {Title}: 自媒体时代网红道德责任培育研究 {Author}: 肖银 {Tertiary Author}: 吴瑾菁 {Publisher}: 江西师范大学 {Type of Work}: 硕士 {Year}: 2021 {Keywords}: 自媒体时代;网红;道德失范;道德责任培育 {Abstract}: 道德责任作为人类生存发展的普遍规范,本质上是一种社会关系的体现,表现为人与人之间的内在规定,它是个体对他人及社会价值链条的主观判断和行为选择。道德责任贯穿于人类生活和发展的始终,公民只有不断将道德责任内化于心,外化于行,才能推动社会的健康发展。网红是互联网技术和社会经济相互交融和发展的产物,它是自媒体时代的一股新鲜血液,不仅为社会经济的发展注入了生机与活力,而且给人民大众带来了全新多元的价值观念。但不可否认的是,网红也引起了各种道德责任危机和社会问题,由于自媒体的传播迅速和影响范围广泛的特点,不良网红现象不断冲击着国家的道德底线,激化矛盾,破坏社会的和谐稳定。本文一共五个部分,以自媒体时代为背景,针对网红这一特殊的新兴群体,深入分析研究网红兴起泛滥所引起的一系列道德责任缺失现象,希望能为解决网红带来的社会问题提供思路。第一部分通过对国内外道德责任思想理论研究的追溯,以及对国内外网红问题研究的现状分析,阐述本文的选题背景和研究意义,确定自己的研究方向和研究内容,并作好思路和方法上的思考和设计;第二部分从学术上对自媒体、网红和道德责任进行了概念性的厘定,从本质上归纳了自媒体、网红和道德责任的特点,从历史维度对讲述了自媒体的类型和网红的发展变迁,从理论上对道德责任和道德义务进行了区分,并归纳出网红道德责任的主要内容;第三部分采用了调查问卷的方法对网红道德责任现状进行数据分析,并根据大量的网红道德案例,对网红现象的正面影响和负面影响进行深入探讨,揭示网红道德责任缺失对社会的危害;第四部分从网红主体道德责任意识不强、网红受众鼓动助长不正之风、网红背后资本对道德责任的裹挟、市场经济的负面影响以及道德责任“把关人”作用的缺失五个方面剖析其道德责任缺失的成因;最后,依据前文对网红道德责任问题的现状和原因的分析,有针对性地提出网红道德责任的培育提升路径,具体是从网红加强自我规范、受众提高道德素养、媒体做好宣传引导、网红企业强化社会责任和政府完善相关法律法规这五个方面实施,只有通过多方的共同努力和相互配合,才能更好地发挥道德责任的积极作用,推动社会道德文明的进步。 {URL}: https://link.cnki.net/doi/10.27178/d.cnki.gjxsu.2021.000080 {DOI}: 10.27178/d.cnki.gjxsu.2021.000080 {Database Provider}: CNKI"
