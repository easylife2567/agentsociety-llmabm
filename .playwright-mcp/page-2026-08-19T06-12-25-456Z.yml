                - definition [ref=f9e3973]:
                  - paragraph [ref=f9e3974]: SU=主题, TKA=篇关摘, TI=篇名, KY=关键词, AB=摘要, CO=小标题, FT=全文, AU=作者, FI=第一作者, RP=通讯作者, AF=作者单位, LY=期刊名称, RF=参考文献, FU=基金, CLC=中图分类号, SN=ISSN, CN=CN, DOI=DOI, QKLM=栏目信息, FAF=第一单位, CF=被引频次
                - term [ref=f9e3975]: 示例：
                - definition [ref=f9e3976]:
                  - paragraph [ref=f9e3977]: 1）TI='生态' and KY='生态文明' and (AU % '陈' + '王' ) 可以检索到篇名包括“生态”并且关键词包括“生态文明”并且作者为“陈”姓和“王”姓的所有文章；
                  - paragraph [ref=f9e3978]: 2）SU='北京' * '奥运' and FT='环境保护' 可以检索到主题包括“北京”及“奥运”并且全文中包括“环境保护”的信息；
                  - paragraph [ref=f9e3979]: 3）SU=('经济发展' + '可持续发展') * '转变' - '泡沫' 可检索“经济发展”或“可持续发展”有关“转变”的信息，并且可以去除与“泡沫”有关的部分内容。
