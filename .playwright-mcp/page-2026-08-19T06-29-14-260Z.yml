          - paragraph [ref=f17e377]: 摘要：土壤重金属污染对农作物生长和人体健康都有严重危害，现场快速检测对土壤重金属污染调查、应急监测具有重要意义。采用自主研发的土壤重金属激光诱导击穿光谱现场快速检测仪对矿区周边土壤进行现场检测分析，以835个不同基质土壤的光谱数据建立定标数据库，通过支持向量机建立回归模型对土壤重金属元素含量进行定量反演。现场检测获取的全波段光谱波动在15%以内，Cd、Cr、Cu、Ni、Pb和Zn等6种元素光谱强度相对标...
          - generic [ref=f17e378]:
            - generic [ref=f17e379]: 主编荐语
            - generic [ref=f17e381]: 章连香（执行主编）： 土壤重金属现场快速检测是污染调查与应急监测的核心需求，传统实验室方法难以满足时效性要求。本文自主研发便携式激光诱导击穿光谱（LIBS）检测仪，基于 835 个不同基质土壤构建定标数据库，通过支持向量机回归模型实现 Cd、Cr 等 6 种重金属定量反演。仪器光谱波动≤15%，元素光谱强度 RSD 均值仅 6.31%，与 ICP-MS 检测结果的皮尔逊相关系数 0.8501~0.9829，80% 以上结果处于 ±30% 相对误差区间。该设备便携高效、稳定性强，1 分钟即可完成单样品多元素检测，有效突破现场检测瓶颈，为矿区土壤污染筛查、应急监测提供了实用技术方案，值得环境监测、土壤治理领域从业者关注
