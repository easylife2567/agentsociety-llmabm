      - list [ref=e112]:
        - listitem [ref=e113]: "{Reference Type}: Journal Article {Title}: 算法推荐时代网络思想政治教育面临的挑战及对策 {Author}: 代枫 {Author Address}: 武汉大学; {Journal}: 甘肃教育研究 {Year}: 2023 {Volume}: {Issue}: 1 {Pages}: 4-7 {Keywords}: 算法推荐;网络思想政治教育;信息茧房;价值引领 {Abstract}: 算法推荐作为一种全新的信息资源配置方式和手段，打造了信息传播的新格局，但同时也给网络思想政治教育带来了一系列问题，如思想政治教育者的主导地位被消解、思想政治教育话语被娱乐话语替代、思想政治教育信息传播封闭等。为应对算法推荐时代的挑战，本文从素养提升、话语创新、内容优化等方面提出了相应的对策，希望能够促使算法推荐与网络思想政治教育同向同行。 {ISBN/ISSN}: 2096-9937 {Notes}: 62-1221/G4 {URL}: https://kns.cnki.net/kcms2/article/abstract?v=wYvQo-F_OPYzcPfpCARX5Ou063ApMc0KICb-oktEgC8I8MKWTjlJHumPfcyF2jiByrxB4ullQAEmFz5aiw3DE1CGPjBLm1xzeDxHgjtQoRJ-Fh0x8qkLHfDJijOVQATzBGHSPSNCz0OfOs_ydPrNl9aUkKkDHS51p03BIXT6zQbKcNFcUr53wPILbNOWGZp3&uniplatform=NZKPT&language=CHS {Database Provider}: CNKI"
        - listitem [ref=e114]: "{Reference Type}: Journal Article {Title}: 过滤气泡情境下用户行为及其形成机制研究 {Author}: 张庭玮; 朱沁雨; 宋德凤; 陈烨 {Author Address}: 华中师范大学信息管理学院;南京大学信息管理学院; {Journal}: 图书情报工作 {Year}: 2023 {Volume}: 67 {Issue}: 2 {Pages}: 64-75 {Keywords}: 过滤气泡;用户行为;扎根理论;形成机制 {Abstract}: [目的 /意义]推荐算法技术快速发展所产生的“过滤气泡”现象给用户信息行为带来深刻的影响。从用户角度出发，对其面对过滤气泡时的行为类型以及行为产生的机制进行探索性研究，帮助用户建立对过滤气泡现象的理性认知，为信息服务平台明确推荐算法的建设方向、改进服务水平提供一定的参考。[方法 /过程]采用扎根理论，选取对互联网信息服务平台有一定使用经验的30位用户进行半结构化访谈，并进行编码分析，构建用户面对过滤气泡时的行为与形成机制模型。[结果 /结论 ]用户面对过滤气泡时的行为类型主要包括忽略行为、缓解行为、加强行为、突破行为以及脱离行为。感知控制、态度和信息需求直接影响用户面对过滤气泡时的行为；推荐算法通过态度以及感知控制的中介作用对行为产生影响；此外，个人特质对行为产生的全过程起到调节作用。对特定情境下用户信息行为的研究以及进一步探究过滤气泡现象提供了一种研究视角和研究基础。 {ISBN/ISSN}: 0252-3116 {Notes}: 11-1541/G2 {URL}: https://link.cnki.net/doi/10.13266/j.issn.0252-3116.2023.02.007 {DOI}: 10.13266/j.issn.0252-3116.2023.02.007 {Database Provider}: CNKI"
        - listitem [ref=e115]: "{Reference Type}: Journal Article {Title}: 知识图谱视角下国内信息茧房领域研究主题与趋势分析 {Author}: 王光辉 {Author Address}: 威海市环翠区图书馆; {Journal}: 河北科技图苑 {Year}: 2023 {Volume}: 36 {Issue}: 1 {Pages}: 89-96 {Keywords}: 信息茧房;知识图谱;可视化分析;Citespace {Abstract}: 运用Citespace分析软件，对2007-2022年CNKI数据库中信息茧房相关研究领域的519篇文献进行知识图谱共词分析和共现分析，呈现了我国信息茧房研究领域的发展脉络、主题分布、热点演化和知识流动。研究发现我国信息茧房研究形成了用户信息行为、智能推荐算法、形成机理、影响与破解对策等4个主要研究领域。通过对研究发展脉络的梳理，提出对信息茧房今后研究方向的展望，以期为我国信息茧房相关研究提供参考。 {ISBN/ISSN}: 1006-9925 {Notes}: 13-1203/G3 {URL}: https://link.cnki.net/doi/10.13897/j.cnki.hbkjty.2023.0017 {DOI}: 10.13897/j.cnki.hbkjty.2023.0017 {Database Provider}: CNKI"
        - listitem [ref=e116]: "{Reference Type}: Journal Article {Title}: 数据主义视域下推荐算法的批判路径 {Author}: 王达 {Author Address}: 清华大学新闻与传播学院; {Journal}: 青年记者 {Year}: 2023 {Volume}: {Issue}: 1 {Pages}: 50-52 {Keywords}: 推荐算法;数据主义;文化工业;信息茧房 {Abstract}: 推荐算法在给日常生活带来便利的同时，也构建了许多风险与挑战。本文尝试以推荐算法的技术基础为切入点，围绕“大数据”与“标注”，从数据主义与文化工业等方面爬梳推荐算法的批判路径。本文发现，国内传播学领域对于推荐算法的批判性研究仍有局限，对于“破茧”路径的阐释也存在重“平台”轻“个体”的现象。因此，需进一步结合批判理论的前沿发展，探讨个体层面的破茧路径，并结合哲学思潮与实证研究的对话。 {ISBN/ISSN}: 1002-2759 {Notes}: 37-1003/G2 {URL}: https://link.cnki.net/doi/10.15997/j.cnki.qnjz.2023.01.006 {DOI}: 10.15997/j.cnki.qnjz.2023.01.006 {Database Provider}: CNKI"
        - listitem [ref=e117]: "{Reference Type}: Journal Article {Title}: 国内外信息茧房、回音室和过滤气泡的研究进展——基于文献计量的可视化对比分析 {Author}: 丁绪武; 吴忠; 夏志杰 {Author Address}: 上海理工大学管理学院;上海工程技术大学管理学院; {Journal}: 知识管理论坛 {Year}: 2022 {Volume}: 7 {Issue}: 6 {Pages}: 638-651 {Keywords}: 信息茧房;回音室;过滤气泡;可视化;文献计量 {Abstract}: [目的 /意义]将信息茧房、回音室和过滤气泡三者进行结合研究，重点分析各自研究领域的不同和联系。[方法 /过程]采用可视化的文献计量研究方法，广泛收集2006-2021年的国内外有关研究文献，对信息茧房、回音室和过滤气泡的研究脉络进行了梳理与对比分析，并设置群体极化作为辅助研究对象进行补充。[结果 /结论 ]研究结果发现：(1)国内外学者普遍认为信息茧房、回音室和过滤气泡都会导致群体极化的产生，其中以信息茧房最为明显；(2)发文量方面国内多与国外，国内外相关研究可分为4个研究主题，且在具体细分领域二者之间有明显区别；(3)国内研究多集中于概念的界定以及带来的不良后果分析，研究方法多以定性研究为主，而国外研究则侧重于对以上三者产生的机理研究，研究方法多以定量研究为主；(4)国内外相关研究的未来发展趋势一致，即将情绪维度作为研究以上三者产生机理的一个重要研究对象。 {ISBN/ISSN}: 2095-5472 {Notes}: 11-6036/C {URL}: https://link.cnki.net/doi/10.13266/j.issn.2095-5472.2022.051 {DOI}: 10.13266/j.issn.2095-5472.2022.051 {Database Provider}: CNKI"
        - listitem [ref=e118]: "{Reference Type}: Journal Article {Title}: 算法视阈下文化虚无主义新症候及应对策略 {Author}: 魏泳安 {Author Address}: 四川大学马克思主义学院; {Journal}: 毛泽东邓小平理论研究 {Year}: 2022 {Volume}: {Issue}: 12 {Pages}: 35-44+104 {Keywords}: 算法推荐;文化虚无主义;症候;应对 {Abstract}: 算法作为数字时代新的逻辑和规则设定，其技术变革深刻改变着文化的时代言说方式和场景架构，呈现出价值性与工具性、通俗化与庸俗化、精准化与圈层化、主导性与多元化的文化张力，由此而产生的负面效应，使文化虚无主义在算法场景中表现出内容上的“深度伪造”试图“以假乱真”，对象上的“标签管理”促成“精准投放”，形式上的“泛娱乐化”制造“用户沉迷”，渠道上的“算法黑箱”形成“匿迹隐形”，效果上的“信息茧房”导致“盲目认同”。对此，需要坚持导向为魂，以价值理性引领工具理性；坚持内容为王，以优质内容破除文化虚无；坚持创新为要，以算法优势促进文化创新；坚持监管为底，以科学监管保障算法透明。 {ISBN/ISSN}: 1005-8273 {Notes}: 31-1672/A {URL}: https://kns.cnki.net/kcms2/article/abstract?v=wYvQo-F_OPaacBGZ27_LlbbgrZW6iNmAzfNBaIHwNG2Zr0B52zDz6SG34okezCly3ckkG2HxAfAMjCR86JlS8MU-Q3gyvrHlamHPem_PkFqZHtBGEcdY0GpJUEpojgtacaY4A1bhhYBv4EAwkFI0H5LkJvsSfX9VEpKGnmvBTHiCO7dw7aHU12bOxIzlQtsj&uniplatform=NZKPT&language=CHS {Database Provider}: CNKI"
        - listitem [ref=e119]: "{Reference Type}: Journal Article {Title}: 算法时代“信息茧房”生成机制研究 {Author}: 张省; 蔡永涛 {Author Address}: 郑州轻工业大学经济与管理学院; {Journal}: 情报理论与实践 {Year}: 2023 {Volume}: 46 {Issue}: 4 {Pages}: 67-73 {Keywords}: 算法时代;信息茧房;算法推荐;演化博弈 {Abstract}: [目的/意义]算法推荐技术的广泛应用，在满足网络用户信息需求的同时，也导致了“信息茧房”的产生。[方法/过程]在归纳技术创新论、利益驱动论与情感认同论3种生成机制的基础上，构建信息平台与用户双边演化博弈模型，并模拟仿真关键因素影响双方主体策略演化的路径。[结果/结论]算法推荐技术是算法时代“信息茧房”产生的根源。算法技术的日益成熟，信息平台使用算法推荐成本与用户接受算法推荐的损失成本不断下降，使得信息平台和用户对待算法推荐的策略选择由最初{放弃，抵触}演化为{使用，接受},最终导致“信息茧房”长期存在。据此提出优化算法推荐机制、健全平台算法监管体系、培育公民算法侵权防范意识的建议。 {ISBN/ISSN}: 1000-7490 {Notes}: 11-1762/G3 {URL}: https://link.cnki.net/doi/10.16353/j.cnki.1000-7490.2023.04.009 {DOI}: 10.16353/j.cnki.1000-7490.2023.04.009 {Database Provider}: CNKI"
        - listitem [ref=e120]: "{Reference Type}: Journal Article {Title}: 媒体融合背景下高校网络意识形态安全风险及其防范策略 {Author}: 汪寅; 张慧 {Author Address}: 广西财经学院; {Journal}: 黑龙江高教研究 {Year}: 2022 {Volume}: 40 {Issue}: 12 {Pages}: 108-113 {Keywords}: 媒体融合;高校;网络意识形态安全 {Abstract}: 在媒体融合背景下，高校网络意识形态安全面临新的风险与挑战，即西方意识形态向高校大学生“渗透”的风险、网络意识形态阵地价值引导功能弱化风险、网络意识形态安全管理难度加剧风险、主流意识形态传播受阻的“信息茧房”效应风险。从话语维度、价值维度、能力维度和技术维度分析引发风险的原因。需要从加强高校网络意识形态话语创新、加强网络阵地建设、强化大学生网络思想政治教育、加强主流意识形态传播的技术保障等方面提升高校网络意识形态安全。 {ISBN/ISSN}: 1003-2614 {Notes}: 23-1074/G {URL}: https://link.cnki.net/doi/10.19903/j.cnki.cn23-1074/g.2022.12.006 {DOI}: 10.19903/j.cnki.cn23-1074/g.2022.12.006 {Database Provider}: CNKI"
        - listitem [ref=e121]: "{Reference Type}: Journal Article {Title}: 算法推送背景下的“信息茧房”现状及破解研究 {Author}: 韩星 {Author Address}: 青岛日报报业集团; {Journal}: 新闻文化建设 {Year}: 2022 {Volume}: {Issue}: 22 {Pages}: 55-57 {Keywords}: 算法推送;“信息茧房”;现状及解决措施 {Abstract}: 如今新闻传播过程和智能技术的互动发展已然是我国传媒行业拓宽覆盖面、提高竞争力的有效手段，以算法推送为代表的智能技术成功实现了新闻媒体数据处理能力的提升。算法推送的应用让新闻媒体能够更加准确地抓取到用户对新闻的偏好和期待，从而能够按照既定算法程序为用户推送更加优质的内容，与此同时，其还大幅提高了新闻媒体对繁杂数据的分析、整合、运用能力，从而让新闻内容更加符合用户的个性化需求。当然，算法推送毕竟只是人工智能经过不断发展所产生的一种理性技术，并不具备对新闻内容进行精准理解和价值判断的感知能力，这就导致同一新闻事件会被不同媒体甚至同一媒体反复推送给用户，导致用户所能接收到的新闻内容越来越窄，长此以往“信息茧房”现象会给用户带来不利的影响，甚至会让用户对新闻媒体产生厌倦情绪。本文对“信息茧房”的发展现状进行了介绍，分析了算法推送对“信息茧房”产生的影响，并对算法推送背景下缓解“信息茧房”效应的措施进行了一系列分析。 {ISBN/ISSN}: 2096-787X {Notes}: 10-1677/G {URL}: https://link.cnki.net/doi/10.20253/j.cnki.cn10-1677/g.2022.22.020 {DOI}: 10.20253/j.cnki.cn10-1677/g.2022.22.020 {Database Provider}: CNKI"
        - listitem [ref=e122]: "{Reference Type}: Journal Article {Title}: 算法时代的数字公平问题思考 {Author}: 闫慧 {Author Address}: 中国人民大学信息资源管理学院; {Journal}: 图书馆建设 {Year}: 2022 {Volume}: {Issue}: 6 {Pages}: 4-6 {Abstract}: <正>人工智能技术为人类带来巨大变革的同时，也带来了算法时代的烦恼，诸如算法偏见[1]、算法歧视、算法垄断、算法合谋、算法霸权、算法滥用、算法控制等，未成年人、老年人、妇女、少数族裔、数字劳工等更容易沦为算法时代的弱势群体。2022年3月1日起施行的《互联网信息服务算法推荐管理规定》明确了算法推荐服务提供者的规范，并针对未成年人、老年人、劳动者、消费者可能面临的算法不公风险出台了专门的权益保护机制，标志着我国算法时代结束乱象而正式进入到以制度为底线、公正公平和公开为目标的正轨上来。 {ISBN/ISSN}: 1004-325X {Notes}: 23-1331/G2 {URL}: https://link.cnki.net/doi/10.19764/j.cnki.tsgjs.20222149 {DOI}: 10.19764/j.cnki.tsgjs.20222149 {Database Provider}: CNKI"
        - listitem [ref=e123]: "{Reference Type}: Journal Article {Title}: 算法赋能红色文化有效传播路径探析 {Author}: 杨玮 {Author Address}: 兰州文理学院新闻传播学院; {Journal}: 兰州文理学院学报(社会科学版) {Year}: 2022 {Volume}: 38 {Issue}: 6 {Pages}: 118-123 {Keywords}: 算法推荐;红色文化;用户偏好;信息茧房 {Abstract}: 算法推荐作为信息分发领域的人工智能技术，以用户偏好为导向的精准推送实现了用户与信息的高度匹配，让“人找信息”变为“信息找人”,在红色文化传播的精度、广度和效度方面发挥了积极作用，但它也给红色文化的传播带来诸多挑战：“受众本位”的理念，“消解”了红色文化内涵；“信息茧房”,蚕食红色文化受众主体意识；平台优先原则，阻碍着红色文化的自由传播；把关权利的转移和弱化，加剧了红色文化被边缘化的风险。尝试从价值导向引领、多样推送差异化内容、加强算法平台与主流媒体的合作、法律法规约束、提升用户素养等方面，探索利用算法技术进行红色文化传播的最佳路径。 {ISBN/ISSN}: 2095-7009 {Notes}: 62-1211/C {URL}: https://link.cnki.net/doi/10.13805/j.cnki.2095-7009.2022.06.017 {DOI}: 10.13805/j.cnki.2095-7009.2022.06.017 {Database Provider}: CNKI"
        - listitem [ref=e124]: "{Reference Type}: Conference Proceedings {Title}: “信息茧房”效应下民族传统体育文化传播的研究与思考 {Tertiary Title}: 2022年中国体育非物质文化遗产大会专题报告摘要汇编 {Author}: 陈崎安; 李永安; 揭玉 {Author Address}: 海南师范大学; {Secondary Title}: 2022年中国体育非物质文化遗产大会 {Place Published}: 中国上海 {Subsidiary Author}: 中国体育科学学会武术与民族传统体育分会、教育部中华优秀传统文化传承基地（武术）、全国学校体育联盟（中华武术） {Year}: 2022 {Pages}: 2 {Keywords}: “信息茧房”;社交媒体;民族传统体育文化;信息传播;研究与思考 {Abstract}: 研究目的:\"信息茧房\"概念最早由美国学者凯斯·桑斯坦提出,在海量的信息传播过程中,信息接受者长期关注和接触到的信息都是自己感兴趣喜欢的领域,很多新的领域与事物以及自己不感兴趣的东西被过滤掉很少接触到。互联网的飞速发展,\"信息茧房\"现象变得越发的普遍,普通群众想要了解的基本信息都可以在互联网上找到相应或相关解答,长时间的积累,群众形成了较为舒适的信息圈子,圈子内所传播信息同质化严重,不利于信息广泛交流与传播。公共信息传播平台个性化内容推荐算法越来越普及,推荐内容越来越精准,不利于民族传统体育文化的广泛传播与良好传承,了解互联网新媒体信息传播的趋势,掌握\"信息茧房\"效应规律,促进民族传统体育文化横向与纵向传播,推动民族传统体育文化发展传承。研究方法:本研究运用文献资料法收集整理民族传统体育文化传播途径的相关资料文献,查找民族传统体育文化传播相关网络资源以及互联网时代新媒体信息传播的方式渠道。采用逻辑分析法总结分析专家学者的观点研究成果,结合现阶段互联网社交媒体与信息传播公共平台的发展趋势,提出推动我国民族传统体育文化高效合理传播的相关结论。研究结果:(1)传统媒体时代,信息传播的范围很广,但信息传播的渠道有限,公众接收到的信息取决于传播源头提供了什么样的信息,传播渠道与传播源头提供的信息相对有限,公众对于可接收信息的选择性很小。互联网新媒体时代,信息传播的渠道十分丰富,信息传播的内容不再受到传播源头的限制公众可以对于接收的信息进行选择,每个人都可以接收到无穷的信息,通过各种公共传播渠道每个人都可以成为信息的传播者。(2)互联网技术的进步更迭,个性化内容推荐算法的发展,每个人在互联网上接受到的信息都是自己感兴趣的内容或相关内容,更多丰富的信息被屏蔽筛选掉,形成了自己个人或是圈子内的\"信息茧房\"。(3)获得巨大关注的人或事情,算法会优先推送到公众眼前受到了更多的关注,公众被迫接受了更多的信息,占用了公众更多的时间与精力。(4)个人媒体使用的轨迹不断叠加,个人的使用习惯与个人部分信息被迫让渡于平台,程序与平台间的信息共享,使得个人在多个平台与社群中接触到的都是同质化的信息,形成个人的生态系统。(5)传统体育文化和现代体育文化相比在发展环境与信息传播内容渠道等方面都处于相对弱势地位,在互联网个性化内容推荐算法加深\"信息茧房\"的环境下,传统体育文化的传播与现代体育文化的传播进一步拉开差距,传统体育文化的传播面临更多的困难。研究... {URL}: https://link.cnki.net/doi/10.26914/c.cnkihy.2022.065749 {DOI}: 10.26914/c.cnkihy.2022.065749 {Database Provider}: CNKI"
        - listitem [ref=e125]: "{Reference Type}: Journal Article {Title}: 人工智能赋能学术期刊高质量发展：优势、风险与防范策略 {Author}: 王佳; 郝儒杰; 王锋 {Author Address}: 陕西师范大学马克思主义学院;长安大学学术期刊管理中心;中共四川省委省直机关党校科研处;西京学院电子信息学院; {Journal}: 新闻爱好者 {Year}: 2022 {Volume}: {Issue}: 10 {Pages}: 51-54 {Keywords}: 人工智能;学术期刊;选题策划;约稿组稿;同行评议;编辑出版 {Abstract}: 人工智能一方面可以提高选题策划的有效性、约稿组稿的可及性、查重审稿的便捷性、编辑校对的精准性、出版发行的协同性；另一方面，“编辑工具”（即人工智能）给编辑、学术生产和期刊带来的不确定性，也有来自“编辑方法”的不确定性。选题策划被流量所裹挟、算法的黑箱特性增加了意识形态风险、机器审稿过于保守、编辑校对难发现疏漏、信息茧房干扰编辑拓展知识等。为有效防范这些不确定性风险，学术期刊需要引入第三方机构监督算法、构建人机共存的协同工作模式、积极应对有可能产生的著作权纠纷。 {ISBN/ISSN}: 1003-1286 {Notes}: 41-1025/G2 {URL}: https://link.cnki.net/doi/10.16017/j.cnki.xwahz.2022.10.008 {DOI}: 10.16017/j.cnki.xwahz.2022.10.008 {Database Provider}: CNKI"
        - listitem [ref=e126]: "{Reference Type}: Journal Article {Title}: 线上购物平台中的“信息茧房”现象——用户视角下的新解 {Author}: 侯明希; 谭筠鹏 {Author Address}: 南京师范大学新闻与传播学院;厦门大学新闻传播学院; {Journal}: 广西科技师范学院学报 {Year}: 2022 {Volume}: 37 {Issue}: 5 {Pages}: 76-85 {Keywords}: “信息茧房”;用户;算法推荐技术;线上购物 {Abstract}: “信息茧房”这一概念自美国学者凯斯·桑斯坦明确提出之后，便受到不同学科学者的广泛关注。为补充用户视角对“信息茧房”的理解，本研究以线上购物平台中的“信息茧房”现象作为研究案例，通过采取半结构化访谈的研究方法，旨在探究被访者在“茧房式”购物环境形成过程中的消费体验、主动权力以及态度变化。我们认为，“信息茧房”是用户基于效率至上的工具理性扩张，是一种信息需求导向下的“液化装置”，同时也是在不同语境下具有多种影响的动态实践。 {ISBN/ISSN}: 2096-2126 {Notes}: 45-1401/G4 {URL}: https://kns.cnki.net/kcms2/article/abstract?v=wYvQo-F_OPab3aA3e3NnusrSSzDHQ2XgRiRe39KJgsyRMSkndkwb7N-MX2ZLSw8gQ3nV1V23_ZEzeClriIpTVge-xwlyxFLaV-4QsasS8smHWqo0b3aVUB9FElP4EPcEQL3ipfbeXoL8FodpFbNYWmUvNikph9GfeBpkX5vxktQ3C3ipAUVTVWOLf8rBCV8q&uniplatform=NZKPT&language=CHS {Database Provider}: CNKI"
        - listitem [ref=e127]: "{Reference Type}: Journal Article {Title}: 主流媒体算法的破茧之路——以总台算法在央视频的应用为例 {Author}: 梅剑平; 王乐 {Author Address}: 中央广播电视总台技术局数据应用部;中央广播电视总台超高清视音频制播呈现国家重点实验室;中央广播电视总台总编室; {Journal}: 中国记者 {Year}: 2022 {Volume}: {Issue}: 10 {Pages}: 117-120 {Abstract}: <正>近年来，算法推荐在商业媒体平台中获得巨大成功，对信息传播的作用日益凸显。但商业媒体算法以追求流量为目标，一味迎合用户喜好，不可避免带来信息茧房、内容低俗化等问题。主流媒体承担着引领导向、成风化人等职责使命，无法照搬商业媒体算法，必须建立符合主流媒体特点的先进算法技术。总台算法建立内容感知能力，自动感知当前部署的宣传内容和精品内容，通过多模态混合推荐技术与用户喜好内容灵活融合，让算法驱动思想性、艺术性和商业性的协调统一。 {ISBN/ISSN}: 1003-1146 {Notes}: 11-1275/G2 {URL}: https://kns.cnki.net/kcms2/article/abstract?v=wYvQo-F_OPb96qMeqV2_oopQtc4Xit_a6KsZ3Beq6YSWW2DELLn4BsqKZHIwMugSo7VUXlNT8G8T57Zs_RfHB294mJ_lEcrzkQeHqGU6WNWXEIGjAerEtsw48SMP3iz3OIRVpNZ9odlbPMcs3_Kqt7xDWht1vTPE8DASG_-Suqm2f1GIE9DUJt0iJvkNH5ek&uniplatform=NZKPT&language=CHS {Database Provider}: CNKI"
        - listitem [ref=e128]: "{Reference Type}: Journal Article {Title}: “信息茧房”困境下青年价值观引领的“自缚”和“解缚” {Author}: 李杰 {Author Address}: 齐鲁工业大学轻工学部; {Journal}: 高校辅导员 {Year}: 2022 {Volume}: {Issue}: 5 {Pages}: 58-61 {Keywords}: 信息茧房;青年;价值观 {Abstract}: 网络信息时代，人工智能、大数据技术应用日臻成熟，给青年群体带来享受网络技术红利机会的同时，也会使一部分青年人深陷“信息茧房”的困境之中。“信息茧房”带来的信息窄化、碎片化、思想情感固化等问题，对青年价值观的形成和发展造成了不可忽视的影响。破解“信息茧房”困境需要从提升主流价值引领力、破解推荐算法桎梏、加强媒介素养教育等方面入手，助力青年人突破“自缚”困境，实现“解缚”自由。 {ISBN/ISSN}: 1674-9618 {Notes}: 37-1471/C {URL}: https://kns.cnki.net/kcms2/article/abstract?v=wYvQo-F_OPYPtMpZQ2izgHkgjoE9QQBMlwhW-vFo6Nn851cbPQUXQSYk-9LJBimQtngF4m0TnLBRaMpIyIOe_egVUxp41cX7Y7Ha-q0kWlznmfnWwVk-_kX_fH_6LBzVxwGkvpC9sTj-1zqfN0qpYT-Lgox26WnN7EtmN_wwncHfAt-elCjvyHE4FUkTP3YS&uniplatform=NZKPT&language=CHS {Database Provider}: CNKI"
        - listitem [ref=e129]: "{Reference Type}: Journal Article {Title}: 窄化与破圈：推荐系统对跨圈层传播的两种作用——基于哔哩哔哩的数据挖掘研究 {Author}: 谢岱杉 {Author Address}: 上海交通大学媒体与传播学院; {Journal}: 新媒体研究 {Year}: 2022 {Volume}: 8 {Issue}: 18 {Pages}: 114-118 {Keywords}: 信息茧房;智能媒体;圈层传播;推荐算法 {Abstract}: 为探究推荐算法技术究竟对于“破圈”带来了怎样的影响，研究结合数据挖掘和文本分析方法，验证了推荐算法会导致信息窄化现象，并且视频被算法推荐的优先级越高，可能引发的信息窄化现象越严重。但同时也证实了由于当下内容平台的推荐系统固有的一些特点，它又不可避免地在推荐流中留出了跨圈层传播的通道，这些特点包括：不同圈层的内容具有边缘共性，算法拟合的是多面向的用户偏好，并且算法优化需要一段时间进行数据积累。 {ISBN/ISSN}: 2096-0360 {Notes}: 10-1330/G2 {URL}: https://link.cnki.net/doi/10.16604/j.cnki.issn2096-0360.2022.18.012 {DOI}: 10.16604/j.cnki.issn2096-0360.2022.18.012 {Database Provider}: CNKI"
        - listitem [ref=e130]: "{Reference Type}: Journal Article {Title}: 选择性暴露：算法推荐背景下信息茧房的社会效果研究——以综合性互动视频社区bilibili为例 {Author}: 李云蔚; 李毓欣; 梁译丹; 程柯妮; 蔡思翔 {Author Address}: 中央民族大学; {Journal}: 中国传媒科技 {Year}: 2022 {Volume}: {Issue}: 9 {Pages}: 21-24+28 {Keywords}: 互联网;大数据;信息茧房;社会效应;B站 {Abstract}: 目前互联网时代已经过渡到大数据的阶段，互联网在提升人们知识获取便利程度的同时也导致了信息窄化和共识的难以达成，信息茧房现象出现并逐渐成为网络信息内容生态治理所面临的重要问题。本文选取了综合性互动视频社区bilibili作为调研对象，在个性化算法推荐的大背景下通过深度访谈bilibili资深用户，聚焦于信息茧房的内生机制与带来的长期影响进行讨论，结果显示：在用户个体认知层面，信息茧房效应虽减少了个体筛选信息的压力，但同时也潜移默化地限制了用户联想思维与创造力，而且在一定程度上陷入隐私悖论的困局；在网络公共空间层面，尽管信息茧房效应在多维化市场中推动了内容扩充，但同时也导致了凝聚力建构困境与话语霸权现象。在此基础上，研究针对政府、企业平台和用户三方主体提出建议。 {ISBN/ISSN}: 1671-0134 {Notes}: 11-4653/N {URL}: https://link.cnki.net/doi/10.19483/j.cnki.11-4653/n.2022.09.005 {DOI}: 10.19483/j.cnki.11-4653/n.2022.09.005 {Database Provider}: CNKI"
        - listitem [ref=e131]: "{Reference Type}: Journal Article {Title}: 新媒体环境下短视频火爆现象分析 {Author}: 韩翠玉 {Author Address}: 华中师范大学新闻传播学院; {Journal}: 西部广播电视 {Year}: 2022 {Volume}: 43 {Issue}: 17 {Pages}: 13-16 {Keywords}: 新媒体;短视频;互联网技术 {Abstract}: 互联网络技术飞速发展，短视频行业迅速崛起。短视频具有信息传播碎片化、传播内容丰富多元、用户互动性和参与性强、传播主体大众化、生产方式便捷化等特点。互联网技术的支持、新媒体时代用户需求多样化、快节奏下有效帮助用户解压、满足用户展示自我的需求等主要原因促成了短视频的火爆。当然，短视频发展过程中也存在同质化现象严重、“三俗”内容屡禁不止、算法推荐导致“信息茧房”、侵犯隐私、侵犯版权等问题。为解决这些问题，可以通过采用新技术、更新算法和广告发布机制、加快制定法律法规的进度、平台加强监管、用户提升自身素养等途径促进短视频向更好方向发展。 {ISBN/ISSN}: 1006-5628 {Notes}: 51-1458/G2 {URL}: https://kns.cnki.net/kcms2/article/abstract?v=wYvQo-F_OPYYbXzUUmer1EQyPC_U4qmYf2ZrX9TCyb2C2SZDJelP_vtGGa0AUrU7EWZTvygkkyctwvJELSre9hx74zJBzglMhJJ1-Fff9xmmh7UsbiyakCDtxw7God2znMRMN2j2T-WBRHR_PtbzJL11EifUbcoAdeSVjKke2tIk_GJLLZPzEbch4O9Chajr&uniplatform=NZKPT&language=CHS {Database Provider}: CNKI"
        - listitem [ref=e132]: "{Reference Type}: Thesis {Title}: 场域理论视阈下智能广告伦理问题的省思与调适研究 {Author}: 彭峰 {Tertiary Author}: 戴世富 {Publisher}: 华南理工大学 {Type of Work}: 硕士 {Year}: 2022 {Keywords}: 智能广告;场域理论;伦理;算法 {Abstract}: 当人工智能、大数据、算法成为21世纪的热门话题,也必将对格外重视技术的现代广告带来不可忽视的影响。伴随智能技术的赋能,广告传播思维范式、运作流程、产业链路得到颠覆与重构,逐渐形成以用户需求为中心、以算法和数据为驱动的智能广告。广告生产效率和精准传播大幅提升的同时,一系列新的产业问题和伦理风险也在暗中较量,相较于传统广告伦理更为隐蔽且复杂,不利于广告行业的可持续发展、广告生态的共创共生,因此亟需加强、更新对智能广告伦理问题的规范化、体系化研究。社会学家皮埃尔·布尔迪厄从关系视角提出审视社会的场域理论,从场域、资本、惯习三个维度展开对变动领域中资本博弈和行动者策略的考察。本文基于该理论框架批判性地讨论了智能广告的伦理问题,重点解决以下三个问题:1、智能广告场域中隐含着哪些伦理问题和风险?2、如何在场域理论视阈下剖析智能广告伦理问题的成因?3、在场域理论指导下如何进行智能广告场域的伦理治理?在智能广告场域中,以广告需求方、各类媒体平台、用户为代表的三大主要行动者,以用户需求为中心展开经济、技术、文化资本的博弈,但是不同行动者运用包括惯习在内的策略进行权力斗争,产生了新的伦理失范问题和信任危机。本文在充分占有智能广告伦理研究、场域理论研究等文献研究的基础上,结合当前广告业实践案例的分析与讨论以及关于伦理问题的深度访谈,研究发现技术资本的黑箱和利益链的博弈衍生出诸如隐私侵犯、算法偏见、平台垄断、技术崇拜等一系列伦理问题;场域内部的伦理失范问题受到宏观元场域的影响,因此从经济场、政治场、文化场的元场域维度来深度剖析智能广告伦理问题的成因,经济利益诱导下的平台捆绑和自我驯服、政治资本的缺位与舆论引导的惯习滞后、文化资本异化下的自愿盲目和欲望挑拨一步步加速着伦理纽带的松动;最后将其置于宏观元场域和微观场域内部的关系视角探寻智能广告伦理问题的调适策略,提出引导遵循价值理性的商业变现与负责任技术创新、完善相关法律法规并与倡导平台自律相结合、呼吁智能算法时代主体性的复归与理性精神的指引等宏观元场域维度实现权力制衡与多方伦理共治,以反思惯习、提升行动者智媒素养的主体规制和协同构建多元行动者伦理治理共同体的伦理规约,从而构建智能广告伦理的规范化路径,以期为智能广告学术研究和业界实践提供些许指导,促进智能广告场域的健康可持续发展。 {URL}: https://link.cnki.net/doi/10.27151/d.cnki.ghnlu.2022.005407 {DOI}: 10.27151/d.cnki.ghnlu.2022.005407 {Database Provider}: CNKI"
