          - paragraph [ref=f15e489]: 摘要：近年来随着新能源汽车和储能电池的迅速发展，锂产品的消耗量日益增大，锂资源的开发与利用受到了高度的关注。目前已工业化提锂方法生产周期长、锂综合回收率低，盐湖提锂产量增长缓慢，难以满足我国新能源产业发展需求。从低锂原卤中直接提锂，可实现低品位锂资源高效利用，对于提高我国战略锂资源的供应具有重要意义。本文根据我国卤水资源特点，概述了可适用于低锂浓度、高镁锂比原卤提锂的吸附法、膜分离法、萃取法以及其他方法...
          - generic [ref=f15e490]:
            - generic [ref=f15e491]: 主编荐语
            - generic [ref=f15e493]: 张丹（编辑部主任）： 本文作者黄小卫院士根据我国卤水资源特点，概述了可适用于低锂浓度、高镁锂比原卤提锂的吸附法、膜分离法、萃取法以及其他方法，分析了不同技术方法的提锂特点及效果，展望了低锂浓度、高镁锂比原卤提锂技术发展趋势。提出以下建议：1.对现有吸附材料进行掺杂改性是未来吸附法盐湖提锂发展的主要方向，通过掺杂改性可缓解材料的溶损，并提高对原卤中锂的选择性与吸附速率。2.未来应研究开发出具有成本低廉、锂选择性高的吸附材料和膜材料，优化工艺流程，减少淡水消耗。3.针对我国低锂浓度、高镁锂比盐湖，开发新型萃取体系或萃取剂是未来盐湖萃取法提锂的重要研究方向。4.促进新工艺从实验室研发延伸扩大至盐湖提锂的工业化应用。
