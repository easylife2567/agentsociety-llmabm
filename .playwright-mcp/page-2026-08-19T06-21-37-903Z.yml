            - generic [ref=f15e418]: 刘光生（矿山所共性技术研究中心主任）： 本文利用文献综述的方法，首先分析了无人机实时摄影测量技术的基本原理。然后对无人机实时摄影测量技术的关键技术进行了总结，并对无人机实时摄影测量技术的应用领域作简要介绍。最后，依托现阶段科学技术发展背景，对未来无人机实时摄影测量技术的发展趋势进行展望。本文是对无人机实时摄影测量技术现状与发展的系统性总结，旨在丰富无人机摄影测量技术与应用理论体系，为相关领域的学术研究和工程应用提供科学参考，对实现摄影测量技术高质量发展和信息化工程建设具有重要的意义。
