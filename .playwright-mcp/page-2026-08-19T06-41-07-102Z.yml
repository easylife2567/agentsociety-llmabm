          - paragraph [ref=f4e330]: 摘要：中国游戏产业在近年实现了市场规模的稳步提升、产业形态的日益明确与优质产品的海外传播，进一步在文化、经济与科技层面为国家发展、建设社会主义文化强国贡献着重要的价值。但中国游戏产业在规模扩张的同时也在战略价值、产业价值与审美价值方面暴露诸多问题。相关部门、企业和从业者可从中华优秀传统文化出发，以国际性的视野、产业协同发展的格局、高标准的美学要求与务实的求是态度协同突破，带领整个产业共同进步。
          - generic [ref=f4e331]:
