          - paragraph [ref=f4e365]: 摘要：以数字人文方法推动历史文献的数字化整理、知识组织创新与出版传播升级，是回应国家文化数字化战略、激活文献资源深层价值的重要路径。文章以中华书局版《谭延闿日记》影印本为实证案例，系统探讨数字人文视域下历史文献的数据提取、知识重构与规范化组织路径。在完成文献数字化规范整理的基础上，集成OCR识别、命名实体抽取、社会网络分析及时空可视化等技术手段，构建兼具系统性与可操作性的结构化知识组织体系。研究结果表明...
