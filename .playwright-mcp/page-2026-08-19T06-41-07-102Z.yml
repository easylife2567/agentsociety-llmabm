            - generic [ref=f4e369]: 李弘（副秘书长、《中国数字出版》副主编兼编辑部主任）： 当出版业从“影印存档”加速转向“知识关联与复用”，海量近代日记、手稿却仍困在图像层——这也是《谭延闿日记》影印本曾面临的尴尬。 王晓园等文章039人、1296地的可计算网络，亮出三处硬核洞察：谭氏人脉是“核心—半核心—边缘”的差序波纹，且具“小世界”短路径属性；维系力来自“制度性联盟+乡土性纽带”双轨并行；网络规模随立宪、督湘、广州、南京四阶段涨落，是个人主动重构社会资本的微观镜像。文章不避技术边界，直言模型简化与语境流失之限。想看清“纸书+智能体”时代历史文献怎么真正“活”起来，这篇实操范式值得细读。
