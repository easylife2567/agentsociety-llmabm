              - /url: https://navi.cnki.net/knavi/detail?p=EZYlKpt3pEV1pV4l8JZ_k0lP4hLWFmfwzG6wgRKz1rQWMezyfjysrayjpnoJ2s7qKiLtUv6Oo3nXTvusOxi5_gsZxezaySW-NDHV1m_heg4=&uniplatform=NZKPT&language=CHS
            - generic [ref=f6e265]: 2025年 01期
            - emphasis [ref=f6e266]: 期刊
          - paragraph [ref=f6e267]: 摘要：热障涂层（Thermal Barrier Coatings,TBCs）被广泛应用在燃气轮机及航空发动机的热端部件上，为高温合金部件提供有效隔热防护。随着发动机工作温度的不断提高，现役氧化钇稳定氧化锆（YSZ）涂层在高温时效过程中出现烧结、相变及热生长氧化物（Themally Grown Oxide,TGO）等问题。因此，探索具有更高热膨胀系数的新型热障涂层材料与制备技术一直是材料科学家的关注热点。...
          - generic [ref=f6e268]:
            - generic [ref=f6e269]: 主编荐语
            - generic [ref=f6e271]: 于月光（编辑部主编）： 本文系统梳理了热障涂层材料的发展脉络与技术瓶颈，全面涵盖了从热传导机理、材料体系、制备工艺到失效机制的全链条分析。研究发现，随着发动机工作温度突破1600°C，现役YSZ涂层面临相变、烧结与TGO生长等多重挑战，而稀土锆酸盐等新型材料体系虽具备低热导率潜力，却在力学性能与辐射传热方面存在短板。该综述不仅为航空发动机与燃气轮机的涂层选材与工艺优化提供了科学依据，也为我国推进“两机专项”、实现关键材料自主化指明了研究方向。
