            - generic [ref=f6e536]: 张丹（编辑部主任）： 本文分别从高镍正极材料以及其与固态电解质的界面角度出发，详细描述了包括锂/镍（Li+/Ni2+）混排、晶内与晶间微裂纹、气体释放与过渡金属溶出在内的材料本征结构失效机理以及其与固态电解质间界面存在的机械接触失效、空间电荷层、界面化学/电化学副反应等匹配问题。回顾总结了目前为止针对高镍正极材料在固态电池中应用的具体改性策略进展，其中包括针对高镍正极材料本身的改性策略以及高镍正极材料/固态电解质界面改性策略。并提出高镍正极材料在固态电池中的应用在未来的发展趋势。
