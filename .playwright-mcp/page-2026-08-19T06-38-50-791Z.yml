            - emphasis [ref=f2e255]: 期刊
          - paragraph [ref=f2e256]: 摘要：文章根据科研人员对生成式人工智能的认知情况和现有使用态度,探究生成式人工智能相关应用对科研领域的作用及现存困境。研究运用问卷调查法,针对生成式人工智能在科学研究中的应用现状、对现有技术和工具的看法进行调查,调查共回收有效问卷248份。研究发现,科研人员对目前生成式人工智能保持中立的态度,博士学历的受访者对生成式人工智能大模型更了解,受访者普遍对建设前沿背景、数据分析、总结归纳、其他细节等使用场景的...
          - generic [ref=f2e257]:
            - generic [ref=f2e258]: 主编荐语
            - generic [ref=f2e260]: 李弘（副秘书长、《中国数字出版》副主编兼编辑部主任）： 当AI走进实验室，科研人员究竟是“拥抱”还是“观望”？中国药科大学丁佐奇团队基于248份有效问卷，揭开科研圈生成式AI使用的真实图景：博士群体对大模型认知显著更深，大家普遍认可其在前沿追踪、数据归纳中的高效价值，却对方案设计慎之又慎；近八成受访者担忧数据滥用与权责模糊，超六成强烈呼吁“AI生成内容必须标注+人工审核”。研究首次捕捉到“乐观态度直接驱动使用意愿”的关键关联，更针对性提出“本硕博分层培训”“权责协议前置”等实操路径。这份来自一线科研场景的调查，既回应了实践关切，也为破解“AI赋能科研却不敢用、不会用”的困局提供了扎实依据。点击阅读，看技术浪潮下科研范式的理性转向。
