              - definition [ref=f2e181]:
                - paragraph [ref=f2e182]: 高级检索支持使用运算符*、+、-、''、""、()进行同一检索项内多个检索词的组合运算，检索框内输入的内容不得超过120个字符。
                - paragraph [ref=f2e183]: 输入运算符*(与)、+(或)、-(非)时，优先级需用英文半角括号确定。
                - paragraph [ref=f2e184]: 若检索词本身含空格或*、+、-、()、/、%、=等特殊符号，为避免歧义，须将检索词用英文半角单引号或英文半角双引号引起来。
              - term [ref=f2e185]: 例如：
              - definition [ref=f2e186]:
                - paragraph [ref=f2e187]: （1）篇名检索项后输入：神经网络 * 自然语言，可以检索到篇名包含“神经网络”及“自然语言”的文献。
                - paragraph [ref=f2e188]: （2）主题检索项后输入：(锻造 + 自由锻) * 裂纹，可以检索到主题为“锻造”或“自由锻”，且有关“裂纹”的文献。
                - paragraph [ref=f2e189]: （3）如果需检索篇名包含“digital library”和“information service”的文献，在篇名检索项后输入：'digital library' * 'information service'。
                - paragraph [ref=f2e190]: （4）如果需检索篇名包含“2+3”和“人才培养”的文献，在篇名检索项后输入：'2+3' * 人才培养。
