            - generic [ref=f2e501]: 李弘（副秘书长、《中国数字出版》副主编兼编辑部主任）： 当“全民阅读”连续12年写入政府工作报告，当6.7亿用户指尖划动屏幕成为日常，数字阅读已从“新时尚”变成了“新基建”。文章首次用行业一手数据揭示了“十五五”期间数字阅读的突围方向：广告收入首超订阅、AI创作效率提升40%、出海作品突破80万部——繁荣背后，出版机构、图书馆与商业平台却仍在“各自为战”，算法“流量至上”正悄悄窄化我们的认知边界。如何让古籍资源不再“沉睡”？怎样让适老版阅读不只“字号变大”？如何让算法既懂流量更懂文化？作者提出构建多主体协同机制、重构算法公共性指标等破局之策，为数字阅读从“规模扩张”转向“质量跃升”提供了清晰的路线图。点击阅读，看懂文化强国建设中的“数阅读答卷”。
