          - paragraph [ref=f2e562]: 摘要：案例研究法是一种非常重要的质性研究方法，近年已成为管理学领域的主流研究方法之一。出版学研究若要建构公认的、权威的理论体系，需要研究者借鉴案例研究这一出版学领域中较少采纳的实证方法。一方面，案例研究法能够为出版学理论构建、出版实践创新发展、出版学术共同体建立提供直接的支撑作用；另一方面，案例研究法也更加契合出版实践性强，无法用数据量化其具体过程，但用质性数据依然能够较好地描述、实证分析现象、解决研究...
