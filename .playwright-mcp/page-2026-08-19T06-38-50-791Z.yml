            - generic [ref=f2e397]: 李弘（副秘书长、《中国数字出版》副主编兼编辑部主任）： 当前，AI协议试图把网文作者的“心血”变成算法的“养料”。作者抓取了数千条网友评论，发现超半数声音藏着对“被替代”的焦虑：有人怒斥平台“偷盗式喂养”，有人嘲讽“AI写诗，人去打工”，也有人冷静指出“套路化写作本就难逃算法收割”。更有趣的是，作者、读者、平台、监管四方并非简单对立——读者用“裂开”表情包宣泄不满，作者借“偷盗者”隐喻争夺话语权。这场争议撕开了AIGC应用的一角：技术想象早已固化成“剥削工具”与“监管对象”的二元对立。。本文用社会技术想象理论解码这场“抵制风波”，带你看见算法浪潮下，普通创作者如何在技术乐观与悲观的夹缝中，重构属于自己的未来叙事。点击阅读，读懂AI时代的“人心向背”
