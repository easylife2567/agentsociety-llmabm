      - list [ref=e112]:
        - listitem [ref=e113]: "{Reference Type}: Thesis {Title}: 网络传谣与辟谣共演机制的研究 {Author}: 贾怡 {Tertiary Author}: 年福忠 {Publisher}: 兰州理工大学 {Type of Work}: 硕士 {Year}: 2025 {Keywords}: 传谣与辟谣;信誉度;认知效应;动态转化;共同演化 {Abstract}: 随着社交媒体的发展和普及,谣言传播对社会稳定和公共安全构成了严重威胁。而现有的关于谣言传播的研究大多关注传播的单向过程,缺乏对传谣者与辟谣者交互演化的系统性分析。因此,本文针对这一问题构建了两个新的谣言传播模型,重点研究传播过程中传谣者与辟谣者的动态竞争,结合不同网络结构和影响谣言传播的关键因素,揭示谣言与辟谣信息传播的内在动力学规律,并验证模型在真实社交网络环境下的适用性。本文主要的研究内容包括: (1)提出一个新的SIrId谣言传播模型,将个体状态划分为未知者(S)、传谣者(Ir)、辟谣者(Id)三类,并定义了一种状态转换规则,该规则刻画了传谣者与辟谣者在传播信息过程中的竞争关系。其中,未知个体可能转化为传谣者或辟谣者,同时传谣者与辟谣者之间亦可相互转化。基于该模型和规则,引入信誉度作为核心影响因素,信誉度的动态更新综合考虑了每个节点的个体影响力、邻居中传谣者和辟谣者的局部演化以及整个网络中传谣者和辟谣者的全局演化情况。实验采用不同网络结构,结合参数对比分析、消融实验及真实数据进行验证,结果表明,SIrId模型能适应多种网络结构,且能有效地反映复杂网络中谣言和辟谣信息的传播动态以及信誉度对传播的关键影响。 (2)为进一步探讨个体认知对谣言传播的动态影响,创新性地引入认知心理学中的“首因效应”和“近因效应”两个概念,提出了扩展的SIRInIdR谣言传播模型。该模型考虑了中立者(In)这一角色,用来刻画信息接收者在短时间内不立即参与传谣或辟谣的个体,并引入免疫状态(R),用于表示那些经过传播过程后不再参与传播的个体。同时继续研究状态之间的转化,考虑传播者中的中立者可能向传谣者(Ir)和辟谣者(Id)转化的可能性,并进一步分析不同个体传播状态受认知偏见与周围环境信息的双重影响。基于时间维度分析首因效应和近因效应的作用机制和差异,通过仿真实验并结合Twitter真实数据进行对比验证。结果表明,首因效应的增强加速了早期谣言信息的传播,而增强近因效应则有助于控制谣言的传播,并且中立者的转化机制及其比例的变化都对谣言与辟谣信息的传播有一定影响。这些发现可以为优化社交媒体的谣言干预策略提供参考。 {URL}: https://link.cnki.net/doi/10.27206/d.cnki.ggsgu.2025.002024 {DOI}: 10.27206/d.cnki.ggsgu.2025.002024 {Database Provider}: CNKI"
        - listitem [ref=e114]: "{Reference Type}: Book {Title}: 社交三力 {Author}: 刘碧瑛 {Publisher}: 人民邮电出版社 {Date}: 202503 {Edition}: 1 {Abstract}: 建立人际关系如同织网,每一根线都承载着信任与价值的重量,而每一次互动都是网中结点的加固。那么,在这个快节奏、高效率的时代,如何更有效地编织自己的社交网络?如何在人际互动中更好地展现自我价值呢?本书作者基于多年的培训课程积累及社交经验,从个人形象塑造出发,深入探讨了社交互动技巧,以及不同场景下的社交策略,旨在帮助读者实现高质量社交。具体而言,本书分为三个部分:第一部分讲述了打造高质量社交的形象基石,包含形象的重要性、色彩搭配、场合着装、细节管理等内容;第二部分讲述了掌握高质量社交的核心技巧,涵盖表情管理、身体语言密码、初次见面的艺术等内容;第三部分则展现了拓展高质量社交的多元场景,聚焦餐桌社交、数字化社交、情感社交等。本书不仅有理论,还有实践;不仅有方法,还有技巧。此外,本书还提供了实用的小贴士,读者可拿来即用。本书适合希望提高个人社交能力、打破社交恐惧的人阅读。 {Pages}: 228 {ISBN/ISSN}: 978-7-115-66395-5 {Database Provider}: CNKI"
        - listitem [ref=e115]: "{Reference Type}: Thesis {Title}: 社交媒体对法国刻板印象形成的影响机制分析 {Author}: 张子露 {Tertiary Author}: 杨晓敏 {Publisher}: 广东外语外贸大学 {Type of Work}: 硕士 {Year}: 2024 {Keywords}: 社交媒体;法国刻板印象;信息渠道;Z世代 {Abstract}: 本论文以Z世代中国人作为研究对象,通过定性研究方法,探讨在社交媒体对法国刻板印象的影响下,Z世代中国人是如何形成对法国的国家形象。本研究首先从国家基本认知,国家和国民形象两个维度分析Z世代中国人对法国的总体认知和刻板印象,并通过比较传统媒体和新媒体获得的法国国家形象的差异和分析不同社交媒体平台发挥的独特作用,从而深入分析这些刻板印象形成的原因。 研究发现,Z世代中国人对法国情况的了解相对片面,而且他们对法国形象的认知也随着时间的推移而不断变化。与初印象相比,现在的印象是多元且复杂的。社交媒体在塑造这一形象方面起到了潜移默化的作用。具体来说,社交媒体的特性有助于法国信息的传播和分享。社交媒体的议程设置和培养功能,以及推荐算法所形成的信息茧房,在刻板印象的形成、打破和强化中发挥着至关重要的作用。因此,利用具有强大影响力的社交媒体来塑造国家形象,是增强国家软实力和国际影响力的有效策略。 {URL}: https://link.cnki.net/doi/10.27032/d.cnki.ggdwu.2024.001171 {DOI}: 10.27032/d.cnki.ggdwu.2024.001171 {Database Provider}: CNKI"
        - listitem [ref=e116]: "{Reference Type}: Thesis {Title}: 基于敏感性递减和首因效应的群智感知质量激励机制研究 {Author}: 李颖超 {Tertiary Author}: 刘佳琦 {Publisher}: 中南大学 {Type of Work}: 硕士 {Year}: 2023 {Keywords}: 群智感知激励机制;敏感性递减;首因效应;覆盖范围;数据精度 {Abstract}: 移动群智感知网络利用大量移动设备收集数据,执行复杂感知任务。为准确执行任务,用户必须保证感知数据的覆盖范围和精度。然而,为提高覆盖范围用户需要移动到偏远地区,这将花费其更多时间。为提高数据精度用户需要较努力的执行任务,这将更加消耗设备资源。因此,需要就这两方面设计激励机制鼓励用户贡献数据。 现有群智感知激励机制普遍存在以下问题,第一,当前激励机制大多基于报酬增益与效果增益的线性比,在平台考虑支付控制的情况下其实际效果低于理论效果。第二,现有激励机制均基于标准经济学的效用函数,假设最终收益结果影响用户决策。但行为经济学证明影响用户决策的关键因素是最终收益结果与参照点之间的差异。为解决上述问题,本文工作如下: (1)针对群智感知中覆盖范围低的问题,本文提出了基于敏感性递减的参与者选择机制(Participant Selection Mechanism Based on Diminishing Sensitivity,PSDS)。根据敏感性递减的性质映射建模,构建选择函数作为平台选择参与者的选择标准,根据选择函数值动态选择用户,在不额外增加平台成本的情况下,激励用户在增大自身选择函数值提高被选择概率的过程中不断选择不流行任务,扩大数据收集的覆盖范围。实验结果表明,PSDS有效地提高了覆盖质量、任务完成率和用户的平均参与率。 (2)针对群智感知中数据精度低的问题,在PSDS的基础上,提出了基于首因效应的报酬支付机制(Reward Payment Mechanism Based on Primacy Effect,RPPE)。根据首因效应实例映射建模,首先建立数据精度参照点,然后建立首因值将用户实际完成精度和数据精度参照点做关联,通过权益获取率的建立和权益获取阈值的确定,使用户在最大化自身利益的情况下提高努力程度,从而提高数据精度。实验结果表明RPPE能有效提高任务完成精度和平台效用。 图37幅,表19个,参考文献80篇 {URL}: https://link.cnki.net/doi/10.27661/d.cnki.gzhnu.2023.005485 {DOI}: 10.27661/d.cnki.gzhnu.2023.005485 {Database Provider}: CNKI"
        - listitem [ref=e117]: "{Reference Type}: Thesis {Title}: 网络表情符号对大学生人际交往中印象评价的影响 {Author}: 张顺 {Tertiary Author}: 蒋京川 {Publisher}: 南京师范大学 {Type of Work}: 硕士 {Year}: 2023 {Keywords}: 网络表情符号;印象评价;使用者性别;社会情境 {Abstract}: 随着互联网技术的飞速发展,以计算机为媒介的通信方式成为全球流行的社交方式。并且随着这种趋势的加剧,网络用语和符号逐渐发展和普及,这引起了相关学者的关注。作为一种非言语线索符号,网络表情符号在网络人际传播和交流中扮演了不可或缺的角色。在人际传播中,非言语信息对交流双方的表达和印象形成起着至关重要的作用。事实上,对大多数大学生而言,线上交流已经成为人际交往不可或缺的一部分。因此,在如此普遍的线上交流时代,网络表情符号是否会对大学生的印象评价产生影响,这成为了一个需要关注的问题。本研究在总结前人研究的基础上,探究网络表情符号对大学生人际交往中印象评价的影响。 研究一探索网络表情符号使用和使用者性别对印象评价的影响。实验选取94名大学生,采用3(网络表情符号使用:不使用、小黄脸表情符号、中性化表情包)×2(使用者性别:男性、女性)两因素混合实验设计,因变量为印象评价三个指标(热情、能力、总体印象)的得分。结果发现:使用网络表情符号显著提高了对目标对象的热情评价、能力评价和总体印象评价;使用中性化表情包的目标对象的热情评价、能力评价和总体印象评价优于使用小黄脸表情符号的目标对象。 研究一证明了网络表情符号使用所带来的网络正向晕轮效应,即人们往往对使用表情符号的个体整体上有更积极的评价,并且使用表情包的效果最好。那么,不同性别的个体使用不同性别化表情符号又是否会对印象评价产生影响? 研究二在研究一的基础上,进一步将网络表情符号具体到性别化表情包,考察性别化表情包和使用者性别对印象评价的影响。研究选取104名大学生,采用3(性别化表情包:男性化表情包、女性化表情包、中性化表情包)×2(使用者性别:男性、女性)两因素混合实验设计,因变量为印象评价三个维度(热情、能力、总体印象)的得分。结果发现:无论是热情维度、能力维度还是总体印象得分,使用与性别一致的表情包的目标对象的评价最高。 研究三在引入社会情境这一变量后,进一步探究大学生对不同性别者使用不同性别化表情包的印象评价是否会因不同的社会情境(社交情境、工作情境)而存在差异。研究选取210名大学生,采用2(社会情境:工作情境、社交情境)×3(性别化表情包:男性化表情包、女性化表情包、中性化表情包)×2(使用者性别:男性、女性)三因素混合实验设计,因变量为印象评价三个维度(热情、能力、总体印象)的得分。结果发现:社会情境会调节性别化表情包和使用者性别对目标对象的总体印象评价。在社交... {URL}: https://link.cnki.net/doi/10.27245/d.cnki.gnjsu.2023.002673 {DOI}: 10.27245/d.cnki.gnjsu.2023.002673 {Database Provider}: CNKI"
        - listitem [ref=e118]: "{Reference Type}: Journal Article {Title}: 后真相时代新闻受众的群体极化心理分析——以反转新闻“成都第四十九中学校学生坠楼事件”为例 {Author}: 徐子恒; 陈欢 {Author Address}: 湖北师范大学文学院; {Journal}: 新闻研究导刊 {Year}: 2023 {Volume}: 14 {Issue}: 6 {Pages}: 11-13 {Keywords}: 群体极化;反转新闻;后真相时代;首因效应;成都第四十九中学校 {Abstract}: 随着社交媒体和数字技术的不断发展，新闻报道可以很容易地被传播和分享，从而引发人们对某个事件的兴趣和关注。但是，互联网新媒体的兴起，也使得新闻报道变得更加复杂和难辨真伪，这不仅给受众带来了巨大的心理压力和认知挑战，也使新闻报道的真实性和客观性面临威胁，受众对新闻的信任度和接受度越来越低。互联网新媒体兴起后，受众对新闻信任度和接受度降低的时代称为“后真相时代”。后真相时代，人们会怀疑媒体报道，并对自己的立场进行极化。文章采用案例分析法，以“成都第四十九中学校学生坠楼事件”报道为例，通过对事件潜伏期、爆发期、高潮期、延续期、衰退期五个阶段内的舆情变化以及具体数据的分析，探讨群体极化现象背后受众的心理机制。文章发现，在网络空间中，导致受众群体极化的心理主要有先入为主的首因心理、网络匿名性的宣泄心理以及非理性下的从众心理。文章提出，要从政府加强平台监管、主流媒体发力扭转舆论、网民提高媒介素养三个方面加以调整，从而规避网民群体极化的潜在风险，营造良好的网络舆论环境，推动网络生态健康发展。 {ISBN/ISSN}: 1674-8883 {Notes}: 50-1205/G2 {URL}: https://kns.cnki.net/kcms2/article/abstract?v=wYvQo-F_OPZtStSRPRlIa8EjtWywBk7ynerDVqqQj8zgDVoniFmbwIEufpkjG-ockeBfBeFM8SbgiI-HflWmH34SeCy3I9tqLp6ZY1xHOJNE__xGOs1Cj-d3NG5pnEMI2CWOcbd7djn1gYd2LVMwP9GadSIOqwDlHqxsuFmAO1nCapl5gEPxsSprXruAU2oZ&uniplatform=NZKPT&language=CHS {Database Provider}: CNKI"
        - listitem [ref=e119]: "{Reference Type}: Journal Article {Title}: 网络时代借势营销在品牌传播中的应用——以鸿星尔克为例 {Author}: 刘依妮 {Author Address}: 西安欧亚学院工商管理学院; {Journal}: 现代营销(学苑版) {Year}: 2021 {Volume}: {Issue}: 30 {Pages}: 36-38 {Keywords}: 鸿星尔克;借势营销;首因效应;品牌传播 {Abstract}: 数字技术高速发展的时代,网络重新定义了信息传播的概念,这使传统营销模式也发生了改变。品牌方的宣传近乎被信息浪潮所淹没,各大品牌为了让自身能在同类品牌中脱颖而出,将目光锁定能够适应网络信息格局的营销路径。为新路径能够借助互联网获取流量势力吸引受众关注度和稳固消费者市场,在提升知名度同时也能获得品牌认同感和凸显品牌个性,网络借势营销因此应运而生。本文借助鸿星尔克在河南暴雨灾情中通过借势营销获得流量红利的事件为例,解读借势营销的特征以及在品牌传播中的应用,以期能为品牌的营销策划与成长之路提供有益借鉴。 {ISBN/ISSN}: 1009-2994 {Notes}: 22-1256/F {URL}: https://link.cnki.net/doi/10.19932/j.cnki.22-1256/F.2021.10.036 {DOI}: 10.19932/j.cnki.22-1256/F.2021.10.036 {Database Provider}: CNKI"
        - listitem [ref=e120]: "{Reference Type}: Journal Article {Title}: 网络首因效应视阈下的近现代史纲要课教学试析 {Author}: 范文明 {Author Address}: 湖北经济学院马克思主义学院; {Journal}: 湖北经济学院学报(人文社会科学版) {Year}: 2021 {Volume}: 18 {Issue}: 10 {Pages}: 151-154 {Keywords}: 首因效应;高校思政课堂;教学策略 {Abstract}: 首因效应是一种先入为主的优先效应,它对个体在社会认知过程中起着十分重要的影响。当前网络视阈下,大学生历史观首因效应的形成,对大学生的学习生活,以及大学思政课教学的正常开展,都产生了不可忽视的影响。高校思政教育工作者一定要利用首因效应的特点,采取适当措施,上好思想政治理论课,发挥正能量,扭转网络谣言的首因效应造成的负面影响,更好地服务于教学改革。 {ISBN/ISSN}: 2095-8862 {Notes}: 42-1855/C {URL}: https://kns.cnki.net/kcms2/article/abstract?v=wYvQo-F_OPZgy3fDznunnBlEqjj1drmHLlN_fMvMU3ADPz9MzzPdu2FZvS--bbxSmXW4gkOHqp9U-qWA4W6fElYmwMkGm0wMfnUUGVHYL58VBW-ldlYr26KlwwjK3k7I0CGfoaQoiMi8zemkL96UchS880iXqVpmPotpOPlSE1vefJMRfxi-8OAH3PV2dY7P&uniplatform=NZKPT&language=CHS {Database Provider}: CNKI"
        - listitem [ref=e121]: "{Reference Type}: Thesis {Title}: 时尚自媒体IP社交文本的人格化效果研究 {Author}: 洪子叶 {Tertiary Author}: 张放 {Publisher}: 四川大学 {Type of Work}: 硕士 {Year}: 2021 {Keywords}: 自媒体IP;网络人际传播;网络印象形成;人格化 {Abstract}: 自媒体IP作为一个新兴的词汇,近年来跟随“影视IP”“游戏IP”等词汇频频跃入受众的视野。在IP3.0的时代,自媒体与IP紧密结合,这既是IP形态的迭代,也是自媒体突破流量瓶颈、进行可持续性商业变现、寻求自身长足发展空间的绝佳方式。技术环境、资本环境、文化环境都在为自媒体IP这片土地浇灌无限的可能。如今,垂直类自媒体已经发展得成熟、完全,我国的时尚类自媒体作为一个重要分支,已经涌现了一大批内容精良、运作成熟的自媒体人,他们有的是中国早期电商人物代表,现在已经拥有自己的品牌,坐拥时尚、美妆的电商帝国;有的借助平台资源,将亚洲时尚KOL的标签带到了世界顶级时尚盛会中。无论哪一种,都为时尚自媒体这个行业注入了许多新鲜的创意和内容。在时尚自媒体行业迅速发展的过程中,IP已经成为了头部KOL正在追求的目标。拥有IP,就拥有了跨界、破圈的权利和资格,这就意味着变现的方式又可以变得更丰富。其中,通过“人格化”的运作模式与受众建立一定的人际关系已经成为了自媒体普遍的运营方式之一。自媒体离不开“人”,不论是内容传播者还是受众,其实都是互联网的用户。因此,“人格化”是一种必然,也是一种策略。品牌可以人格化,IP可以人格化,当有了人格特质和人格魅力时,就有了相应的定位和更广阔的发展空间。 自媒体形成人格化需要依靠内容运营、平台运营等模式来实现。通过内容,即自媒体的社交文本来进行的人格化表达是一种常见的自媒体运营方式。当下的自媒体可以通过文字文本、语音、视频甚至是AR、VR等多种技术形式来传播内容,让受众的临场感更强,受众与传播者的空间距离、心理距离都空前被科技这股力量拉近了,在这样的前提下,对于自媒体来说,抓住了人格化运营也就抓住了吸引并获得稳定受众的关键。 微信公众号是自媒体早期内容孵化的平台,至今已经8年之久。公众号的推出,帮助微信成为了国内最大的移动媒体信息分发平台。如今自媒体能够孵化的平台越来越多,诸如微博、小红书、抖音等。但是公众号历史相对较长,能够承载的内容形式多样,发挥空间大,服务种类相对齐全,专业的头部自媒体几乎都在曾经或者正在深耕公众号。商业变现、口碑打造依旧需要公众号这片优质内容平台加以支撑。同时,因为头部自媒体IP的发展时间相对较长,从公众号切入可以更好地了解其运作模式的发展历程。 本研究通过对“深夜发媸”公众号的推送文本进行内容分析和无结构访谈,从人格心理学的人格形容词模型、网络人际传播效果理论的研究结果入手,... {URL}: https://link.cnki.net/doi/10.27342/d.cnki.gscdu.2021.006322 {DOI}: 10.27342/d.cnki.gscdu.2021.006322 {Database Provider}: CNKI"
        - listitem [ref=e122]: "{Reference Type}: Thesis {Title}: 反转新闻对涉事陌生人人际信任的改变及其影响因素 {Author}: 刘婷 {Tertiary Author}: 金花 {Publisher}: 天津师范大学 {Type of Work}: 博士 {Year}: 2020 {Keywords}: 反转新闻;人际信任;内隐信任;静息态脑功能成像 {Abstract}: 当今社会,信息获取和传播的方式因互联网的出现而发生了巨大变革,我们每个人既是信息接收者也是信息发布者。然而,信息获得和发布的便利性也会对信息的真实性产生影响,由于降低了传统媒体的审查机制,网络错误信息层出不穷。反转新闻(Reverse News)作为错误信息的一个类型,其首发大部分为负性新闻(如,“我的右肾去哪了”,“蒋劲夫家暴女友”),在曝光后引起大量关注,但随着后续报道的跟进,人们却发现事实真相与首次报道差距较大,舆论也随之发生巨大改变。先前的研究一致发现负性新闻/信息对人际互动存在消极影响,但其消极影响能否通过后继的更正信息(次发报道)而消除的问题极少有研究者关注。信任是“社会系统的重要润滑剂”,在人际关系的产生与维持过程中具有关键作用。依据信任的测量方式不同,可以将信任划分为外显信任和内隐信任。外显信任指的是直接获得的有意识的信任,内隐信任反映的的是一种间接的自动的心理联结。前人研究发现,反转新闻在一定程度上反转了被试对某一群体的外显信任,而对于反转新闻是否对涉事人物内隐信任存在影响这一问题我们还并不清楚,此外,先前的研究中外显信任多采用的是口头报告的信任评定等级,而对于反映人际互动的信任指标关注较少。因此,本研究设计了4个系列实验,通过行为实验和脑成像技术详细探讨了反转新闻对陌生人内隐和外显信任的影响及其影响因素。实验1以自编的反转新闻为实验材料,以无固定社会身份的陌生人为新闻目标人物,旨在考察反转新闻对涉事人物外显和内隐信任的影响。结果发现,只阅读次发报道和既阅读首发又阅读次发报道相比,对陌生人的信任评价和信任行为无显著差异,说明次发报道可以改善首发报道产生的“不信任”,反转新闻可能确实具有“反转”能力。但被试对陌生人的内隐信任态度与反转前没有显著差异,提示反转新闻没有有效“反转“被试对陌生人的内隐信任。另外,还发现只阅读首发报道的被试与只阅读次发报道或是同时阅读首发和次发报道的被试相比,对陌生人的评价更低,证明首发报道包含的负性信息确实可以降低被试对陌生人的人际信任,与先前有关负性信息影响信任的研究结果一致。实验2主要从主观因素,即从个体差异角度出发,考察了认知反思能力、胡说接受度和夸张人格是否影响反转新闻中次发报道改善人们对陌生人的外显和内隐信任。结果发现,不论是以原始分还是差异分为指标,认知反思能力、胡说接受度和夸张人格不同的被试在阅读反转新闻时,对陌生人信任的变化程度不存在差异;但胡说接受度影... {URL}: https://link.cnki.net/doi/10.27363/d.cnki.gtsfu.2020.000156 {DOI}: 10.27363/d.cnki.gtsfu.2020.000156 {Database Provider}: CNKI"
        - listitem [ref=e123]: "{Reference Type}: Newspaper Article {Title}: 外眼看普洱 {Author}: 臧灵; 刘绍容 {Secondary Title}: 普洱日报 {Date}: 2019-07-03 {Pages}: 001 {Publisher}: 普洱日报 {Notes}: 53-0008 {URL}: https://kns.cnki.net/kcms2/article/abstract?v=wYvQo-F_OPbUPn8WqFzUxfXLvBCB0RB_xow0TfPfIjyvJNoOReuGlwclub-jPku3kMtAV_Pjuw-zGvBlz0LIhCaOE4-A8QF_TGwZzE2gTf5sq9p5Stmf4IiwY_bZbGFdJr6Qz0LdxaJqu_pJyfIXp4pfggl8cHbY_1jS_cT70mDErbt7Bz0v9GexXbtxeokJpzYCL9IW66E=&uniplatform=NZKPT&language=CHS {Database Provider}: CNKI"
        - listitem [ref=e124]: "{Reference Type}: Thesis {Title}: 企业社交工作平台使用策略影响员工在线初始印象形成的机理研究 {Author}: 姜宏宇 {Tertiary Author}: 孙元 {Publisher}: 浙江工商大学 {Type of Work}: 硕士 {Year}: 2019 {Keywords}: 企业社交工作平台;使用策略;印象管理;归因理论;在线初始印象;机理研究 {Abstract}: 随着企业企业工作平台在组织内部中的渗透,促使组织网络透明化和团队虚拟化,员工间的“初见”更多地发生在线上,因此员工对其他同事初始印象的评价开始更多依赖于他人线上所呈现的人际互动线索。企业社交工作平台凭借其丰富的可供性等技术特征,也使得其为员工线上的“表演”提供了新的前台,员工可以采取前摄性的使用策略去运营自身的在线形象。在这样的现实背景下,信息系统学者们将印象管理的研究视角拓展至线上,开始探索行动者的在线印象管理策略及其带来的相应印象产出结果。本文通过对这一支流文献进行回顾,主要识别出了以下四个文献缺口:(1)已有的在线印象管理研究存在过程思维的断裂;(2)缺乏对在线印象管理策略的有效拓展,尤其是考虑到企业社交工作平台的技术特征为员工的策略性使用提供了有力支撑;(3)在线印象管理策略的研究聚焦于内容策略层面,即对“分享什么”的讨论,缺少对基于技术特征进行使用者“如何分享”的审视;(4)关于在线印象管理策略结果的研究,缺少对内在机理过程的探索。基于以上对现实背景和文献缺口的洞察,本文将员工的企业社交工作平台使用策略划分为两大维度:聚焦于分享内容层面的印象管理策略(自我验证和自我提升)和聚焦于分享方式层面的信息导向性策略(开放式和导向式)。进一步构建了员工在线印象管理策略的框架,两两交互得到四种在线印象管理策略:开放性自我验证,导向性自我验证,开放性自我提升和导向性自我提升。并将研究的情景界定在员工线上初始印象形成的背景下,进一步认为归因理论可以作为打开企业社交工作平台使用策略影响员工在线初始印象形成黑箱的内在机理。同时基于对企业实地调研和访谈的思考,构建了“企业社交工作平台使用策略(包括印象管理策略和信息导向性策略)——观察者归因(包括性格归因和人际归因)——在线初始印象(包括欣赏和喜欢)”的研究理论框架,进一步提出了理论假设和模型。本文通过采取实验的研究方法,设计了四种在线印象管理策略行为的情景,并通过企业实际调研进行修正和优化,最终设计了四种情景的研究问卷,并通过问卷星进行了企业员工样本数据的收集。通过对420份有效样本数据采取基于SPSS 16.0的方差分析和基于AMOS 24.0的验证性因子分析、结构方程模型以及Bootstrap中介分析,对模型假设进行了验证。主要研究结果和发现包括以下几点:(1)本文所采纳的两大类企业社交工作平台使用策略,即印象管理和信息导向性策略对观察者的性格和人际归因存在显著的交互作... {URL}: https://kns.cnki.net/kcms2/article/abstract?v=wYvQo-F_OPYbYROk3i72Z5R0xew4Q5bjrgXEZ39aW4cVrQAxGmbrxzDpbOAwWG2YTfcC0flJsCPkQigTdq7TLLtIVZOjc2oPA3ZB4JiMYztFZmf6QmI-ac5aOGH0v5v_fzgAm2lLwmBmnCeV0g6mnUwjvTZAqYhSY_Og73H7EyUvQD-RbiTWKs0kyy84ir0E&uniplatform=NZKPT&language=CHS {Database Provider}: CNKI"
        - listitem [ref=e125]: "{Reference Type}: Journal Article {Title}: 班级群正确聊天姿势 {Journal}: 课堂内外(高中版) {Year}: 2018 {Volume}: {Issue}: 9 {Pages}: 46-48 {Abstract}: <正>一个人待着好无聊,不管是搭电梯,等红绿灯,还是排队结账,人们总是习惯性地掏出手机,然后嘴角上扬地聊微信,刷小视频……好像打开手机,整个世界都不孤单了。好多人明明在生活里很丧,存在感渺小,可一旦到了网络世界,整个人血槽满格,一副人气网红的模样。这时有人就会酸溜溜地说,网络可以拯救现实生活里那些不善交际的人。言下之意,是他们没什么了不起,顶多就在虚拟网络里过过瘾。可毕竟我们每个人都身处网络时代,很多人早上一睁眼,第一件事不是立刻起床,而是找手机,刷朋友圈;到了学校、办公室,第一件事不是拿出课本,打开电脑,而是看看有没有因为赶路而错过的未读留言。网络社交创造了更多的互动场景,比如头像、对话框、个性签名、表情包、照片,甚至哪怕一句开场白都是这个时代里交际艺术的体现,如果用得好,是交际加分项,用不好,就是交际灾难片。你可能已经或者即将进入班级的QQ群、微信群,准备好来一场精彩的聊天,刷一波存在感了吗? {ISBN/ISSN}: 1007-4899 {Notes}: 50-1080/G4 {URL}: https://kns.cnki.net/kcms2/article/abstract?v=wYvQo-F_OPYzrOLzY7wxPyvdPNwcLL2mK99g-9ICBWJvRqWjtw2MEijG221r5nRpcrSNpp-BjNw0Q0Xh-NF-C8ytkc0eYEmJlvhu-qO3UW5Fu7rf-PoJd21GZXhNj5VxhmD709-uSbYR6nmA01J6vmsRL4l8NsqLBEj-ZKFzC5FrvrmbvcizNnZDNiMjk8_V&uniplatform=NZKPT&language=CHS {Database Provider}: CNKI"
        - listitem [ref=e126]: "{Reference Type}: Journal Article {Title}: 新媒体环境下突发事件的舆情传播路径及效应分析 {Author}: 姚广宜; 王京平 {Author Address}: 中国政法大学法治传播研究中心;中国政法大学; {Journal}: 报林 {Year}: 2018 {Volume}: {Issue}: 4 {Pages}: 52-54 {Keywords}: 突发事件;网络舆情;传播效应 {Abstract}: 新媒体环境下,突发事件的舆情生成、演化规律都发生了变化。在该案舆情传播过程中,社交媒体讨论促使事件发酵,网络媒体扩大了传播舆论场。随着网民话题的多样性,舆情呈现共情效应和首因效应。本文结合\"空姐打车遇害案\"舆情传播所呈现的不同舆情主题,分析了该事件在传播过程中的传播路径、传播效应,并针对突发事件媒体报道提出了相应的疏导策略。 {ISBN/ISSN}: 1672-383X {Notes}: 11-5028/G2 {URL}: https://kns.cnki.net/kcms2/article/abstract?v=wYvQo-F_OPYPrwzub_doZtAi-9oUdYzDXrmi0YW_EPY80GyJFX3ZpkwlOT1FJDq9VQapuKnVPdfvvigiqMPetFdfkrkfiyvHj2uKdbPOIl_HGLgN-LQ-Hq7lcKyFXiwLn8aTVifVXKU7XgQ3qZYTex_JxGVuak4-U4IQXsLk1yKWi-0xwaEctGp0gsPg4SiQ&uniplatform=NZKPT&language=CHS {Database Provider}: CNKI"
        - listitem [ref=e127]: "{Reference Type}: Thesis {Title}: 台湾大学生大陆信息解读与印象形成研究 {Author}: 程佳佳 {Tertiary Author}: 罗慧 {Publisher}: 厦门大学 {Type of Work}: 硕士 {Year}: 2018 {Keywords}: 台湾媒体;媒介接触;媒介解读;大陆印象 {Abstract}: 本文旨在了解台湾大学生如何解读大陆信息以及最后形成的大陆印象。笔者从大陆信息的媒介接触和媒介解读两方面了解台湾大学生媒介素养,并分析因此而形成的大陆印象。试图找出两岸之间存在的传播障碍和突破点,为未来两岸的和平交流提供建议。本研究采用以深度访谈为主、问卷调查为辅的方法,分析台湾大学生对大陆信息的认知、态度和行为倾向,辅以对访谈人员观察的方法,综合探究台湾大学生大陆印象的形成过程和关键因素。本研究主要发现如下:一、台湾大学生对大陆信息的关注方式比较被动,最主要的媒介渠道是网络,网络媒介信任度较低。二、台湾大学生媒介使用习惯:当前影响最大的是社交媒体,Facebook和Line的使用人数和频率最多,大陆社交媒体以微信和微博使用人数最多;传统媒体在过去有很强的影响力,如今透过互联网继续发挥着他们的影响力。三、媒介态度能影响台湾大学生的大陆态度,尤其是涉及安全和国际空间的敏感问题时,台湾本地媒体能极大地调动台湾大学生的态度,并朝他们引导的方向改变。四、两岸大学生之间的交流可以改善台湾民众对大陆的印象。五、大陆媒体的接触有助于改善台湾大学生的大陆印象。随着网络的普及,人们接触大陆信息的方式更加多元化,台湾大学生逐渐可以对大陆有更多面的认知,这为两岸交流增加了很多可能性。相信基于两岸真诚的交流和大陆经济的日益发展,两岸之间的关系越来越密不可分。 {URL}: https://kns.cnki.net/kcms2/article/abstract?v=wYvQo-F_OPbRbDW4L1mUfMmGkxCxPgYBy4GWYtxo24wsa9dp4XBtA1oVbVnJQ5byuQKH7Gtzw3fhvqf0xVJTEpjDLmSQSLamTzl6UkmMTaShpg06fnXTgfOLbatKagyfq7aZsKh-C5rtIqvtGDz_NiQe0lqnIqGEcAw2TEJKsHOncLh1OOVuQZ5kWzCM9KOT&uniplatform=NZKPT&language=CHS {Database Provider}: CNKI"
        - listitem [ref=e128]: "{Reference Type}: Book {Title}: 想象的互动 {Author}: 张放 {Publisher}: 北京大学出版社 {Date}: 201712 {Abstract}: 网络世界中的人际交往在当下已经成为人们日常生活的重要组成部分，网络人际关系也成为现实人际关系的重要补充。但通过网络人际传播进行的交往带给人们的是与线下交往完全不同的体验，人与人之间相互了解的途径和方式更是与线下迥然不同。本书通过对不同网络传播平台使用者进行在线访谈的质性研究和基于网络聊天模拟的控制实验研究对网络人际传播中印象形成的影响因素、机制与效果进行了探究，既是对网络媒介如何改变日常生活的理论探索，也可以作为传播学研究者从事控制实验研究、在线访谈研究的参考。 {Pages}: 248 {ISBN/ISSN}: 978-7-301-29169-6 {Database Provider}: CNKI"
        - listitem [ref=e129]: "{Reference Type}: Journal Article {Title}: 网络舆论中的网民心理因素探究——以“马里兰大学中国留学生毕业演讲事件”为例 {Author}: 江森 {Author Address}: 河北大学工商学院; {Journal}: 新媒体研究 {Year}: 2017 {Volume}: 3 {Issue}: 13 {Pages}: 11-12 {Keywords}: 留学生演讲;网络舆论;心理因素 {Abstract}: 随着信息技术的不断发展和互联网时代的到来,以及公众参与意识的提高,网络越来越成为社会热点事件中公众发表舆论的阵地,因而网络舆论的引导关乎整个互联网环境的净化与和谐。文章从首因效应、从众心理、恶魔效应、宣泄心理、相对剥夺感来分析在\"马里兰大学中国留学生毕业演讲事件\"中网民的心理因素。 {ISBN/ISSN}: 2096-0360 {Notes}: 10-1330/G2 {URL}: https://link.cnki.net/doi/10.16604/j.cnki.issn2096-0360.2017.13.005 {DOI}: 10.16604/j.cnki.issn2096-0360.2017.13.005 {Database Provider}: CNKI"
        - listitem [ref=e130]: "{Reference Type}: Thesis {Title}: 不同购物卷入度下的购物中心魅力度影响因素 {Author}: 张崇辉 {Tertiary Author}: 吴小丁 {Publisher}: 吉林大学 {Type of Work}: 博士 {Year}: 2017 {Keywords}: 感知线索;购物中心印象;魅力度;双重加工理论;形成性模型 {Abstract}: 消费者购物中心的印象是购物中心魅力度的决定因素。不同消费者对购物中心魅力度的认知各不相同。高购物卷入度消费者(即喜欢逛商场的人)和低购物卷入度消费者(即不喜欢逛商场的人)可能利用不同的购物中心印象组成部分来判断其魅力度。然而,鲜有研究关注不同卷入度消费者集聚魅力度影响因素的构成和各因素影响程度的差异。如果管理者能够了解两类消费者更容易被购物中心哪些因素所吸引,将有机会根据消费者的兴奋点来改变购物中心的相应特征,以此提高其魅力度,从而留住消费者。对魅力度决定因素的研究需要测量购物中心印象,然而现有研究没有能够提供一个被研究者广泛使用的量表,因为现有的量表存在着将形成性题项误用在反映性模型的问题。如果从购物中心印象形成过程入手,发掘能够形成印象的重要感知线索,将能够有效地利用形成性模型测量购物中心印象。本研究主要的问题是:哪些信息能够成为消费者形成购物中心印象的重要感知线索?怎样能够更为科学地测量购物中心印象?对高卷入度和低卷入度两种消费者而言,购物中心印象各个组成部分对魅力度的影响是否存在差异?根据双重加工理论,人们加工信息的过程分为两类,一类是详细地逐条加工与判断对象直接相关的信息,另一类是依据间接的信息启动大脑中的“图式”,依靠与回忆间接信息相关的情境来进行判断。基于以上理论的详尽可能性模型认为,人们究竟选择哪类信息加工过程取决于消费者的相关知识和卷入度,也就是人们认为所判断的事物的重要程度。相关知识越丰富,卷入度越高,人们越倾向于采用第一种信息处理方式,即中央路径,反之,人们倾向于采用第二种信息处理方式,即外围路径。购物中心的很多线索都是判断魅力度的信息,喜欢逛街的高卷入度消费者因为有足够的知识和经验判断商品的价值,所以倾向于选择中央路径,也就是商品和服务相关的信息判断购物中心魅力度,而不喜欢逛街的低卷入度消费者有可能利用与商品和服务不直接相关的信息判断魅力度,即倾向于选择外围路径。基于上述假设,首先从感知线索入手,利用文本分析工具NVivo10.0对2000条消费者购物中心网络评论进行内容分析,提取了155条购物中心印象的主要感知线索。在这些线索的基础上,本研究尝试开发了与传统的反映性模型不同的购物中心印象形成性量表,量表分为功能性、休闲娱乐、环境和便利性四个维度,共20个指标。量表通过了形成性模型的信度效度检验。最后一步探索购物中心印象、魅力度和购物卷入度之间的关系。研究共获得1029份有效样本,采用偏最... {URL}: https://kns.cnki.net/kcms2/article/abstract?v=wYvQo-F_OPbAnIndLbZNcfuZkewHbwfP4bvoBOgmV9SuwELkKAEMm5dRiAtS-DiHhvRXPXOd-E_EqlNpVQBJva7GF_rEsxR9rbf6kcIZ0dA7CDRPiafgBEzhzRdKCDi8-ysPMPUV0cjqRBSuQaPyfAVwqyqkLI0vwXp9I0zSC6IX_oe5wJss4PIXxplEn5t5zHCI6idfeQE=&uniplatform=NZKPT&language=CHS {Database Provider}: CNKI"
        - listitem [ref=e131]: "{Reference Type}: Thesis {Title}: 来华留学生对中国印象与其传播渠道使用的关系研究 {Author}: 赵晓艺 {Tertiary Author}: 赵梅 {Publisher}: 厦门大学 {Type of Work}: 硕士 {Year}: 2017 {Keywords}: 来华留学生;中国印象;传播渠道 {Abstract}: 本论文旨在研究来华留学生来华前后的传播渠道选择和对中国的印象。近年来,受经济发展和政策扶持的吸引,来华留学生人数不断增加,我国也越来越重视教育对外开放在对外传播中的作用,本研究正是在这种背景下展开。本研究以定量方法为主,辅以定性调查方法,通过对厦门大学在读的海外留学生进行问卷调查和访谈,分析他们在政府治理、社会发展和人口素养等维度上对中国的印象,并研究他们形成中国印象中的传播渠道选择和使用习惯,综合探究不同因素对印象形成的影响。本论文分为四章,包括绪论、研究设计与实施、留学生对中国的印象内容和传播渠道分析以及研究发现、研究建议和反思。第一章绪论提出了研究的核心问题,即来华留学生对中国的印象内容和印象形成的影响因素,研究不同传播渠道,尤其是大众传播和人际传播对国家印象形成所起的作用。第二章研究设计与实施部分详细阐述了本研究样本选取、问卷设计和施测的全过程。第三章分析部分是对收集到的问卷和访谈数据的具体分析。第四章阐述本研究的主要发现、提出建议和对研究不足的反思。本研究得出以下结论:(1)留学生来华前后对中国的印象略有不同,来华后对中国的印象更为正面;(2)留学生来华前后了解中国的首要渠道有所不同,来华前以传统媒体为主,来华后更依赖于社交媒体;(3)来到中国后,留学生在选择媒介时保持原有习惯和入乡随俗相结合,既关注国外主流媒体和网站,也积极使用中国的主要媒体和网站;(4)留学生中国印象的改变和形成受多种因素共同作用。 {URL}: https://kns.cnki.net/kcms2/article/abstract?v=wYvQo-F_OPYf_-aXtkOCtI4jHrmEXf6HyMvXX4UIBjD4z93MgtEhEgVSGxXv9SjD05WJA4e57dAvfaQk2QmZHeGFJZF-sApkeVOAZVYDgvq1-ZhVzsEYRC-uvwmli05wOLyOPKgKzCxlecNCYYOcpQXnWKf6qjqSmRyKwNMejmyyZ1PrtEKmxCKbRJT30qi4&uniplatform=NZKPT&language=CHS {Database Provider}: CNKI"
        - listitem [ref=e132]: "{Reference Type}: Journal Article {Title}: 第一印象 {Journal}: 初中生 {Year}: 2016 {Volume}: {Issue}: 34 {Pages}: 1 {Abstract}: <正>精彩有你:《初中生·博览》每期在扉页\"第一印象\"栏目中给出一个超短故事,欢迎看过故事的你一展口才。可以通过以下方式跟我们分享你对本故事的看法,对或错不重要,重要的是,我们素来心照不宣。微博:http://t.qq.com/chenyizhiyue(@尘衣)本刊网络媒体:kuka.hnjy.com.cn点赞在微博或微信朋友圈点赞和被点赞已经司空见惯。出于欣赏,出于礼貌,为了应酬,为了……有一天,他在微信朋友圈发出一条微信:\"朋友不幸住院了,好难过……\"刚发出,就有人给他\"秒赞\"了。 {ISBN/ISSN}: 1004-5546 {Notes}: 43-1043/G4 {URL}: https://kns.cnki.net/kcms2/article/abstract?v=wYvQo-F_OPbrkcPUvPck8gTR9qB__R0QHUKToouiD5H6a-64ly8e-swAJvP1TlPzuZ6JOB_XHgG580bBst2ufvyBnepeY8gKccUKczPJZf3E3pBwi6nA2TwQA3txMnZ5Yde0KgFpf7hxeuAIWgfEPfYSGECVWZouQ_069K5vecP_7C0Mx9C5RmN2VnB44nKD&uniplatform=NZKPT&language=CHS {Database Provider}: CNKI"
