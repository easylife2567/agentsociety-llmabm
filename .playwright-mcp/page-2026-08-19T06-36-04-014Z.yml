      - list [ref=e112]:
        - listitem [ref=e113]: "{Reference Type}: Thesis {Title}: 甜宠题材微短剧的“碎片化”叙事研究 {Author}: 陈宇丽 {Tertiary Author}: 刘辉;高小毛 {Publisher}: 深圳大学 {Type of Work}: 硕士 {Year}: 2023 {Keywords}: 网络微短剧;甜宠题材;“碎片化”叙事 {Abstract}: 加速社会下,人们的观看习惯日趋碎片化,快节奏、轻体量、强反转的网络微短剧迎来新发展。网络微短剧是指单集时长从几十秒到15分钟左右、有着相对明确的主题和主线、较为连续和完整的故事情节的网络影视剧作品。在短视频平台不断发展,短视频类型多样化的当下,微短剧成为其新的增长点。在众多类型中,甜宠题材的网络微短剧凭借数量与质量脱颖而出,成为一个颇有价值的研究对象。目前,短视频平台的甜宠题材微短剧经过发展阶段创作经验的积累,已展现出独特且稳定的叙事特征,大量的文本也证明了这一点。 本研究聚焦甜宠题材微短剧,运用叙事学理论试图探究甜宠题材微短剧的叙事特征,采用文本分析、案例分析、对比分析和深度访谈的研究方法。本论文分为四个部分。第一部分绪论,对甜宠题材微短剧的概念进行阐释,即介绍其相关概念与发展历程,从而梳理出各阶段的甜宠题材微短剧的特质,在此基础上从媒介及受众两个维度结合后经典叙事学理论分析当下甜宠题材微短剧的叙事语境;第二部分和第三部分是文本分析,以结构主义叙事学理论为基本框架分别从“故事”和“叙事话语”对短视频平台的甜宠题材微短剧进行论述,在案例选取上以播放量破亿的50部快手短视频平台甜宠题材微短剧作为本文的研究样本。第二部分对“故事”的分析主要围绕叙事主题和叙事人物展开。第三部分研究将结合甜宠题材微短剧的“微”特征对其叙事话语进行细致分析。甜宠题材微短剧一方面继承了甜宠剧的主要类型特征,但其在叙事视角、叙事结构、叙事时空和叙事语言等方面也随着微短剧这一新兴形态而发生改变;第四部分将通过对比分析从纵向与横向维度挖掘短视频平台甜宠题材微短剧的独特性,并结合深度访谈内容对甜宠题材微短剧叙事策略进行反思与展望。 研究发现,甜宠题材微短剧呈现出了“碎片化”的叙事特征:在碎片化传播与消费主义文化的叙事语境下,甜宠题材微短剧融合了短视频的生态和剧的形态,在快节奏的叙事时间和多元化的叙事空间里,通过扁平化叙事人物与高密度多反转的强情节以女性视角诠释着“爱与成长”的叙事主题。在叙事语言上,竖屏形式反传统横屏形象塑造思维而行,在视听语言上扩宽观众感官体验,渲染甜蜜氛围,为观众打造了一场短暂的“白日梦”。但其在叙事故事与话语上仍存在不足之处,目前甜宠题材微短剧仍然面临着同质化、悬浮化、浅表化的叙事困境,虽然甜宠题材微短剧为观众提供了短暂的情感安慰,但它采用流水线式的生产方式难逃过于随意、娱乐的窠臼,可能会对观众的情感观念造成一定的误解和偏差。... {URL}: https://link.cnki.net/doi/10.27321/d.cnki.gszdu.2023.003386 {DOI}: 10.27321/d.cnki.gszdu.2023.003386 {Database Provider}: CNKI"
