      - list [ref=e112]:
        - listitem [ref=e113]: "{Reference Type}: Journal Article {Title}: 迈向信任的算法个性化推荐——“一键关闭”的法律反思 {Author}: 林嘉; 罗寰昕 {Author Address}: 中国人民大学法学院; {Journal}: 编辑之友 {Year}: 2024 {Volume}: {Issue}: 3 {Pages}: 79-88 {Keywords}: 个性化推荐;算法规制;可信算法;隐私个人控制;“信息茧房” {Abstract}: 个性化推荐主要面临威胁人类主体自主性、“信息茧房”与“回音室”效应、大数据“杀熟”方面的质疑。“一键关闭”功能因能够实现隐私个人控制、促进信息自由流通和预防价格歧视而被推崇。然而，用户往往缺少隐私自治能力，个性化推荐造成群体极化之前首先具有议程凝聚、促进交往的价值，以关闭个性化推荐来解决价格歧视存在目标和手段的错位。“一键关闭”不仅难以符合规制预期，其自身还存在可操作度低和所承载公共价值模糊的弊端。个性化推荐的治理应以算法向善为方向，通过打造以信任为中心的透明可解释、用户交互友好的算法推荐，发挥个性化推荐的公共价值，增进社会福利。 {ISBN/ISSN}: 1003-6687 {Notes}: 14-1066/G2 {URL}: https://link.cnki.net/doi/10.13786/j.cnki.cn14-1066/g2.2024.3.011 {DOI}: 10.13786/j.cnki.cn14-1066/g2.2024.3.011 {Database Provider}: CNKI"
        - listitem [ref=e114]: "{Reference Type}: Thesis {Title}: 算法推荐背景下的Z世代新型媒介关系探讨 {Author}: 周子琳 {Tertiary Author}: 郑欢 {Publisher}: 上海师范大学 {Type of Work}: 硕士 {Year}: 2024 {Keywords}: Z世代;算法推荐;媒介关系;连接与反连接 {Abstract}: 随着大数据技术的发展,算法的应用在我们的日常生活中越来越广泛,例如知识检索、导航路线、浏览讯息等行为,其背后呈现着算法推荐的力量。Z世代作为最频繁使用新媒体平台的用户群体之一,算法机制对Z世代群体产生了深远的影响。目前的研究大多聚焦于对媒体平台算法机制的反思与批判,或是对算法生成的文本内容进行经验性探讨,这些研究普遍将受众视为被动接收者,对于受众在回应算法推荐内容时如何展现其个体能动性的深入讨论仍显不足。传统的媒介观将受众看作是一个被动接受信息的角色,发展成为了对算法推荐信息的被动接受,然而现在的Z世代年轻人具有独立、个性的特征,在信息接收的过程中,不再是只被动接收,而在引导算法推荐、主动地选择自己感兴趣信息的过程,构建起Z世代与新兴媒体特殊的媒介关系。本文旨在深入剖析算法背景下Z世代群体如何积极回应算法推荐,对Z世代在构建新兴媒介关系所表现出的主观能动性,及其可能形成的新型人、媒关系做出探讨。 本研究采用半结构式访谈和网络民族志两种研究方法,以抖音平台上的Z世代用户为例,深入探究智能媒介环境下他们与算法进行互动,以及这种互动关系所体现出的深层内涵。通过三级编码过程,本研究提炼出“算法认知”“使用习惯”“算法依赖”“主动嵌入”以及“连接与反连接”五个阶段,多维度揭示Z世代用户在建构人机和谐共生关系中的意义。 {URL}: https://link.cnki.net/doi/10.27312/d.cnki.gshsu.2024.002122 {DOI}: 10.27312/d.cnki.gshsu.2024.002122 {Database Provider}: CNKI"
        - listitem [ref=e115]: "{Reference Type}: Journal Article {Title}: 推荐算法对青年大学生思想行为的影响及引导研究 {Author}: 代艳丽; 肖扬 {Author Address}: 南华大学马克思主义学院; {Journal}: 邵阳学院学报(社会科学版) {Year}: 2024 {Volume}: 23 {Issue}: 1 {Pages}: 93-99 {Keywords}: 推荐算法;信息分发;青年大学生;思想;行为 {Abstract}: 推荐算法通过其特殊的信息分发匹配模式，帮助青年大学生拓宽知识渠道、降低对冗余信息的吸收，对大学生的个性化需求进行“精准投喂”。但同时，推荐算法也给青年大学生思想认知造成困扰，影响其正确价值观的形成，造成部分青年大学生的行为异化。因此，应该发挥课堂主渠道作用，提升大学生的算法素养；加强教育引导和规范约束，帮助大学生树立正确的价值观；加强算法治理，助力青年大学生养成良好行为习惯。 {ISBN/ISSN}: 1672-1012 {Notes}: 43-1404/Z {URL}: https://kns.cnki.net/kcms2/article/abstract?v=wYvQo-F_OPaM7MnUHcojAC9V6gATIs40qq4C_KsnrmmAKpIJRche3sMoPntAy7MIvw5VlK5-WXZhWi3pcugQ2ATNptcB4SV8T7MJLOoxXvAhAMEyL2c_s1gobpQixlGg_lFL62tPGGo8dFCtKQ61C6a9KrDtQL3z60VEJKz8CnMLUV3eBti9wQ3JKT3dv6eH&uniplatform=NZKPT&language=CHS {Database Provider}: CNKI"
        - listitem [ref=e116]: "{Reference Type}: Journal Article {Title}: 信息圈层化及其形成机制：基于ERGM的分析 {Author}: 晏齐宏 {Author Address}: 北京交通大学语言与传播学院; {Journal}: 湖南师范大学社会科学学报 {Year}: 2024 {Volume}: 53 {Issue}: 1 {Pages}: 111-124 {Keywords}: 信息圈层化;信息共同关注网络;网络自组织;指数随机图模型 {Abstract}: 以复杂网络为视角，将信息圈层化操作化为用户信息共同关注网络，通过日志法收集用户信息接触数据，采用指数随机图模型(ERGM)分析圈层化的形成机制。研究发现，用户信息共同关注网络密度较低，呈现圈层化趋势。用户属性(包括人口特征、媒介使用偏好)、既有社交关系和信息关注网络的自组织结构影响信息圈层化，其中网络自组织结构的影响远远大于其他要素，节点的点度中心性、聚集系数正向影响信息圈层化，但中介中心性负向影响信息圈层化。用户社交关系数量、社交关系强度的影响因信息关注网络中的自组织结构而弱化，进而并不影响信息圈层化，线上社交媒体使用不会促进信息圈层化。此外，算法推荐平台使用偏好、算法政治信息偏好不会导致信息圈层化。 {ISBN/ISSN}: 1000-2529 {Notes}: 43-1541/C {URL}: https://link.cnki.net/doi/10.19503/j.cnki.1000-2529.2024.01.012 {DOI}: 10.19503/j.cnki.1000-2529.2024.01.012 {Database Provider}: CNKI"
        - listitem [ref=e117]: "{Reference Type}: Journal Article {Title}: 算法赋能思想政治教育的机遇、挑战与路径选择 {Author}: 赵元成; 何叶 {Author Address}: 杭州师范大学沈钧儒法学院; {Journal}: 河南科技学院学报 {Year}: 2024 {Volume}: 44 {Issue}: 2 {Pages}: 1-7 {Keywords}: 算法;思想政治教育;推荐算法;赋能优势 {Abstract}: 随着信息技术的发展，人类进入了数字化时代，这给思想政治教育发展带来新的契机与挑战。算法技术的出现改变了传统信息的生成和分发机制，对思想政治教育对象的行为方式和价值引导产生了权利效应。因此，需牢牢抓住算法赋能思想政治教育的现实机遇，面对算法技术“受众本位”“黑箱效应”“后真相”“信息茧房”等效应带给思想政治教育的一系列风险挑战，应从价值引领、技术规范、主体驾驭、法律规制等路径“驯化”、规约算法，从而助推智能媒体时代思想政治教育的精准化发展。 {ISBN/ISSN}: 1673-6060 {Notes}: 41-1382/Z {URL}: https://kns.cnki.net/kcms2/article/abstract?v=wYvQo-F_OPahCU4r41x2mKb0aULLbqfhKa5PoOVtyboBwprHZJn6ToCD-WCTIjNalZD93LOZvK4gZV1ZqBDAA6zPOWmnEA6Oaw4A_TrGCKg31AZezmaE3UehSQBdkBOBDYqodHFiAxoYEhHlrM8byewb9FEuRZYox8rCu7F6mQwT5_BfXxBuV4V9OST-pBuf&uniplatform=NZKPT&language=CHS {Database Provider}: CNKI"
        - listitem [ref=e118]: "{Reference Type}: Journal Article {Title}: 算法推荐技术对新闻公共性的贬损及重建路径 {Author}: 刘佳颖; 符冰 {Author Address}: 湖北文理学院; {Journal}: 新闻潮 {Year}: 2024 {Volume}: {Issue}: 2 {Pages}: 6-8 {Keywords}: 算法推荐;新闻公共性;新闻伦理 {Abstract}: 在互联网时代，算法成为新闻分发的核心。随着算法推荐技术的快速发展，它背后造成的黑箱、信息茧房、群体极化事件也引起了人们的反思。新闻公共性是新闻专业主义的特征与理想，本文结合现实案例，总结算法推荐技术驱动下的新闻业的“反公共性”表现，探讨上述表现形成的原因，展示对算法推荐技术的辩证思考，并提出突破算法推荐困境的可行性路径。 {ISBN/ISSN}: 2095-4182 {Notes}: 45-1044/G2 {URL}: https://kns.cnki.net/kcms2/article/abstract?v=wYvQo-F_OPZOFfmn1cU97ABhRTICaU4dPlf8KDkQ48F57uln9O3AkiZmmzekPK9sZ4wYgCUXL7NRa08zgPfEokmu6mxxzy6RR2-V6dBPC2jP5mu0pktKz04OTciA4IdWwEe4RylqcvwbZAICoAr-2xsCJExLloJvvEfLO0D0ywhsOUra-RZnQxHFrN3qp_af&uniplatform=NZKPT&language=CHS {Database Provider}: CNKI"
        - listitem [ref=e119]: "{Reference Type}: Journal Article {Title}: 主流媒体如何运用算法推荐机制强化舆论引导力 {Author}: 周娜 {Author Address}: 广西广播电视台; {Journal}: 传媒论坛 {Year}: 2024 {Volume}: 7 {Issue}: 3 {Pages}: 14-16+20 {Keywords}: 主流媒体;算法推荐;舆论引导 {Abstract}: 在数字化时代背景下，算法推荐机制的出现缓和了互联网信息的海量增长与个性化需求的矛盾。然而，算法推荐机制也对主流媒体产生了冲击，主流媒体如何运用算法推荐机制强化舆论引导力成为一个值得研究的课题。在论述算法推荐机制含义、机制和优势的基础上，分析探讨算法推荐机制对主流媒体的冲击，并从“中心再造”、做好主流价值内容、重视用户的阅读体验、内容精准推荐等方面详细论述主流媒体运用算法推荐机制强化舆论引导力的策略。 {ISBN/ISSN}: 2096-5079 {Notes}: 36-1348/G2 {URL}: https://kns.cnki.net/kcms2/article/abstract?v=wYvQo-F_OPamyKtuQdjbX9QeXBgNz_DEh9M8bSFdKkO3g2wfZIEQOepFhIzFIjuk83lKKOguDZSzPehMAYMcRajRTYaL2b5-ERKpOBdbOWbcUnDf1cyOPEwvbDHjI-eFa10fRU2i8Wek21wdLMxPhIp7eKjxCfDBOV3Vsu7xyVAYEhgB_uJVIFPK9p8UobKg&uniplatform=NZKPT&language=CHS {Database Provider}: CNKI"
        - listitem [ref=e120]: "{Reference Type}: Journal Article {Title}: 新媒体背景下高校思想政治教育面临的挑战及对策分析 {Author}: 解永菲 {Author Address}: 太原科技大学马克思主义学院; {Journal}: 新闻研究导刊 {Year}: 2024 {Volume}: 15 {Issue}: 3 {Pages}: 197-199 {Keywords}: 新媒体;高校;思想政治教育;挑战;对策 {Abstract}: 新媒体背景下，随着网络信息技术的广泛应用，人们对电子产品的依赖性日益增强，“低头族”是这一时期的典型代表。当前，信息内容丰富多样，传播方式更加灵活、速度加快，为各项工作开展提供了极大便利，思政教育也迎来了良好发展机遇。思政教育工作者可在新媒体平台上发布思政教育信息，学生通过平台获取信息、接受教育，这丰富了思政教育形式，增强了思政教育效果。与此同时，新媒体背景下的思政教育也面临着巨大挑战。海量、碎片化的信息往往会导致一些学生难辨真伪是非。地域间的文化、政治等差异则影响着思政教育的发展。对此，高校思想政治教育工作者应积极转变教学理念，优化创新教育教学方法，增强思想政治教育实效性。文章首先分析了新媒体背景下高校思想政治教育面临的挑战，包括算法推荐与碎片化影响、媒介素养水平不高、“知沟”与“数字鸿沟”影响、思政教育监控难度大等，然后提出应对新媒体背景下高校思想政治教育挑战的有效策略，包括努力提升思政教师水平，有效应对“信息茧房”与碎片化问题；丰富课程与活动，提高学生媒介素养；发挥宏观政策作用，促进思政教育开展；开展高校思政教育自我监管。运用新媒体的优势，打破传统教育限制，促进高校思想政治教育有序、全面推进。 {ISBN/ISSN}: 1674-8883 {Notes}: 50-1205/G2 {URL}: https://kns.cnki.net/kcms2/article/abstract?v=wYvQo-F_OPb6ctJY2R1hprp2SDKAyp3j7phdRecxDZf5NgecuG3u3KK2a2G2AoaqKKXdzdETOibuTYr0kLJKdwoUu_OIqh7W41GacDLTexty126V9834rrOvHP_ICHY3iiPUIux3vE5Fhu9BJ1_FJhNFakg9niuCwEnFYPFXsqKTa-eOt_wMHHssyjx1lfEQ&uniplatform=NZKPT&language=CHS {Database Provider}: CNKI"
        - listitem [ref=e121]: "{Reference Type}: Newspaper Article {Title}: 别让“算法”成为“算计” {Author}: 卢泽华 {Secondary Title}: 人民日报海外版 {Date}: 2024-02-05 {Pages}: 008 {Publisher}: 人民日报海外版 {Notes}: 11-0066 {URL}: https://link.cnki.net/doi/10.28656/n.cnki.nrmrh.2024.000398 {DOI}: 10.28656/n.cnki.nrmrh.2024.000398 {Database Provider}: CNKI"
        - listitem [ref=e122]: "{Reference Type}: Journal Article {Title}: 梗阻与纾解：融媒体视域下主流意识形态传播力的提升 {Author}: 侯再宣; 童欢 {Author Address}: 贵州师范大学历史与政治学院;华南理工大学公共管理学院; {Journal}: 中共云南省委党校学报 {Year}: 2024 {Volume}: 25 {Issue}: 1 {Pages}: 65-73 {Keywords}: 融媒体;主流意识形态;传播力;现实梗阻;纾解路径 {Abstract}: 当前，媒体传播技术迭代发展，由传统媒体和新媒体“联姻”而成的融媒体，深度重塑了主流意识形态的传播图景。相比传统的传播模式，融媒体视域下，主流意识形态传播呈现出资源与权力分配的改变，算法推荐“信息茧房”的束缚，技术赋权和平权对权威的弱化等表征。面对算法推荐的感性化传播致使主流意识形态理性“让位”，网络“去中心化”的垂直传播致使主流意识形态的权威分散，技术狂欢图景动摇了主流意识形态传播引领力的现实梗阻。纾解融媒体视域下主流意识形态传播力的梗阻，需要强化主流意识形态感性化传播力，增强主流意识形态“再中心化”的形塑力，加强主流意识形态网络传播的制度监管力，提高社会组织传播主流意识形态的参与力。 {ISBN/ISSN}: 1671-2994 {Notes}: 53-1159/C {URL}: https://link.cnki.net/doi/10.13410/j.cnki.ypcscpc.2024.01.007 {DOI}: 10.13410/j.cnki.ypcscpc.2024.01.007 {Database Provider}: CNKI"
        - listitem [ref=e123]: "{Reference Type}: Journal Article {Title}: 数字阅读中信息茧房的触发因素及应对策略研究 {Author}: 滕广青; 梁陈濡; 庹锐 {Author Address}: 东北师范大学信息科学与技术学院信息管理系;东北师范大学信息科学与技术学院; {Journal}: 图书馆学研究 {Year}: 2024 {Volume}: {Issue}: 1 {Pages}: 68-77 {Keywords}: 数字阅读;信息茧房;触发因素;模糊集定性比较分析 {Abstract}: 数字阅读中的信息茧房效应容易造成读者信息窄化与知识局限，识别信息茧房的触发因素有助于探寻破茧对策以促进阅读推广。文章选取信息特征、个性化选择、算法推荐、社交环境4个维度的条件变量，采用模糊集定性比较分析(fsQCA)的方法，对信息茧房效应的触发因素进行组态分析。研究发现，数字阅读中信息茧房效应的产生受到多种因素共同影响。由信息特征、个性化选择、算法推荐3个因素联合构成的组态路径覆盖率最高，在非以上3种因素影响的情况下社交环境也会触发信息茧房。文章在此基础上提出消除或削弱数字阅读中信息茧房效应的阅读策略，以期为数字阅读中的信息茧房治理提供科学参考。 {ISBN/ISSN}: 1001-0424 {Notes}: 22-1052/G2 {URL}: https://link.cnki.net/doi/10.15941/j.cnki.issn1001-0424.2024.01.009 {DOI}: 10.15941/j.cnki.issn1001-0424.2024.01.009 {Database Provider}: CNKI"
        - listitem [ref=e124]: "{Reference Type}: Journal Article {Title}: 从算法依赖到合理利用:青少年数字化阅读的算法茧房与破茧之径 {Author}: 程富; 吴亦繁; 袁庚申 {Author Address}: 河北体育学院;河北开放大学; {Journal}: 河北青年管理干部学院学报 {Year}: 2024 {Volume}: 36 {Issue}: 1 {Pages}: 26-33 {Keywords}: 数字化阅读;算法依赖;信息茧房;认知茧房;社交茧房;信息素养;媒介素养 {Abstract}: 算法茧房阻碍了青少年的多元化阅读，危害到他们的全面发展和健康成长。算法茧房按不同层面可以分为信息茧房、认知茧房和社交茧房，三者相互关联、相互影响。信息茧房使青少年获取信息单一化、碎片化、浅俗化，认知茧房主要会削弱青少年的批判性思维能力和创新性思维能力，社交茧房会造成青少年与现实疏远和脱节。逐利至上的商业运营是滋生源头，相互影响的社交网络在强化偏好，用户兴趣和认知偏差是重要动因。为破解算法茧房，提出用户层面要增强信息素养、开展混合比阅读；平台层面要优化算法推荐系统，提供给用户更多自主选择权；“家校社”层面要营造良好的家庭阅读环境，加强社会宣传教育引导，开展学校数字阅读教育等一系列措施，帮助提高青少年数字化阅读能力和水平。 {ISBN/ISSN}: 1008-5912 {Notes}: 13-1260/D {URL}: https://kns.cnki.net/kcms2/article/abstract?v=wYvQo-F_OPZqIZjpDqUEoCCAe1fy9heWfnLdhsfnB1SEC90Mo8aC6M6kM-c2grjXLAHtBT2jCt-nhyF7Mh020AVWniLjvZVM_JksHQVlKAhHflaP6ZR9wEZwB71JbbCvrUP1XdD9yHRusiMVHRjtnm2snaBkZu6MOjzURs-RevobT24GiIWALqRtklQ1ty6K&uniplatform=NZKPT&language=CHS {Database Provider}: CNKI"
        - listitem [ref=e125]: "{Reference Type}: Journal Article {Title}: 个性化推荐算法的法律风险规制 {Author}: 谢永江; 杨永兴; 刘涛 {Author Address}: 北京邮电大学互联网治理与法律研究中心; {Journal}: 北京科技大学学报(社会科学版) {Year}: 2024 {Volume}: 40 {Issue}: 1 {Pages}: 77-85 {Keywords}: 个性化推荐;算法;法律风险;法律规制 {Abstract}: 信息爆发增长催生了个性化推荐算法技术的兴起。个性化推荐算法在解决信息过载和长尾问题、满足用户个性化需求、提高互联网信息服务效率的同时，也引发了用户意思自治受限、隐私泄露、信息茧房、算法歧视等诸多法律风险，亟需法律作出必要的回应。为此，应当在诚信原则、自主原则、公正原则、比例原则的指导下，树立开放的隐私保护观，强化算法告知义务与用户拒绝权利，完善算法解释权，构建算法审计制度，以降低个性化推荐算法所带来的法律风险。 {ISBN/ISSN}: 1008-2689 {Notes}: 11-3975/C {URL}: https://link.cnki.net/doi/10.19979/j.cnki.issn10082689.2022110031 {DOI}: 10.19979/j.cnki.issn10082689.2022110031 {Database Provider}: CNKI"
        - listitem [ref=e126]: "{Reference Type}: Journal Article {Title}: 算法赋能公共文化治理现代化：逻辑、症候与纾解 {Author}: 黄莹莹; 杨弘 {Author Address}: 东北师范大学政法学院; {Journal}: 湖北社会科学 {Year}: 2024 {Volume}: {Issue}: 1 {Pages}: 60-67 {Keywords}: 公共文化治理现代化;算法赋能;逻辑;症候;纾解 {Abstract}: 算法作为计算机通过模拟人的思维在数据的喂养下将输入数据转化为输出数据的计算模型，是推进公共文化治理现代化的重要技术要素。随着公共文化传播日益“算法化”，作为技术、权力、媒介的算法成为公共文化传播的重要中介。算法基于用户画像进行公共文化精准推送、以虚拟趣缘社群助力文化共同体构建、促进社会力量参与公共文化服务供给，在方式、目标和主体维度赋能公共文化治理现代化。算法是一柄双刃剑，算法落入数据陷阱放大治理公平困境，平台造成的过滤气泡固化受众文化审美“茧房”，对算法的依赖掣肘治理主体能力提升，由此产生普惠均等困境加剧、公共文化空间逼仄、主流文化价值遗失的症候，阻滞公共文化治理现代化，因而算法赋能公共文化治理现代化表现为一种悖论。为此，需要彰显人文关怀，观照算法“弃民”以促进公共文化服务普惠均等；提升算法开发者和公众的算法素养，冲破文化审美茧房；强化协同思维，聚合多元主体治理合力以克服算法依赖。 {ISBN/ISSN}: 1003-8477 {Notes}: 42-1112/C {URL}: https://link.cnki.net/doi/10.13660/j.cnki.42-1112/c.016282 {DOI}: 10.13660/j.cnki.42-1112/c.016282 {Database Provider}: CNKI"
        - listitem [ref=e127]: "{Reference Type}: Journal Article {Title}: 智能传播时代的范式转变：媒介技术研究十大观点（2023） {Author}: 张洪忠; 徐鸿晟 {Author Address}: 北京师范大学新闻传播学院;青海师范大学新闻学院; {Journal}: 编辑之友 {Year}: 2024 {Volume}: {Issue}: 1 {Pages}: 38-44 {Keywords}: 大模型;机器行为范式;生成式人工智能;算法推荐;媒介伦理 {Abstract}: 目前，人工智能已广泛应用在信息传播领域。文章选取了2023年与媒介技术研究相关的文献，整合成十大观点：基于人类中心主义建立的传播学研究范式在研究对象、理论、方法三方面都受到人工智能技术的挑战，机器行为范式成为智能传播时代传播学研究的新路径；人工智能赋能传媒业应用与实践，多模态助力国家形象建构打开局面；大模型使用推动网络结构向超级节点的再中心化演变，进而对人类文明进程产生影响；深度伪造制造认知“罗生门效应”，推动网络空间“舆论战”向“认知战”范式转型；算法推荐带来的新旧宣传范式迭代，反思用户人为因素对“信息茧房”的影响；生成式人工智能对感官延伸到人类情感弥补具有重要影响，元宇宙进化了人类情感维度；人类感知和认知模式在智能传播时代迎来新转变，引导心理、社会、艺术研究路径发生变化；“新常人”推动传媒业和社会关系发生新变革，媒体行业结构遭遇新挑战；内容生产中的道德伦理与价值规范问题讨论延展到生成式人工智能领域，应尽快建立完善关于生成式人工智能内容生产相关法律法规；智能传播时代“数字遗民”的社会边缘化问题，以期对今后媒介技术研究有所助益。 {ISBN/ISSN}: 1003-6687 {Notes}: 14-1066/G2 {URL}: https://link.cnki.net/doi/10.13786/j.cnki.cn14-1066/g2.2024.1.005 {DOI}: 10.13786/j.cnki.cn14-1066/g2.2024.1.005 {Database Provider}: CNKI"
        - listitem [ref=e128]: "{Reference Type}: Journal Article {Title}: 信息茧房的形成机理、效应检视及治理进路 {Author}: 郝永华; 陈建华 {Author Address}: 中共安徽省委党校(安徽行政学院)马克思主义学院;中共安徽省委党校(安徽行政学院)校刊部; {Journal}: 中共福建省委党校(福建行政学院)学报 {Year}: 2023 {Volume}: {Issue}: 6 {Pages}: 103-110 {Keywords}: 网络生态;信息茧房;形成机理;综合治理 {Abstract}: 我国超10亿的网民构建起世界最大的网络空间场景，迭代演变的网络新现象深刻影响着网络空间生态发展。信息茧房作为网络用户获取信息、交流信息过程中产生的一种广谱现象，对网络空间生态的影响不容小觑。信息茧房形成需要一定的条件，文章从信息需求、信息供给、信息运营等环节探析信息茧房的形成机理，辩证分析、评估信息茧房的正负效应，进而在肯定信息茧房正面效应的同时，提出从网络用户、网络平台、技术创新、政府部门等方面防范和抑制其负面效应的治理进路。 {ISBN/ISSN}: 2096-8132 {Notes}: 35-1338/C {URL}: https://link.cnki.net/doi/10.15993/j.cnki.cn35-1198/c.2023.06.003 {DOI}: 10.15993/j.cnki.cn35-1198/c.2023.06.003 {Database Provider}: CNKI"
        - listitem [ref=e129]: "{Reference Type}: Thesis {Title}: 移动社交媒体智能推荐环境下信息交互行为研究 {Author}: 王雪 {Tertiary Author}: 查先进 {Publisher}: 武汉大学 {Type of Work}: 博士 {Year}: 2023 {Keywords}: 信息交互行为;社会交互;算法交互;移动社交媒体;智能推荐 {Abstract}: 智能推荐算法是一种能够根据用户的客观行为或明确表示的偏好主动向用户推荐感兴趣信息的信息技术,正广泛应用于移动社交媒体中,使得用户所面临的信息环境发生根本性变化,对用户信息行为产生重要影响。信息交互行为是指用户围绕信息采取的交流、反馈和参与行为,是一种对用户、平台、技术、社会等都具有深远影响的常见信息行为。在移动社交媒体智能推荐环境下,信息交互的主体和客体发生改变,内涵更加丰富,用户的信息交互行为已发生深刻变革。对移动社交媒体智能推荐环境下的信息交互行为进行研究具有重要的理论价值和实践意义。 论文围绕移动社交媒体智能推荐环境下的信息交互行为,从定性和定量、整体和局部的多种角度,结合社会学习理论、用户适应应对(Coping Model of User Adaptation,CMUA)模型、刺激-机体-反应(Stimulus-Organism-Response,S-O-R)模型等多种理论或模型,利用半结构化深度访谈、扎根理论、问卷调查、结构方程建模、层次回归分析、多群组分析、比较分析等多种方法,对其表现形态、行为方式、形成机理、影响规律、引导对策等进行了深入、系统的研究。论文共包括七章,其中核心章为第三章至第六章。 第一章阐述了论文的研究背景和意义、国内外相关研究现状、研究内容和方法,以及主要创新点。 第二章介绍了社会学习理论、CMUA模型、S-O-R模型及其理论应用现状。 第三章从定性的角度,通过对半结构化深度访谈所获得的原始数据进行扎根理论三级编码分析,充分挖掘了移动社交媒体智能推荐环境下信息交互行为的表现形态和行为方式,构建了移动社交媒体智能推荐环境下信息交互行为的形成机理模型。研究发现:信息交互行为包括社会交互行为和算法交互行为两种表现形态,其中社会交互行为包括单向社会交互行为和双/多向社会交互行为两种行为方式,算法交互行为包括积极交互行为、消极交互行为、失实交互行为和规避交互行为四种行为方式;信息交互行为的形成机理可以借助S-O-R模型和CMUA模型来解释,其中人际特征、系统特征、信息特征、情感、内在自我认知、外在环境认知和行为结果认知等变量影响社会交互行为的形成,感知机会、感知威胁、算法认知、观察学习和适应应对认知等变量影响算法交互行为的形成;信息特征和行为结果认知影响感知机会、感知威胁和算法认知。 第四章从定量的角度,基于第三章所构建的形成机理模型、社会学习理论和S-O-R模型,从社会学习视角构建了社会价... {URL}: https://link.cnki.net/doi/10.27379/d.cnki.gwhdu.2023.003878 {DOI}: 10.27379/d.cnki.gwhdu.2023.003878 {Database Provider}: CNKI"
        - listitem [ref=e130]: "{Reference Type}: Thesis {Title}: 智媒时代信息茧房的成因分析 {Author}: 仇瑞 {Tertiary Author}: 陈爱辉 {Publisher}: 天津大学 {Type of Work}: 硕士 {Year}: 2023 {Keywords}: 信息茧房;个人情绪;群体认同感;中介效应 {Abstract}: 随着互联网时代更有效地进行推广与宣传的目标,智慧媒体以及推荐算法越来越多地被使用,而用户的个人信息茧房产生,使其沉迷在自己所喜欢看到的信息当中,形成个人信息的“壁垒”。虽然从社会学角度,信息茧房可能是一个需要尽可能规避的害处,但从企业角度出发,信息茧房却是一把双刃剑。K公司作为高新技术产业企业,在决策、员工人力状态稳定、生态合作开展以及品牌推广等过程中,既缺少对内的信息茧房评估与规避,在对外品宣中又缺乏对信息茧房的正向利用。因此本文以K公司为背景,依托信息茧房概念,开展本次研究。 本文理论部分以智媒时代条件下为背景,对原有研究成果进行了梳理,进一步进行研究。基于国内外研究成果为基础,本次研究提出了从个人情绪视角出发,以群体认同感作为中介变量的智媒时代下信息茧房度影响机制的四个假设,并建立了以信息茧房度为核心的假设模型。通过对成熟量表的学习梳理并结合本文研究内容修改编制形成研究所需的问卷,并依据完成结果进行筛选并开展实证分析,分别验证了个人情绪、群体认同感对信息茧房的相关性,个人情绪对群体认同感的影响,以及群体认同感的中介作用,最后确认了假设模型的正确性。 实践建议部分依据信息茧房的概念,以及研究所验证的理论模型,对K公司现有情况与理论相结合,形成如下实践建议: (1)决策模型可通过加强行业分析与解决办法疏导,引入多维度思路与办法,降低决策层悲观情绪等引发的个人信息茧房,增强决策稳定性与可靠性; (2)在员工待遇降低等背景下,需正向引导员工群体情绪,降低“企业不好我开心”等个人信息茧房影响,避免持续性骨干离职现象的方案; (3)通过企业内部工作互通,外部厂商团队共建,小组内部信心加强等多维度手段,实现小组中零合作厂商“黑名单”,遏制“我们能力不如友商”等的个人信息茧房。 (4)品牌推广应加强情绪的把控与利用,对有利群体的支持与打造,规避不利的热点事件以及群体的意见建议,形成客户感觉“这个品牌更懂我”的群体性个人信息茧房。 本文通过对个人情绪视角下的信息茧房形成机制进行研究,以K公司为例,为企业与组织在实际运营中在应对信息茧房提供了借鉴。 {URL}: https://link.cnki.net/doi/10.27356/d.cnki.gtjdu.2023.004466 {DOI}: 10.27356/d.cnki.gtjdu.2023.004466 {Database Provider}: CNKI"
        - listitem [ref=e131]: "{Reference Type}: Journal Article {Title}: 数字化时代“信息茧房”风险与民族事务治理 {Author}: 田钒平; 田甡睿; 张耀 {Author Address}: 西南民族大学中华民族共同体学院中华民族共同体研究院;香港恒生大学社会科学学院;西华师范大学法学院; {Journal}: 民族学刊 {Year}: 2023 {Volume}: 14 {Issue}: 8 {Pages}: 72-84+163 {Keywords}: 算法推荐技术;信息茧房;技术治理;民族事务治理现代化;铸牢中华民族共同体意识 {Abstract}: 在数字化时代，数字技术的广泛运用使各族公民得以分享数字红利，但在民族事务治理领域也易于引发“信息茧房”困境。民族事务治理中的“信息茧房”现象是民族事务与“信息茧房”交织叠加的产物，有效规制民族事务治理领域中的“信息茧房”风险，是在数字社会推进民族事务治理现代化的必然要求。在发生机理上，民族因素信息的数据化、各族公民选择的偏好性以及算法推荐技术的助推性是民族事务治理中“信息茧房”现象产生的主要原因，而对民族事务治理领域中“信息茧房”的治理不当极易引发阻碍民族交往交流交融、削弱铸牢中华民族共同体意识网络传播力、冲击现有民族事务治理体系和治理能力等外溢风险。在新时代民族事务治理中，为有效发挥数字技术治理优势，预防化解“信息茧房”负面效应，应健全政府对民族事务治理领域中“信息茧房”的法律监管职责、强化平台企业的公共传播责任、不断提升各族公民的网络信息素养，在网络空间中更好地铸牢中华民族共同体意识。 {ISBN/ISSN}: 1674-9391 {Notes}: 51-1731/C {URL}: https://link.cnki.net/urlid/51.1731.C.20240206.1356.022 {Database Provider}: CNKI"
        - listitem [ref=e132]: "{Reference Type}: Journal Article {Title}: 算法推荐下青年思想政治教育的“信息茧房”困境与突破 {Author}: 宋旭东 {Author Address}: 上海交通大学马克思主义学院; {Journal}: 潍坊工程职业学院学报 {Year}: 2023 {Volume}: 36 {Issue}: 6 {Pages}: 24-30 {Keywords}: 算法;“信息茧房”;思想政治教育 {Abstract}: 算法推荐技术搭建了相对隐蔽、遵循资本逻辑、具有价值倾向和意识形态色彩的“信息茧房”。信息异化阻碍青年自由全面发展。算法推荐“信息茧房”使青年独立思考与创新精神受到销蚀、价值观念受到错误思潮的误导，传统的思想政治教育模式、主流意识形态的凝聚和引领能力受到冲击。要优化思想政治教育，筑牢青年思想防线；构筑监管体系，强化源头治理；驾驭算法推荐技术，重塑其价值遵循。 {ISBN/ISSN}: 1009-2080 {Notes}: 37-1494/G4 {URL}: https://kns.cnki.net/kcms2/article/abstract?v=wYvQo-F_OPZuPncKtHhzcVUtoPEZMq_GbjEdtlb-CbYDw-W8q9b7gjFnaj0Z2mQBq3q9mlCl4XaViG0Kvme167kww0OGYGEr7GExRgmpuTnY1KGvoupiS5HC1A3q-NKjjXh2S0o4A0d09-mokvOW_WkwOXuw11U51poWaZofXZG8AyRVQcUtALHK-AoQfxO4&uniplatform=NZKPT&language=CHS {Database Provider}: CNKI"
