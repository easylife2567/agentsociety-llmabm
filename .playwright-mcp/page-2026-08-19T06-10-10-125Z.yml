      - list [ref=e112]:
        - listitem [ref=e113]: "{Reference Type}: Journal Article {Title}: 数字文物本体论 {Author}: 张小朋 {Author Address}: 南京博物院; {Journal}: 信息与管理研究 {Pages}: 1-25 {Keywords}: 数字文物;本体论;依赖型生命形态;生态链;活态考古;双轨遗存 {Abstract}: 数字文物本体论要解决的不是“数字文物有哪些”，而是“数字文物是什么、凭什么是、边界在哪、与其他存在物如何区分”。本文构建四类本体逐层递进、相互支撑的数字文物本体框架：通用本体，从“物质前置”到“逻辑先在”的本体论转向出发，论证数字文物的依赖型生命形态、双轨遗存的辩证统一、功能性死亡与语义死亡、同一性与原真性；领域本体，面向文博行业的双轨分类体系、生态链层级结构、五级定级的价值本体与活态考古方法论；应用本体，对收藏登录、策展范式、保存保护与GLAM机构重构的业务本体化；表示本体，从哲学本体到可计算本体的形式化路径。四类本体形成“理论—行业—实践—技术”四位一体框架，既保障概念统一性，又兼顾业务适配性与技术可实现性，为信息文明时代的博物馆学奠定本体论基石。 {ISBN/ISSN}: 2096-2827 {Notes}: 31-2118/G2 {URL}: https://link.cnki.net/urlid/31.2118.G2.20260812.1618.002 {Database Provider}: CNKI"
        - listitem [ref=e114]: "{Reference Type}: Journal Article {Title}: 《民法典》视域下数字遗产继承的现实困境与制度完善 {Author}: 余扬 {Author Address}: 武汉学院; {Journal}: 法制博览 {Year}: 2026 {Volume}: {Issue}: 21 {Pages}: 40-42 {Keywords}: 《民法典》;数字遗产;遗产继承;网络平台;二元划分;人格利益;财产权 {Abstract}: 数字时代各类网络账号、数字资产大量涌现，数字遗产继承纠纷频发。《民法典》继承编对遗产范围采取了概括式界定，认可数字遗产可继承，但未针对其人格与财产双重属性细化规则，致使在立法供给、司法适用和实务操作层面均出现不少难题。本文以数字遗产继承为研究对象，采用规范分析法，划分财产性、人格性数字遗产边界，梳理当前继承实践中的现实困境，并从立法完善、司法统一、实务规范三个维度构建完善路径。研究表明，需分类规制数字遗产、统一裁判标准、明确平台法定协助义务。研究成果可完善民事继承体系，助力数字社会法治化治理。 {ISBN/ISSN}: 2095-4379 {Notes}: 14-1188/D {URL}: https://kns.cnki.net/kcms2/article/abstract?v=wYvQo-F_OPZlfQnPAHNRXVndg2KCMuOyAK88zL6zuUs-ubHlYb6At6f6-aGaCIPxfZW2A2373JFsGd4N-s5c6FuiLSFslgdlij_BzUufc1akkPmExADOpNWar72kJey1TXm6Hc95zKfb7mHTtl5KJMHxfGq0014q2XqHa8a0aBGD47tEHQ9uz-9Ql-EMJkIf&uniplatform=NZKPT&language=CHS {Database Provider}: CNKI"
        - listitem [ref=e115]: "{Reference Type}: Journal Article {Title}: 法国档案事业战略中数字遗产保存规划的内容、特点及启示 {Author}: 张若为; 高锦 {Author Address}: 中国船舶集团有限公司第七〇五研究所; {Journal}: 档案学刊 {Year}: 2026 {Volume}: {Issue}: 4 {Pages}: 26-36 {Keywords}: 数字遗产;数字遗产保存;法国档案事业规划;档案事业规划 {Abstract}: 本文基于文本分析法，对法国三项档案事业现代化战略中数字遗产保存的相关规划进行梳理和归纳，提炼出法国档案事业战略中数字遗产保存规划存在技术驱动、规范先行、多元协作及国际合作的突出特点。文章结合我国实际情况，提出档案主管部门可从建立技术平台、完善管理体系、倡导多元协作及加强国际合作四方面完善我国数字遗产保存的战略引导，以期为我国数字遗产保存规划制定和未来的行动实施提供借鉴。 {ISBN/ISSN}: 2097-1664 {Notes}: 43-1557/G2 {URL}: https://kns.cnki.net/kcms2/article/abstract?v=wYvQo-F_OPb2N4-qj5W8x7zhzS4DnKz9OZB4vvXBxmGV-VFKqkqJQ8c9wJu-zaxXxPLIreitwDye60svgiJqQorGUIhdxebvACbCYRKLsn69ZlLRAoeoSnzJ3pa9jut_0pZq90h9KTeR8Wzfnt6PPw8JcChrBUfgPp_f-f3IRzXuUAFXMUnDhcWYfZ4BuBPc&uniplatform=NZKPT&language=CHS {Database Provider}: CNKI"
        - listitem [ref=e116]: "{Reference Type}: Journal Article {Title}: 文化遗产的数字觉醒:iSchools院校文化遗产信息学课程的实践与启示 {Author}: 李立睿; 王丽莎; 张博睿; 王文宣 {Author Address}: 西南大学出版研究院;西南大学教育学部;奥克兰大学;奥克兰大学人文与教育学院;南京大学数据管理创新研究中心;上海大学文化遗产与信息管理学院; {Journal}: 图书馆学研究 {Year}: 2026 {Volume}: {Issue}: 7 {Pages}: 25-36 {Keywords}: 文化遗产信息学;文化信息资源;文化遗产;数字化;iSchools {Abstract}: 为推动国家文化数字化战略实施与文化遗产数智化发展,系统梳理国外iSchools联盟文化遗产信息学课程的建设现状,深入剖析其发展特征、经验模式与实践路径,具有重要的理论价值与现实意义。本文采用文献研究、网络调研与案例分析相结合的方法,对国外114所iSchools院校开展系统性调研,最终筛选出13所开设文化遗产信息学课程的院校,并从学科与教育阶段分布、课程属性、教学目标、课程内容与教学模式五大核心维度,开展深度剖析与系统研究。未来,我国可聚焦构建数智化课程新体系、健全人才培养新模式、共筑数字责任新标准、探索数字文明新格局四大核心方向,以此推动新时代信息资源管理教育的转型升级,赋能文化遗产新质人才的培育。 {ISBN/ISSN}: 1001-0424 {Notes}: 22-1052/G2 {URL}: https://link.cnki.net/doi/10.15941/j.cnki.issn1001-0424.2026.07.011 {DOI}: 10.15941/j.cnki.issn1001-0424.2026.07.011 {Database Provider}: CNKI"
        - listitem [ref=e117]: "{Reference Type}: Journal Article {Title}: 数字文物保存与保护研究 {Author}: 张小朋 {Author Address}: 南京博物院; {Journal}: 信息与管理研究 {Pages}: 1-26 {Keywords}: 数字文物;依赖型生命形态;保存即保护;活态保存 {Abstract}: 数字文物作为信息文明的原生遗存，其保存与保护面临着与传统物质文化遗产根本不同的挑战。传统文物保护以材质分析、病害识别、物理化学干预为核心，遵循最小干预、可逆、预防三大原则；而数字文物作为“依赖型生命形态”，其病害不来自物质本体的内在衰变，而源于保存环境、载体与生态链的外部断裂。本文立足活态考古方法论，延续数字文物双轨分类体系，提出“保存即保护”这一核心命题，论证其适用范围仅限于无形范式遗存和软件类有形产品；进而构建以生态链保存为核心的双轨保护框架，给出仿真、迁移、封装、Docker容器化等具体保存方法；同时呼应有形产品实物硬件类遗存的保护需求，提出“传统保护+生态链保护”并轨策略，唯有将数字文物置于动态的生态链中，方能延续其作为活态遗产的文化价值与历史意义。 {ISBN/ISSN}: 2096-2827 {Notes}: 31-2118/G2 {URL}: https://link.cnki.net/urlid/31.2118.G2.20260717.1543.002 {Database Provider}: CNKI"
        - listitem [ref=e118]: "{Reference Type}: Journal Article {Title}: 本雅明“灵光”视域下的壁画数字化在场性研究 {Author}: 苏宇 {Author Address}: 韩国江原国立大学全球融合系; {Journal}: 东南传播 {Year}: 2026 {Volume}: {Issue}: 7 {Pages}: 124-128 {Keywords}: 本雅明;灵光;壁画数字化;数字文化遗产;数字在场 {Abstract}: 壁画数字化正在从图像留存手段转为保护研究和公共传播的重要条件。围绕这一变化，本雅明“灵光”理论提示原作在时间和空间中的独特性，《奈良真实性文件》和《伦敦宪章》进一步要求数字图像说明材料来源、空间位置、解释依据和处理过程。数字敦煌资源库和数字藏经洞的实践显示，数字在场通过证据链、定位信息和解释路径建立可信观看关系，使观众能够在屏幕中重新接近壁画原作及其知识关系。 {ISBN/ISSN}: 1672-9579 {Notes}: 35-1274/J {URL}: https://link.cnki.net/doi/10.13556/j.cnki.dncb.cn35-1274/j.2026.07.017 {DOI}: 10.13556/j.cnki.dncb.cn35-1274/j.2026.07.017 {Database Provider}: CNKI"
        - listitem [ref=e119]: "{Reference Type}: Journal Article {Title}: 数字遗产分类继承的困境突破与规则细化 {Author}: 郑远民; 张少晴 {Author Address}: 湖南师范大学法学院; {Journal}: 重庆交通大学学报(社会科学版) {Pages}: 1-13 {Keywords}: 数字遗产;继承制度;隐私保护;平台责任;价值评估 {Abstract}: 数字化转型的深度推进使数字遗产成为重要的遗产形态，继承领域面临传统规则难以适配的全新命题。数字遗产兼具财产性与人格性的双重属性，进一步加剧了规则适用矛盾，司法实践中裁判标准不一、平台协议霸权等问题随之凸显。基于数字遗产利益属性特征，构建财产型、人格型、混合型三元分类框架，分析数字遗产在继承主体认定、范围界定、价值评估和利益平衡方面的核心矛盾。通过明确继承主体与客体的类型化规则，强化平台法定协助与安全保障义务，并构建价值评估体系、隐私分层保护和权能分层处置模式，实现继承权、人格尊严与第三方隐私的动态平衡，为数字遗产继承提供制度支撑。 {ISBN/ISSN}: 1674-0297 {Notes}: 50-1191/C {URL}: https://link.cnki.net/urlid/50.1191.C.20260716.1306.002 {Database Provider}: CNKI"
        - listitem [ref=e120]: "{Reference Type}: Journal Article {Title}: 数字经济下老年人财产管理的法治路径 {Author}: 王梦滢 {Author Address}: 长春财经学院; {Journal}: 上海商业 {Year}: 2026 {Volume}: {Issue}: 7 {Pages}: 67-69 {Keywords}: 数字经济;老年人;财产管理;法治保障;数字鸿沟 {Abstract}: 数字技术重塑了公众的财产管理方式，但在人口老龄化背景下，老年群体面临着严峻的“数字鸿沟”。操作技能匮乏与风险识别能力不足，使他们在网络支付及数字资产传承中处于弱势地位，极易遭受诈骗与侵权。现行法律在数字场景下的保护存在滞后性，立法供给与监管合力均显不足。本文立足现实，剖析老年人财产管理困境，从立法完善、行政监管、司法服务及社会协同四个维度，探索法治保障路径，以期为老年人财产安全提供坚实的制度支撑。 {ISBN/ISSN}: 1007-2845 {Notes}: 31-1567/F {URL}: https://kns.cnki.net/kcms2/article/abstract?v=wYvQo-F_OPa9hP-DsZzXN-zhD_cwPVMOhNgrpV2mFi7CFkTcmlZ39Fm6QE3oWR5zxakEazc7tXF2v79RMoxQbYkPWCEQo-GhdxnvlGN68UT1xF4YskUV3x7d5i9jkFVRGJhTY0GwYJGBWNPnN7VNs6saDkg-9Uih9gMO0qaoTo7oEFLqWa9WlfQi6eY1xUxJ&uniplatform=NZKPT&language=CHS {Database Provider}: CNKI"
        - listitem [ref=e121]: "{Reference Type}: Journal Article {Title}: AI影像复活技术的伦理风险及其应对 {Author}: 郭佳楠 {Author Address}: 亚洲理工学院发展与可持续性学院;中国人民大学数字人文研究中心; {Journal}: 沈阳工程学院学报(社会科学版) {Year}: 2026 {Volume}: 22 {Issue}: 3 {Pages}: 38-49 {Keywords}: AI影像复活;伦理风险;数字遗产;用户认知;技术向善;风险治理 {Abstract}: 随着人工智能技术的快速发展，AI影像复活技术逐渐成为数字纪念、文化传承和情感慰藉的重要工具。该技术通过对逝者影像、语音及行为特征的数字化再现，实现高度拟真和互动化的复活体验。AI影像复活技术在应用过程的三个阶段分别产生逝者数字遗产使用失序的现实困境、AI模型设计限度的边界约束困境及用户技术依恋的情感困境等伦理风险。同时，从技术局限性、法律与制度滞后、用户认知及文化认知偏差等方面入手，系统分析了AI影像复活技术的伦理风险样态的成因。为此，鉴于伦理风险在AI影像复活技术发展的不同阶段呈现出不同的特点与影响深度，应分阶段从“复活”前的筹备阶段、“复活”中的设计阶段、“复活”后的应用阶段来制定相应的伦理规约路径，以期实现AI影像复活技术的安全、可控和可持续发展，为相关技术应用提供理论与实践参考。 {ISBN/ISSN}: 1672-9617 {Notes}: 21-1518/C {URL}: https://link.cnki.net/doi/10.13888/j.cnki.jsie(ss).2026.03.005 {DOI}: 10.13888/j.cnki.jsie(ss).2026.03.005 {Database Provider}: CNKI"
        - listitem [ref=e122]: "{Reference Type}: Journal Article {Title}: 档案领域的国际合作与交流：新趋势、新议题与新路径 {Author}: 张玲艳 {Author Address}: 嵩山少林武术职业学院; {Journal}: 山西档案 {Year}: 2026 {Volume}: {Issue}: 7 {Pages}: 57-59 {Keywords}: 档案跨国协作;数字转型;全球档案治理;跨境数据;数字记忆 {Abstract}: 探寻数字时代档案跨国协作的演进逻辑，为破解全球档案治理体系重构过程中的现实困境提供学理参考。伴随全球化与新兴信息技术的深度交融，档案资源的存贮与流通形态发生根本性改变，明晰跨国协作的内在规律对构建人类数字记忆共同体具有战略价值。系统梳理国际档案界在协作形态上的演变轨迹，深入解剖跨境数据流转、数字遗产长期保存及伦理规范重构等触及行业底层的核心议题。现代档案国际协作正脱离实体互换模式，全面转向基于可信网络环境的数字共治，国际档案界需在法律框架协同、技术生态重构与复合人才培育三个维度凝聚共识，从而构筑支撑跨国档案互通的新型保障体系。 {ISBN/ISSN}: 1005-9652 {Notes}: 14-1162/G2 {URL}: https://kns.cnki.net/kcms2/article/abstract?v=wYvQo-F_OPZfnKGvLp2e7OL17LIqagB-HpcgkXFPZ9grKjOsHoa_ZDm4lrYFpTBYTX9zUYHxMpozo0weyIr-zqq-eh4rKPoekybXHF00zmTqylTXf0bWyGenJklpffqFJQXjEvYtjeF2lkziLiym31oHFxUKeEvhX8ZqA2aRllZik4LshLHmxjsGOmHzWXKe&uniplatform=NZKPT&language=CHS {Database Provider}: CNKI"
        - listitem [ref=e123]: "{Reference Type}: Journal Article {Title}: 数字文化遗产治理视域下传统地方戏曲数据库的著作权保护 {Author}: 左梓钰 {Author Address}: 四川师范大学法学院;四川师范大学互联网法治研究中心; {Journal}: 数字人文研究 {Year}: 2026 {Volume}: 6 {Issue}: 2 {Pages}: 116-128 {Keywords}: 传统地方戏曲;著作权;数据汇编(数据库);民间文学艺术;惠益分享;数字文化遗产 {Abstract}: 传统地方戏曲是集体智慧的结晶，因而具有民间文学艺术的族群性、传承性和文化性特征。著作权法中作为戏剧作品示例之一的地方戏应解释为已满足法定作品构成要件的地方戏曲。地方戏曲数据汇编(数据库)作为数字文化遗产的代表之一，是关于构成作品或不构成作品的地方戏曲数据的集合，其受著作权保护的前提是构成汇编作品。基于地方戏曲数据库亦具有民间文学艺术的性质，所以地方戏曲数据库的使用可能引发权属、利用及获益分配的争议。为了完善地方戏曲数据库的著作权保护并抑制数据库对著作权公有领域的侵蚀，宜细化数据库的权属和利用规则，构建关于数据库的集体管理制度和惠益分享机制。以地方戏曲数据库的著作权保护为切口，冀望为更广泛的数字文化遗产善治提供法律基石。 {ISBN/ISSN}: 2096-9155 {Notes}: 10-1716/C {URL}: https://kns.cnki.net/kcms2/article/abstract?v=wYvQo-F_OPZIbV5PN9ovkNBpFUkOZ0UpbWGbY8U2WnNoL8LG5ksLsCw0HkmDVHF6Sl0ouBsSC9VVKeZ_eOz228TKYmG8csxQZYrKYSqSmPDpsJLpZBeXPr1WVFoP4blbMd12oMb7W8IRACajwPBt7mra1WRpFpuQKtH8M5Qbot_iBNuRq21-0Mw04uRCs38f&uniplatform=NZKPT&language=CHS {Database Provider}: CNKI"
        - listitem [ref=e124]: "{Reference Type}: Journal Article {Title}: 数字文物策展范式研究 {Author}: 张小朋 {Author Address}: 南京博物院; {Journal}: 信息与管理研究 {Pages}: 1-20 {Keywords}: 数字文物;策展范式;活态考古;信息文明 {Abstract}: 数字文物定级体系的建立，使信息文明遗存进入博物馆典藏序列成为可能，但传统策展范式以物质载体、稀缺价值、静态物证为核心的知识生产逻辑，难以适配数字文物“无形范式优先、可复制、活态运行、节点驱动”的本质特征。本文立足活态考古与信息文明阐释者定位，从策展思想层与展览形态层的理论区分出发，系统论证传统策展范式对数字文物的四重失效；进而构建数字文物策展的理论基础、核心原则与实践模型，提出逻辑可视化、范式叙事和运行性展示三大策展范式，以及模拟器策展法、原理互动策展法、范式演进链叙事法、交互式逻辑体验法和数字孪生策展法五大操作方法，为信息时代的记忆与传播提供系统性策展方案，回应数字文物在博物馆展览中面临的阐释困境，推动博物馆发展成为信息文明的阐释者。 {ISBN/ISSN}: 2096-2827 {Notes}: 31-2118/G2 {URL}: https://link.cnki.net/urlid/31.2118.G2.20260623.1436.002 {Database Provider}: CNKI"
        - listitem [ref=e125]: "{Reference Type}: Journal Article {Title}: 人机协同跨学科教育智能体设计与教学模式研究——基于分布式认知理论 {Author}: 张绍莹; 吴斓; 董艳; 高远荣 {Author Address}: 南京信息工程大学教师教育学院;北京师范大学教育学部;南京市扬子第一中学; {Journal}: 数字教育 {Year}: 2026 {Volume}: 12 {Issue}: 3 {Pages}: 70-77 {Keywords}: 分布式认知理论;跨学科主题学习;教育智能体;人机协同 {Abstract}: 随着跨学科主题学习在课程改革中的重要性日益凸显，其实施过程也面临着资源整合困难、师生角色失衡及个性化支持不足等现状。该研究系统阐释了分布式认知理论对教育智能体作为“认知伙伴”的定位启示，提出了包含角色定位、设计原则与系统架构的跨学科教育智能体设计框架，并基于此进一步构建人机协同跨学科教学模式，以“云上家园：构建数字遗产保护站”为例，为破解跨学科教学现实困境，在跨学科教学中使用教育智能体优化认知分布提供了理论依据与实践路径。 {ISBN/ISSN}: 2096-0069 {Notes}: 41-1435/G4 {URL}: https://kns.cnki.net/kcms2/article/abstract?v=wYvQo-F_OPZF6ZFF4DNEYcw717ZGh0w-mdzB9FeeWPwAOKY82bV9_dQn-9wTH5_2koAM4-PytP24yKEYtolQGhL5Qs8_LppD_jX_sP0if-SAwynZ8CkIeYy_J3lxlk1uXE4n_OP1dNqfub1Z49PkjU2dJVuChAdpoMviwrXVpOokC7197bR_Syhs4rNynJCB&uniplatform=NZKPT&language=CHS {Database Provider}: CNKI"
        - listitem [ref=e126]: "{Reference Type}: Journal Article {Title}: 江苏运河文化遗产数字化活态传承策略 {Author}: 光晓霞; 陈菲; 王暑帆 {Author Address}: 大运河遗产保护管理办公室;扬州工业职业技术学院,基础科学部;扬州市文物局文物保护处; {Journal}: 沧州师范学院学报 {Year}: 2026 {Volume}: 42 {Issue}: 2 {Pages}: 14-19 {Keywords}: 大运河;文化遗产;数字化;遗产活态传承;江苏省 {Abstract}: 大运河江苏段文化遗产数量多、类型全、分布密、保存完好，具有重要的历史文化价值、经济产业价值和生态廊道价值。然而，在现代化进程中，部分运河文化遗产面临着保护与开发的矛盾，传统的保护方式已难以满足活态传承的需求。结合数字遗产和数字文化遗产理论，探讨了数字化技术在大运河文化遗产保护中的运用成效。针对目前面临的相关挑战，提出推进多部门协作、搭建数字阐释平台、强化受众需求分析、实现技术与文化融合、活化非遗数字资源等建议，为构建“数字运河”数据资源库、有效探索大运河数字化保护与利用模式提供参考。 {ISBN/ISSN}: 2095-2910 {Notes}: 13-1408/G4 {URL}: https://link.cnki.net/doi/10.13834/j.cnki.czsfxyxb.2026.02.005 {DOI}: 10.13834/j.cnki.czsfxyxb.2026.02.005 {Database Provider}: CNKI"
        - listitem [ref=e127]: "{Reference Type}: Journal Article {Title}: 数字复活的伦理风险谱系与治理路径 {Author}: 张人天 {Author Address}: 北京大学马克思主义学院;意大利博洛尼亚大学政治与社会科学学院; {Journal}: 科学学研究 {Pages}: 1-14 {Keywords}: 数字复活;伦理风险;死亡;治理路径 {Abstract}: 数字复活是基于逝者的历史数据进行人物表征建模，通过生成式算法构成具有可交流能力的数字拟像。当技术持续推进，其核心挑战早已从技术可行性转向了伦理困境。在人格伦理上，数字人格的构建模糊了人格的本质，其不当使用可能侵犯逝者的尊严。在死亡伦理上，数字复活模糊了生与死的界限，挑战了传统死亡观念，存在进一步加剧“死亡不平等”的风险，并对死亡文化和哀悼仪式产生冲击。在情感伦理上，数字复活为生者提供情感慰藉，但也可能导致情感依赖甚至“第二次失去”的风险；此外，技术的过度拟人化可能引发“恐怖谷效应”与科技迷信。在科技伦理上，数字复活面临数据权属、隐私保护与死者尊严的重新定义等问题。面对这些挑战，我们必须建立多维度的伦理规范体系：以尊严与自主为核心明确伦理底线；制度层面主张法律规制与行业自律双轨并进；治理支点聚焦于平台责任，强调将伦理设计与风险管理前置嵌入技术流程；公共维度则重视教育引导、社会公平与文化适应。 {ISBN/ISSN}: 1003-2053 {Notes}: 11-1805/G3 {URL}: https://link.cnki.net/doi/10.16192/j.cnki.1003-2053.20260610.002 {DOI}: 10.16192/j.cnki.1003-2053.20260610.002 {Database Provider}: CNKI"
        - listitem [ref=e128]: "{Reference Type}: Journal Article {Title}: 信息文明的记忆：数字文物定级标准理论建构与实践路径 {Author}: 张小朋 {Author Address}: 南京博物院; {Journal}: 信息与管理研究 {Pages}: 1-16 {Keywords}: 数字文物;定级标准;信息文明;博物馆藏品体系;活态考古 {Abstract}: 信息产品正加速进入历史遗产序列，但传统博物馆以有形实物、物质载体、年代久远、稀缺程度为核心的定级体系，面对可无限复制、无实体形态、以思想范式为核心价值的信息文明遗存已显失效。本文从活态考古视角出发，将数字文物划分为“无形概念范式遗存”与“有形产品实物遗存”两大序列，构建统一的五级定级体系（一至三级珍贵藏品、一般藏品、参考藏品）。以冯·诺依曼架构、ENIAC、TCP/IP协议、UNIX初代版本、iPhone初代等为典型案例，论证范式开创性、历史里程碑意义、不可替代性等新定级标尺的理论合法性。该标准是世界范围内罕见的系统性探索，为博物馆藏品体系从工业文明向信息文明拓展提供重要理论支撑，对藏品体系拓展、展览叙事更新及数字遗产保护政策制定具有现实意义。 {ISBN/ISSN}: 2096-2827 {Notes}: 31-2118/G2 {URL}: https://link.cnki.net/urlid/31.2118.G2.20260529.1505.002 {Database Provider}: CNKI"
        - listitem [ref=e129]: "{Reference Type}: Journal Article {Title}: 基于严肃游戏的数字遗产教育设计研究 {Author}: 万青; 高鹏; 王嘉怡 {Author Address}: 杭州科技职业技术学院; {Journal}: 佳木斯职业学院学报 {Year}: 2026 {Volume}: 42 {Issue}: 5 {Pages}: 215-217 {Keywords}: 严肃游戏;数字遗产教育;设计框架;实施策略 {Abstract}: 本研究构建了一套围绕严肃游戏的数字遗产教育设计框架，据此制定了具体实施策略，该框架融合了游戏化理念以及智慧城市理念，打造出一个互动性颇为突出、沉浸感较强的虚拟学习平台，包含四个核心模块，即虚拟沉浸式体验平台、游戏化学习任务、数字藏品教育应用以及数据驱动反馈系统。借助虚拟体验与数字藏品，公众对历史和文化的理解可得到深化，数据反馈机制可提升学习效果，严肃游戏与数字技术的结合为数字遗产教育提供了广阔的应用前景，也为遗产资源的保护与传播开创了创新模式。 {ISBN/ISSN}: 2095-9052 {Notes}: 23-1590/G4 {URL}: https://kns.cnki.net/kcms2/article/abstract?v=wYvQo-F_OPZRmTAG-0obo8ZQpzxfPeeyB4ml4RuDqI6TdREzgg5YaraLDxDnT9mlnZP7NfxHE6WLwbgqv5-FdTTf3HFb567wkuxK_io4PFacTe4a19o7Ijwg5sclBcqhvJvUyKpdw6UFjstT77Lmg1hTmj8dpwb3NTffQJnLgAj4ueJP0sVHFa4nx7_y7akz&uniplatform=NZKPT&language=CHS {Database Provider}: CNKI"
        - listitem [ref=e130]: "{Reference Type}: Journal Article {Title}: 数字遗产管理制度的逻辑证成与构建路径 {Author}: 殷敏 {Author Address}: 上海政法学院; {Journal}: 上海师范大学学报(哲学社会科学版) {Year}: 2026 {Volume}: 55 {Issue}: 3 {Pages}: 88-102 {Keywords}: 数字遗产;虚拟财产;遗产管理;国际合作;服务协议 {Abstract}: 作为继承法上的一项重要制度，遗产管理制度在遗产保管、遗产清算以及保护债权人利益等方面发挥着重要作用。随着科技对社会生活的重塑，遗产呈现出“遗产数字化”以及“数字产品遗产化”两种趋势，进而演变成数字遗产。数字遗产因构成要素的特殊性、参与主体的多样性、数据隐私的重要性等，导致传统遗产管理制度在数字遗产管理领域面临阻碍。应运用法律技术手段对现有制度进行解构，通过法律解释等方式克服其中的障碍，推动国际合作，并借鉴立法先行的国家和地区的相关立法经验。在平台层面，应出台统一的行业自律条款，并修改服务协议。在数据主权博弈的背景下，应加强对贸易、投资目的地地缘政治风险和社会环境风险的监测，积极开展事后救济预案的制定工作。此外，还应重视并加强对数字遗产中有关逝者隐私及知识产权的保护。 {ISBN/ISSN}: 1004-8634 {Notes}: 31-1120/C {URL}: https://link.cnki.net/doi/10.13852/J.CNKI.JSHNU.2026.03.008 {DOI}: 10.13852/J.CNKI.JSHNU.2026.03.008 {Database Provider}: CNKI"
        - listitem [ref=e131]: "{Reference Type}: Journal Article {Title}: 社交账号继承的现实困境、治理逻辑与规则完善 {Author}: 林艳琴; 温苑晴 {Author Address}: 北京师范大学; {Journal}: 云南大学学报(社会科学版) {Year}: 2026 {Volume}: 25 {Issue}: 3 {Pages}: 91-103 {Keywords}: 社交账号继承;格式条款;数字人格;用户信息自决 {Abstract}: 我国法律虽明确保护网络虚拟财产，但对社交账号如何继承鲜有规定。样本分析表明，社交平台普遍采用格式条款的方式单方限制社交账号的继承，用户同意权形式化。实践中，用户近亲属要求继承账号的诉求日益普遍。从规范层面考量，承载人格尊严、情感记忆与财产利益的社交账号，符合我国遗产继承规则中“个人合法财产”之法定要件。社交平台以保护信息安全、维护第三人隐私等治理需求为名的理由，均不构成其通过格式条款排除继承权益的合法正当依据。为破解社交账号继承难题，应在明确社交账号具有可继承性的基础上，完善用户协议中继承条款制定的多方参与及审查机制；规范社交账号继承方案，构建以用户信息自决为核心的预先指示及默示同意规则；探索建立第三方数据信托模式，推动对社交账号继承的专业、可信管理。 {ISBN/ISSN}: 1671-7511 {Notes}: 53-1176/C {URL}: https://link.cnki.net/doi/10.19833/j.cnki.jyu.20260520.013 {DOI}: 10.19833/j.cnki.jyu.20260520.013 {Database Provider}: CNKI"
        - listitem [ref=e132]: "{Reference Type}: Journal Article {Title}: 数字永生：赛博空间中的记忆留存与伦理思辨 {Author}: 张若云; 岳路鹏 {Author Address}: 电子科技大学马克思主义学院;四川大学文学与新闻学院;电子科技大学大学生文化素质教育中心; {Journal}: 新闻爱好者 {Year}: 2026 {Volume}: {Issue}: 5 {Pages}: 53-56 {Keywords}: 数字永生;记忆媒介化;平台型媒体;新闻伦理;数字遗产 {Abstract}: 随着数字技术深度介入记忆传播领域，数字永生成为新兴现象，它是指将逝者的文本、图像、音视频及行为日志等形成多模态数字痕迹，经语言模拟、语义建模等技术处理生成的可模拟逝者人格的一种数字化形态。区别于静态的“数字遗产”管理或仅作归档的“算法记忆”，数字永生的核心在于借助算法持续激活逝者数据，模拟逝者人格的人机交互，实现数字永生。研究发现，数字记忆生产依赖新闻化采集与技术编辑协同，传播呈现从个性化推送到社交扩散再到仪式消费链式结构。未来需通过完善立法、建立行业伦理审查、优化技术规范、坚守尊重记忆、维护尊严本位，引导其健康发展。 {ISBN/ISSN}: 1003-1286 {Notes}: 41-1025/G2 {URL}: https://link.cnki.net/doi/10.16017/j.cnki.xwahz.2026.05.005 {DOI}: 10.16017/j.cnki.xwahz.2026.05.005 {Database Provider}: CNKI"
