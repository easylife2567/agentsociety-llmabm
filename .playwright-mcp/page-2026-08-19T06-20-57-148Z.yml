            - text: ",NCM)的全固态锂电池（ASSLIBs），因其固态电解质结构带来的高安全性以及高理论比容量，成为目前最具发展前景的锂电池技术。然而该固态锂电池体系的发展面临多重挑战：高镍正极固有的阳离子混排、颗粒内部微裂纹、气体与过渡金属溶出等缺陷，其面向固态电池应用新增的包含内部孔隙导致的离子传输阻塞、脱嵌引发的颗粒体积收缩、接触失效的结构劣化以及..."
