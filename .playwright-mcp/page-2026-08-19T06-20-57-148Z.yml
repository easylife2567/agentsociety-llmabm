          - paragraph [ref=f13e414]: 摘要：无人机实时摄影测量是一种快速发展且具有广泛应用前景的高新技术。为更好地理解现阶段无人机实时摄影测量技术的应用现状与未来的发展趋势，通过文献综述的方法，系统地梳理了无人机摄影测量技术的基本原理；从飞行平台与控制、航线规划与导航、影像处理与提取和三维建模与应用四个方面评述了无人机摄影测量的关键技术；从城市规划与建设、灾害监测与评估、文物保护与研究和土地利用与管理四个领域论述了无人机摄影测量技术的应用现...
