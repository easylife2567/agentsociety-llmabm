      - list [ref=e112]:
        - listitem [ref=e113]: "{Reference Type}: Journal Article {Title}: 算法视域下媒介伦理失范的表现与规制 {Author}: 葛思坤 {Author Address}: 中共广州市委党校哲学与文化教研部; {Journal}: 青年记者 {Year}: 2020 {Volume}: {Issue}: 26 {Pages}: 21-22 {Abstract}: <正>当前,算法推荐已成为各大新媒体平台惯用的\"推送\"手段,算法在了解用户需求、提升受众阅读体验、实现精准投放方面有着得天独厚的优势。但与此同时,媒介对\"算法\"的过度应用也带来了一系列伦理失范问题。算法视域下媒介伦理失范的表现1.\"信息茧房\"出现后,用户的认知偏差加剧在当前传播环境中,用户所浏览的信息都是由算法决定的,算法推荐所导致的\"信息茧房\"现象愈加严重,用户对于客观现实的认识也愈加偏离。首先,在新媒体时代,真实信息通常被淹没在冗杂信息之中难以寻觅。受民众猎奇心理的影响,那些低俗、庸俗、具有极强感官刺激性的信息反而能够获得大范围散播。同时,一些自媒体或网络平台会特意选取一些重感官、 {ISBN/ISSN}: 1002-2759 {Notes}: 37-1003/G2 {URL}: https://link.cnki.net/doi/10.15997/j.cnki.qnjz.2020.26.011 {DOI}: 10.15997/j.cnki.qnjz.2020.26.011 {Database Provider}: CNKI"
        - listitem [ref=e114]: "{Reference Type}: Journal Article {Title}: 算法的法律规制研究 {Author}: 张志刚; 施丽芳 {Author Address}: 浙江农林大学图书馆;浙江省文成县人力资源和社会保障局劳动保障监察大队; {Journal}: 上海商业 {Year}: 2020 {Volume}: {Issue}: 9 {Pages}: 123-126 {Keywords}: 算法推荐;算法黑箱;算法歧视;法律规制 {Abstract}: 人工智能时代,算法已经愈来愈影响人类的生产和生活。算法性能的不断提升及其应用的普及,促使人类社会运行效率被大大提高的同时,也带来了一系列的问题,通过加强完善关于算法的立法、强化算法监管以及算法素养培育,以达到有效规制算法的目的,从而使算法更好地服务于人类。 {ISBN/ISSN}: 1007-2845 {Notes}: 31-1567/F {URL}: https://kns.cnki.net/kcms2/article/abstract?v=wYvQo-F_OPYfPNvBDidKRSmENGOXPDZPYeMwibNME3GCFCu5Um9-1ryFBmJvhXiPeNnvytyMSMJyvEZOr2mBBnudk42PTOkTWmsqkn0l-C4zM-MO62kyOjYpquqEj8LsQDxXVbk5macoHk-Euf0caFgv1LYp8TTC4i_jqx6Ge1UPKvq8CqRMBzuo2iFk5WQl&uniplatform=NZKPT&language=CHS {Database Provider}: CNKI"
        - listitem [ref=e115]: "{Reference Type}: Journal Article {Title}: 织就信息茧房的人，或许就是你自己 {Author}: 杨鑫宇 {Journal}: 科学大观园 {Year}: 2020 {Volume}: {Issue}: 17 {Pages}: 62 {Abstract}: <正>只看到算法的影响,而忽略个体的主观能动性,既是对问题本质的误读,也是对个体责任的逃避。近段时间,与\"信息茧房\"有关的讨论,几乎是社交网络上最受大众关注的专业话题。事实上,当很多人兴致勃勃地谈论\"信息茧房\"时,他们并没有仔细思考是谁织就了\"信息茧房\",自己又身处怎样的信息环境之中。在与\"信息茧房\"相关的常见讨论中,最常被指责的对象,是最 {ISBN/ISSN}: 1003-1871 {Notes}: 11-1607/N {URL}: https://kns.cnki.net/kcms2/article/abstract?v=wYvQo-F_OPbtYsy-rI76mCjbRtv8TsBRMNEYT1csDQZHIo4TsmINJ0gBiWDJxBW6_uVy06l4l3ClxXIfpXT-kV_7OFmEbQJtYpte6fjuHeUDtZU8oEvvaRLryCKkBu7mkC8MIgLBW94ZPNHK8pRRvwTnU1WxGylH_MH6iusy9Rs_79FlVuJd4arSfvLJRCXA&uniplatform=NZKPT&language=CHS {Database Provider}: CNKI"
        - listitem [ref=e116]: "{Reference Type}: Journal Article {Title}: 自媒体传播对大众认知的消极影响及对策 {Author}: 蔡家胜; 王明蕾; 严海艳 {Author Address}: 安徽科技学院人文学院; {Journal}: 传媒论坛 {Year}: 2020 {Volume}: 3 {Issue}: 19 {Pages}: 19-20 {Keywords}: 自媒体;抖音;大众认知 {Abstract}: 随着信息时代的快速发展,自媒体凭借内容制作低成本、低门槛,内容丰富多样化,极大满足受众心理诉求等优势迅速占据大众市场,对大众的影响日益广泛。本文从自媒体的内容、表现形式以及推荐算法机制三个方面分析阐述自媒体传播对大众认知的消极影响,最后针对性地提出改善建议。 {ISBN/ISSN}: 2096-5079 {Notes}: 36-1348/G2 {URL}: https://kns.cnki.net/kcms2/article/abstract?v=wYvQo-F_OPb5-wYlGObztTXSJd4dqqRHDP0FGbmHzqCX8gTkNPeDH5wDePVwFoyR9qZMFz2NcyaLdtxDjdDQj6UtyP_Jn3Bgm7EtlYzo8KeFDZKZ8MAmwvpJfXiCU-HRFrdb6c4Fbd4YWQsvUSpfIkoMpdF05cuMb2T7WVDSF6sUAco6OCa1aQv14DEMcc5i&uniplatform=NZKPT&language=CHS {Database Provider}: CNKI"
        - listitem [ref=e117]: "{Reference Type}: Journal Article {Title}: 对“信息茧房”认知偏差的探究 {Author}: 高恺宁 {Author Address}: 青岛大学新闻与传播学院; {Journal}: 新闻研究导刊 {Year}: 2020 {Volume}: 11 {Issue}: 16 {Pages}: 69-70 {Keywords}: “信息茧房”;算法推荐;把关;技术 {Abstract}: 近年来,“信息茧房”受到越来越多的关注,成为学术界讨论的热点话题。对于“信息茧房”,人们普遍对其存在认知偏差。从来源上看,“信息茧房”并不是因技术产生的,而是在传统媒体时代就已经产生,新媒体时代尤其是算法的发展使“信息茧房”现象突显;从发展上看,技术是“信息茧房”的催化剂,但并不能让“信息茧房”愈演愈烈,因为技术会不断完善和弥补不足;从实质上看,人们如今对“信息茧房”的高度关注,究其原因是算法的不成熟和人的不合理利用。 {ISBN/ISSN}: 1674-8883 {Notes}: 50-1205/G2 {URL}: https://kns.cnki.net/kcms2/article/abstract?v=wYvQo-F_OPbyk5M_9RNlbZiY8trxaXBkUry8c0H2hmx8HVufJTZPE9AxM1Ymld8Wr9t8QOYV9tyb-aDzDmcE0XkcQA7IlRIpUm8HWD52OMqFA6ULN617pebuXilw8Af5mL9thOQFng9YvBLCNPu1UpXnCFZ2Nyf5DQELz53fKy3AJnx0lg-l12DW59vs60E7&uniplatform=NZKPT&language=CHS {Database Provider}: CNKI"
        - listitem [ref=e118]: "{Reference Type}: Journal Article {Title}: 侵蚀与消解：个性化推荐算法场域下网络意识形态话语权的危局 {Author}: 巫彬; 杜礼雪 {Author Address}: 成都理工大学马克思主义学院; {Journal}: 四川职业技术学院学报 {Year}: 2020 {Volume}: 30 {Issue}: 4 {Pages}: 1-7 {Keywords}: 推荐算法;个性化推荐;网络意识形态 {Abstract}: 信息化和数字化时代由计算机技术演进衍生的\"个性化推荐算法\",通过贴标签和用户画像等形式,来预测受众的喜好和兴趣,向用户推送感兴趣的内容,存在着如\"信息茧房\"、\"过滤气泡\"、\"技术异化\"和削弱\"把关人\"作用等诸多的弊端,正在一步步侵蚀网络主流意识形态话语权。个性化推荐算法场域下意识形态话语权的危局的应对应做到:推进算法治理,实现技术与主流价值的融合统一;建立健全网络综合治理体系和加强治理力度;各大互联网平台遵守网络传媒端的伦理规范;提升广大受众对于算法技术的认知水平与网络素养。 {ISBN/ISSN}: 1672-2094 {Notes}: 51-1645/Z {URL}: https://link.cnki.net/doi/10.13974/j.cnki.51-1645/z.2020.04.001 {DOI}: 10.13974/j.cnki.51-1645/z.2020.04.001 {Database Provider}: CNKI"
        - listitem [ref=e119]: "{Reference Type}: Journal Article {Title}: 算法推荐加剧了信息茧房风险? {Author}: 王芳 {Author Address}: 人民网舆情数据中心; {Journal}: 中国报业 {Year}: 2020 {Volume}: {Issue}: 15 {Pages}: 52 {Abstract}: <正>微信算法排序与信息茧房近日,微信公众号订阅推出新功能,其一改以往按照推送时间进行逆时排序,加入算法排序,即用户经常浏览的公众号推送会排列在前面,而浏览次数较低的公众号则会慢慢沉入列表尾端,甚至消失在用户视野中。从以往获得用户关注后,每更新一次便获得一次曝光,变成需要靠长期的优质经营才能获得用户曝光,这对于公众号运营方的压力不言而喻。算法排序在一定程度上可以激励创作者提高创作水平,使用户获取\"偏爱信息\"更加便捷。但也有人质疑,在算 {ISBN/ISSN}: 1671-0029 {Notes}: 11-4629/G2 {URL}: https://link.cnki.net/doi/10.13854/j.cnki.cni.2020.15.020 {DOI}: 10.13854/j.cnki.cni.2020.15.020 {Database Provider}: CNKI"
        - listitem [ref=e120]: "{Reference Type}: Journal Article {Title}: 注入主流价值导向的电影个性化推荐研究 {Author}: 孙宜; 宋卿 {Author Address}: 中国传媒大学; {Journal}: 现代电影技术 {Year}: 2020 {Volume}: {Issue}: 8 {Pages}: 38-41 {Keywords}: 用户画像;协同过滤算法;主流价值观;个性化推荐 {Abstract}: 互联网促进了文化产业飞速发展,电影个性化推荐作为电影搜索的补充,取得了较好的效果。个性化推荐在提高用户体验的同时,注入主流价值导向有助于网络环境向更健康的方向发展。一方面可以通过用户画像技术获取用户的电影内容偏好,并结合协同过滤算法为用户推荐可能感兴趣的电影;同时还应尝试从数据中分析用户的情绪与价值观,在推荐的召回环节和排序环节,有针对性地引入具有正向引导作用的电影内容。 {ISBN/ISSN}: 1673-3215 {Notes}: 11-5336/TB {URL}: https://kns.cnki.net/kcms2/article/abstract?v=wYvQo-F_OPYzJdQcnfcLmKMaP7K7iXg6iwbzE5ttVAjAcXtnTJ9rBcLFKh9_eI0ALqW5qdoQZvNCXsxKp11_QDrlbQD75f18ELXhBG0l3L8GEm_c1KykdBVgqvEJNfk0x6b03sdQCsSDXFcC8507oC1iTpuZyicmLeyyOlpDMWn1EsxyeDr8XvBVZ1YhFc0s&uniplatform=NZKPT&language=CHS {Database Provider}: CNKI"
        - listitem [ref=e121]: "{Reference Type}: Journal Article {Title}: “信息茧房”学术场域偏倚的合理性考察 {Author}: 丁汉青; 武沛颍 {Author Address}: 北京师范大学新闻传播学院; {Journal}: 新闻与传播研究 {Year}: 2020 {Volume}: 27 {Issue}: 7 {Pages}: 21-33+126 {Keywords}: 信息茧房;学术场域;偏倚 {Abstract}: 目前\"信息茧房\"学术场域表现出\"算法偏倚\"与\"理论偏倚\"两种倾向。前者指将\"信息茧房\"与算法推荐紧密关联,后者指将其视为理论而非假设。基于对\"信息茧房\"学术史的考察和学术场域内文献的分析可以发现,桑斯坦提出\"信息茧房\"时采用的是技术批判视角,算法为其批判的重点,因此\"算法偏倚\"具有合理性。另外,\"信息茧房\"效应以假说形式提出,且以验证\"信息茧房\"存在性为第一落点的已有研究在概念理解、操作性定义、推导逻辑、数据采集等方面多有缺陷,因此\"理论偏倚\"值得商榷。尊重\"信息茧房\"效应假说本意,并推动信息过滤技术批判研究学术场域重心适度向\"回音室\"、\"过滤气泡\"倾斜,是提高学术场域质量的关键。 {ISBN/ISSN}: 1005-2577 {Notes}: 11-3320/G2 {URL}: https://kns.cnki.net/kcms2/article/abstract?v=wYvQo-F_OPZVupRnCM3IcpPWh6_9aE-YaIVwCGPV2cZGUWsRtFAaHsX12gEsecLHlrNccXqxtxcLvZVCAzZyua0r2xGRbqr3d75XPriQEIF6G1w58ZpDQNttBo2YplNHqzLElsTbWGxym1W9uDBBudvae8sJgBQCpyVxiTGBST8njg0vaD15UbY0ZTuto-Sq&uniplatform=NZKPT&language=CHS {Database Provider}: CNKI"
        - listitem [ref=e122]: "{Reference Type}: Journal Article {Title}: 人工智能媒介拟态环境的变化及其受众影响 {Author}: 柯泽; 谭诗妤 {Author Address}: 西北政法大学新闻传播学院; {Journal}: 学术界 {Year}: 2020 {Volume}: {Issue}: 7 {Pages}: 51-60 {Keywords}: 人工智能;拟态环境;景观社会;拟真时代;消费社会 {Abstract}: 人工智能技术在传媒领域的应用正在造成颠覆性的变革,急剧改变着信息生产和传播方式,也造成了新的媒介拟态环境。在人工智能崛起前的传统媒介社会中,有诸多因素影响着外部世界在我们头脑中的再现,也就是信息拟态环境的形成。人工智能技术崛起之后,新闻报道与信息分发看似为我们提供了一个更为清晰的信息环境,实际却进一步加剧了对现实的扭曲程度,一个看似\"超真实\"的全面拟真信息时代正在成为现实,结果是削弱了受众的心理感知,模糊了自我认知,对客观真实的扭曲以一种麻醉式的狂欢盛宴的形式呈现,这种新的拟态环境一方面消弭着想象与真实、主观与客观的边界,另一方面加大了彼此之间的鸿沟,并对受众认知和行为产生深刻的影响。 {ISBN/ISSN}: 1002-1698 {Notes}: 34-1004/C {URL}: https://kns.cnki.net/kcms2/article/abstract?v=wYvQo-F_OPZbYWqUgW_5Aaq9kSraa-mk4pPcMCxx8tG44qG3KcTlFWPYSWyycQJq7Zt2vWhQZd7i20RYZA7ntLrxq3BcptHpDseVv-Q6XQfNyfwF7cPkmy-vpSvpfmxhIO4KLx0kQHwLlwgbYIiji_qV_BSU1Z1Yk4Wm1gV0LsDEW-t7O-qx5Nv0tUKzRILt&uniplatform=NZKPT&language=CHS {Database Provider}: CNKI"
        - listitem [ref=e123]: "{Reference Type}: Journal Article {Title}: 基于新闻推送平台的推送算法研究 {Author}: 周智 {Author Address}: 华东交通大学理工学院; {Journal}: 数字传媒研究 {Year}: 2020 {Volume}: 37 {Issue}: 7 {Pages}: 10-12 {Keywords}: 新闻推送平台;推送算法;信息茧房;群体极化效应 {Abstract}: 以新闻推送平台为研究对象,讨论推荐算法原理,分析\"信息茧房\"现象,在此基础上分析群体极化效应的成因并提出建议,为构建和谐的多元化信息环境提供借鉴。 {ISBN/ISSN}: 2096-0751 {Notes}: 15-1374/G2 {URL}: https://kns.cnki.net/kcms2/article/abstract?v=wYvQo-F_OPYSICMfH9aL4pYJkemO099zAntGvtwpm6mBHbz66ietQ4AZQgjdh_qX_vvx1mDJ0e2aPkHItWasisWegT5ehSdeKtCMThInOzdSXHhYUwQrPWGRBmLPK-r1NUQSD_iOUbZDLIZnJqkhlsMY23V2HRzzkJuVq5OuLOJtlaYhDhcsJLHfFWvuT0sZ&uniplatform=NZKPT&language=CHS {Database Provider}: CNKI"
        - listitem [ref=e124]: "{Reference Type}: Journal Article {Title}: 国内媒体个性化算法推荐研究热点分析——基于CNKI的文献计量分析(2016—2019年) {Author}: 景佳琦 {Author Address}: 上海理工大学出版印刷与艺术设计学院; {Journal}: 新媒体研究 {Year}: 2020 {Volume}: 6 {Issue}: 13 {Pages}: 7-10 {Keywords}: 算法;个性化推荐;文献计量 {Abstract}: 算法推荐作为近年来新兴的计算机技术,成为新媒体革新的重要方式之一。文章以CNKI为数据库,借助CiteSpace软件对2016—2019年国内新闻传播领域的1 163篇期刊论文进行量化分析,展示国内在媒体个性化算法推荐领域的研究热点,试图分析当前的研究现状,指出相关研究的借鉴与启示,旨在推动该领域的创新与发展。 {ISBN/ISSN}: 2096-0360 {Notes}: 10-1330/G2 {URL}: https://link.cnki.net/doi/10.16604/j.cnki.issn2096-0360.2020.13.003 {DOI}: 10.16604/j.cnki.issn2096-0360.2020.13.003 {Database Provider}: CNKI"
        - listitem [ref=e125]: "{Reference Type}: Journal Article {Title}: 移动互联网时代算法推荐语境下移动阅读素养研究 {Author}: 王阳; 沈军军; 江震 {Author Address}: 江苏海洋大学图书馆;连云港市图书馆; {Journal}: 新世纪图书馆 {Year}: 2020 {Volume}: {Issue}: 6 {Pages}: 24-29 {Keywords}: 算法推荐;自媒体;信息茧房;信息低俗;个人隐私信息 {Abstract}: 本文旨在研究移动阅读环境下读者移动阅读素养,目的是为了有效解决移动互联网时代算法推荐技术带来的弊端提供参考。文章通过对移动阅读环境和算法推荐技术的介绍,详细分析了\"信息茧房\"\"低俗化\"\"个人信息外泄\"等问题的形成机理,并研究了以算法推荐技术为基础的智媒平台所产生负面作用的成因,提出了读者应在信息环境意识,信息习惯,操作策略,个人信息安全等四方面阻断弊端形成条件,尝试归纳了读者在算法推荐背景下应具备的移动阅读素养,以使移动互联网时代读者获取信息更加公正、全面、安全、健康。 {ISBN/ISSN}: 1672-514X {Notes}: 32-1691/G2 {URL}: https://link.cnki.net/doi/10.16810/j.cnki.1672-514X.2020.06.005 {DOI}: 10.16810/j.cnki.1672-514X.2020.06.005 {Database Provider}: CNKI"
        - listitem [ref=e126]: "{Reference Type}: Thesis {Title}: 抖音短视频的知识生产与传播研究 {Author}: 孙茹茹 {Tertiary Author}: 邢云文 {Publisher}: 山西大学 {Type of Work}: 硕士 {Year}: 2020 {Keywords}: 抖音短视频;知识生产;知识传播 {Abstract}: 人类知识迭代进化与传播技术密切相关,书写技术的出现推动从最初的“口语”到文字的传播,纸张和印刷术的出现加快了知识的流通与传播,互联网和新媒介的出现使知识传播彻底摆脱了时空的束缚,带来了空前的知识繁荣。随着移动终端的不断普及和短视频行业的井喷式发展,抖音短视频凭借碎片化、场景化和通俗化的传播优势成为知识生产与传播的重要形式。与传统的知识生产与传播形式相比,短视频在知识生产与传播过程中表现出新的特性和规律。这种新的传播媒体正在变革知识创作与传播的方式,成为助推“全民学习”时代到来的新工具。本文选取抖音平台上典型的知识案例和内容进行深入分析,研究抖音短视频在知识生产与传播的过程表现出来的新特点和新规律。第一章研究抖音短视频平台的知识生产过程,详细分析了两种知识生产主体以及三种知识生产模式的优缺点,同时探讨了知识内容的新特点;第二章研究抖音短视频的知识传播过程,探究其知识传播的路径,探讨其知识传播具有的传播特点,如主动议程设置、个性化推荐和推出扶持政策等,最后分析其知识传播的用户效果;第三章,对现阶段抖音短视频知识生产与传播的发展趋势与面临的问题进行梳理,分析抖音短视频的知识生产与传播呈现出知识体系化和知识付费的发展态势,同时面临着如内容参差不齐、缺乏深度和信息茧房等问题;第四章对抖音短视频的知识生产与传播提出一些可行性的发展策略,希望能利用短视频的传播形式更好的进行知识生产与传播。 {URL}: https://link.cnki.net/doi/10.27284/d.cnki.gsxiu.2020.000407 {DOI}: 10.27284/d.cnki.gsxiu.2020.000407 {Database Provider}: CNKI"
        - listitem [ref=e127]: "{Reference Type}: Thesis {Title}: 聚合型新闻APP个性化推荐机制研究 {Author}: 杨睿婷 {Tertiary Author}: 王涵 {Publisher}: 山西大学 {Type of Work}: 硕士 {Year}: 2020 {Keywords}: 聚合型新闻APP;个性化推荐机制;今日头条APP;人文价值 {Abstract}: 身处互联网社会,大数据普遍应用于人们生活的方方面面,为人们获取信息增添了便利,但同时也暗藏危机。当今社会,手机成为人们随时随地获取信息的主要工具,但获取信息的渠道增多,各类新闻APP层出不穷,受众很难看到自己所需的信息,加之人们生活节奏快,缺乏整块阅读的时间,急需快速高效的新闻阅读方式。聚合型的新闻APP将多种类型的新闻信息聚集于同一平台,省去了多渠道阅读带来的不便。同时,聚合型新闻APP采用个性化算法推荐机制,为用户量身定制新闻内容,满足用户碎片化阅读需求,使阅读更加高效。“今日头条”是国内聚合型新闻APP的典型代表,是最早探索个性化推荐技术的新闻APP之一。本文选取今日头条APP为案例,从新闻传播学的视角出发,研究聚合型新闻平台新闻信息的选取、推荐等方面存在的问题,并提出相应的解决措施。绪论部分主要分析国内外对这一课题的研究现状,说明本文研究方法以及研究的创新点与难点。第二部分主要对聚合型新闻APP及个性化推荐机制做相关概述。第三部分主要从“今日头条”个性化推荐的应用模式、内容管理、价值取向等方面进行分析,由此可知如今各类聚合型新闻平台的现状。第四部分主要从“今日头条”看聚合型新闻APP普遍存在的问题。第五部分主要根据第四部分分析得出的问题提出解决之策。个性化推荐机制适应时代发展需求,在各个领域中应用广泛,并逐渐普及,具有很强的影响,对新闻信息平台来说也不例外。为扬长避短,更好地利用个性化推荐技术为受众服务,净化信息生态环境,促使媒介环境的良性循环,笔者认为有必要对其可能出现的问题进行分析研究,维护新闻真实性,不盲目抬高机器算法的地位。 {URL}: https://link.cnki.net/doi/10.27284/d.cnki.gsxiu.2020.001388 {DOI}: 10.27284/d.cnki.gsxiu.2020.001388 {Database Provider}: CNKI"
        - listitem [ref=e128]: "{Reference Type}: Thesis {Title}: 抖音短视频个性化推荐中“信息茧房”的危害与治理 {Author}: 韩晓娟 {Tertiary Author}: 姜晓红 {Publisher}: 广州体育学院 {Type of Work}: 硕士 {Year}: 2020 {Keywords}: 信息茧房;个性化推荐;抖音短视频;算法 {Abstract}: 本文从今日头条推出的抖音短视频APP入手,研究抖音短视频平台内容分发采用的个性化推荐的模式,进而研究这种推荐模式会对用户产生哪些影响。抖音短视频依托今日头条的算法推荐技术为用户推送带着用户标签的定制内容,长期接触这些基于个人偏好的信息,用户的视野范围将会受限,丧失了理解不同事物的能力,这种现象与美国学者凯斯·R·桑斯坦在2006年在《信息乌托邦—众人如何生产知识》一书中提出的“信息茧房”的观点相契合。首先,本文立足于凯斯·R·桑斯坦的“信息茧房”的研究理论及其他相关传播学理论,概述了抖音短视频的产品特征,其中就抖音的内容推荐方式进行分析后重点论述“信息茧房”的危害与治理,进而客观的对抖音的内容推荐模式产生的影响进行论述,弄清抖音中为用户推荐内容的基本逻辑。抖音短视频内部的算法推荐技术主要采用:基于用户画像的推荐方式、基于内容的过滤方式和协同过滤三种方式来为用户推荐内容。推荐的内容具有以下特征:内容以用户喜好为筛选标准、跟踪并记录用户的使用行为进而修改推荐的内容,导致在用户偏好之外但具有公共价值的内容被隔绝。其次,论述抖音中“信息茧房”现象形成后对用户产生的媒介依存症等影响。“信息茧房”效应的形成是由信息环境、用户心理、算法技术、平台设计的共同作用下引发个体的“信息偏食”。抖音中用户间为争夺流量、抢占资本可能会生产出导向不正的内容,降低了平台的公信力,给媒介素养不高的用户起到了不良引导作用。同时,也会出现相同个体的不断叠加,群体聚拢,但因群体间缺少社会的共同经验出现言论偏激造成群体极化的社会问题,影响社会整合,降低个体的社会黏性。最后,通过从传者角度、通道角度、用户角度逐一分析抖音中“信息茧房”的成因,针对成因来提出问题的治理之道。总结得出,用户的选择性心理是驱使用户进入“信息茧房”的第一步,平台中个性化推荐会加速“信息茧房”的形成,进而导致用户出现“媒介依存症”,从此开始固化内容获取路径,造成视域局限。另外,客户端的页面设计上缺少异质信息的入口导致用户无法接触到其他信息,最终禁锢在“信息茧房”之中。要想破茧,需要用户、平台、社会三者结合来缓解“信息茧房”的危害,回归工具理性,让短视频发挥出更有意义的传播价值。 {URL}: https://link.cnki.net/doi/10.27042/d.cnki.ggztc.2020.000145 {DOI}: 10.27042/d.cnki.ggztc.2020.000145 {Database Provider}: CNKI"
        - listitem [ref=e129]: "{Reference Type}: Thesis {Title}: 中国网络新闻传播领域算法伦理研究 {Author}: 袁帆 {Tertiary Author}: 严三九 {Publisher}: 华东师范大学 {Type of Work}: 博士 {Year}: 2020 {Keywords}: 网络新闻;算法伦理;伦理失范;伦理责任主体;“三视角”理论 {Abstract}: 算法作为推动网络新闻传播领域智能化发展的重要工具已经在我国得到了广泛应用,尤其是在自动化新闻生产和个性化新闻推送领域。但是在推动新闻事业发展的同时,算法也在领域内引发了一些了问题,而这些问题深究起来都关乎于伦理。本研究从“三视角”理论出发,以该理论作为窥探网络新闻传播领域算法伦理问题的研究框架。根据该理论,需要从处境性视角即现状、规范性视角即标准、存在性视角即主体表现三方面来诠释伦理问题。于是本文依据该理论提供的“三视角”,通过第三至第五章着重阐释、分析网络新闻传播领域的算法伦理问题。具体内容包括:首先,从处境性视角来看。算法确实在当下中国网络新闻传播领域引发并加剧了诸如信息茧房、社会价值观异化等一系列伦理失范问题,这些伦理失范问题束缚了中国网络新闻传播领域未来积极发展。究其原因是利益诱导与制度缺失等多方面导致。其次,从规范性视角来看。结合算法的特殊性以及我国社会主义新闻事业大背景,一个有道德的、合格的算法最基本要具备公正性即不歧视、预防性即要防范、尊重性即要合法、透明性即要可追溯、导向性即要负有积极舆论导向功能五大点。只有具备以上五点性质的算法,才能够辅助社会主义新闻事业未来发展。再次,从存在性视角来看。本文主要将网络新闻传播领域算法的伦理责任主体分为三大类:第一类是算法的直接设计者和使用者即算法工程师,他们作为技术实践者会有意或无意的将价值观念、伦理倾向等内容渗透进算法。通过考察研究,本文发现现阶段算法工程师对算法伦理失范风险的认知比较浅薄、对算法伦理失范风险的改进意愿较为被动,算法伦理水平测量中专业伦理素养低等问题。第二类是算法的管理主体即产品经理等。本文以算法平台产品经理为考察对象,了解他们是如何认识算法伦理问题以及算法设计至完成阶段自我伦理定位。第三类是算法的施用主体即用户本身。作为算法的作用对象,同样作为数据的提供者,用户实质或多或少地参与到了算法完善的进程中。因此,用户对算法伦理失范风险的认知、感知以及应对反映着用户如何发挥主观能动性来规避风险。本文的结果显示,即便用户能够感受到算法伦理风险,但为了满足需求,其仍旧会选择消极态度应对算法伦理风险。通过从处境性视角、规范性视角、存在性视角的分析,本文同样从此三视角出发提出相对应的解决建议,来促成合乎道德算法的实现。首先从处境性视角中,以技术手段来解决技术问题,通过设计可习得道德的算法以及区块链技术予以辅助;其次从规范性视角中,参考西方经验,以外部法律规... {URL}: https://link.cnki.net/doi/10.27149/d.cnki.ghdsu.2020.001421 {DOI}: 10.27149/d.cnki.ghdsu.2020.001421 {Database Provider}: CNKI"
        - listitem [ref=e130]: "{Reference Type}: Thesis {Title}: 算法推荐下“信息茧房”负效应的可视化设计研究 {Author}: 陈月 {Tertiary Author}: 侯立平 {Publisher}: 山东工艺美术学院 {Type of Work}: 硕士 {Year}: 2020 {Keywords}: 信息茧房;算法推荐;负效应;可视化设计 {Abstract}: 当今新媒体技术革命日益加剧,算法推荐技术的研发更是成为各大网络信息平台的重中之重,与之而来的“信息茧房”现象对于时代的影响逐步扩散至整个信息传播链条,本研究实际调研了算法推荐下“信息茧房”现象,探究了产生“信息茧房”背后的原因以及“信息茧房”所带来的负效应,分别从个人影响和社会影响两个方面来诠释“信息茧房”对网络用户乃至社会公众的消极影响。在研究的理论基础上,围绕个人层面、社会现象以及心里抗拒三个维度,以视觉可视化的角度重新向网络受众呈现“信息茧房”负效应的感官认识。设计实践通过对相关议题进行案例分析与学习,推导出可视化设计实践的三种表现形式:(1)平面视觉设计用以通过视觉冲击抓住受众眼球,引起受众的注意和好奇心;(2)动态投影设计用以具体展示“信息茧房”负效应所带来的种种危害,引导社会公众认识和理解“信息茧房”负效应的存在;(3)艺术编程设计用以深入受众心理层面,以劝阻网络用户理性看待算法推荐下的个性化信息分发模式从而能够规范上网行为。整体设计将人文因素融入其中,采用多元化的艺术创作,通过贴切形象的可视化设计,补充文字研究的不足,从视觉传达的角度引导网络受众挣脱“信息茧房”的孤立与封闭,提醒公众适时避免落入“信息茧房”的圈套,科学理性应用算法推荐技术和个性化推荐系统,学习了解多方信息和观点,接收较为全面客观的新闻资讯,以利于个人综合素质的发展和社会环境的和谐进步。 {URL}: https://link.cnki.net/doi/10.27789/d.cnki.gsdgy.2020.000079 {DOI}: 10.27789/d.cnki.gsdgy.2020.000079 {Database Provider}: CNKI"
        - listitem [ref=e131]: "{Reference Type}: Thesis {Title}: 短视频推荐机制效果研究 {Author}: 葛庆坤 {Tertiary Author}: 雷丽莉 {Publisher}: 大连理工大学 {Type of Work}: 硕士 {Year}: 2020 {Keywords}: 短视频;推荐机制;抖音;快手 {Abstract}: 身处平台分发的短视频井喷式增长的这一背景,随着移动互联网泛娱乐化行业的发展,直播与短视频越来越深入人们的生活,人们对于直播与短视频的质量要求也越来越高。是否能够匹配用户的兴趣,满足用户的需求,已经成为决定平台增长的关键因素。本文以一种全新的信息获取方式——短视频作为切入点,采用问卷调查法揭示出当前两大短视频平台用户的推荐机制差异,着重分析抖音与快手这两个主要的短视频平台机制中的推荐逻辑差异以及所产生的效果差异,通过研究,笔者发现目前短视频市场上最热门的两大短视频平台——抖音、快手之间的推荐机制理念,以及在效果上的差异。例如在视频多样性上,“抖音”与“快手”都呈显著的相关性,也就是短视频推送的越多样,传播效果更好。用户希望平台推送的一系列视频能够覆盖到更广的面,而不是只局限在用户自己感兴趣的领域,抑或是只有相同主题的视频。而在考察大V头部效应部分,无论是“抖音”还是“快手”的受众都看重头部大V效应,并且更希望可以推送自己关注的作者上传的短视频,可是如果推送的总是一个作者的视频,传播效果会变差。本文试图从短视频平台传播机制出发,对快手、抖音两平台的推荐算法的差异进行探究,来分析短视频平台的推荐算法机制机制与传播效果的联系,以期能给垂直短视频平台的发展提供理论和数据支撑。所以本文试图通过聚焦移动互联网大背景下,以期最终能够探析出不同短视频平台传播效果差异性的原因,也为之后的研究提供一个理论框架。 {URL}: https://link.cnki.net/doi/10.26991/d.cnki.gdllu.2020.000027 {DOI}: 10.26991/d.cnki.gdllu.2020.000027 {Database Provider}: CNKI"
        - listitem [ref=e132]: "{Reference Type}: Thesis {Title}: 短视频App算法推荐智能化对用户心流体验的影响研究 {Author}: 甘子美 {Tertiary Author}: 刘超 {Publisher}: 广东外语外贸大学 {Type of Work}: 硕士 {Year}: 2020 {Keywords}: 算法推荐智能化;个性化推荐;用户生产内容(UGC);短视频App;心流体验 {Abstract}: 随着互联网通信技术的发展,各种内容信息呈现出指数增长的趋势,人们逐渐从信息匮乏的盲区过渡到信息过载(information overload)的矛盾之中。由于人的时间成本是有限的,面对海量信息的时候往往处理效率会大大减弱,推荐算法的出现有效地缓解了该问题。算法推荐系统(recommender system)是人工智能数据挖掘的分支领域,它可以根据用户的兴趣偏好向用户推荐其感兴趣的信息内容。短视频作为一种运用算法推荐进行内容分发的平台,用户常常表示该类平台的使用经历为“刷视频一时爽,一直刷一直爽”,而学术界对用户视角的算法推荐系统智能化水平的科学评估缺乏研究,算法推荐技术如何促进用户沉浸式体验的机制尚不明朗。本研究基于心流理论,以抖音App为研究对象,通过30个访谈样本以及405个问卷调查样本的实证研究,运用关键事件法、德尔菲法以及结构方程模型分析等统计方法,原创开发基于用户视角的算法推荐智能化评估模型,解析其内涵特征,并探究了其对心流体验的影响机制。为了提高研究的规范性和严谨性,本研究将运用质化与量化结合的研究方法,研究过程分为三个部分,研究一为探索性质化研究,立足于现实情境分析短视频App心流体验可能存在的影响因素,指出了算法推荐智能化是重要的影响因素之一;研究二则是通过规范的程序开发了关于算法推荐智能化的测量工具;研究三为主研究,基于两个子研究的成果,针对本文的主要研究问题,构建并检验了理论模型,阐明了中介机制。研究结果显示:首先,用户视角的算法推荐智能化评估AVNS模型由4个维度构成,即准确性(accuracy)、多样性(variety)、新颖性(novelty)、惊喜性(serendipity)。AVNS模型具有理想的信度与效度,参数估计检验还发现:性别对算法推荐智能化评估存在一定的显著差异,而年龄、学历、月消费对AVNS模型感知均未体现出显著性差异。其次,算法推荐智能化是通过UGC感知质量的中介作用对心流体验产生正向影响的。具体而言,其四个维度的因子均对UGC感知质量有显著正向影响,两个维度(多样性与惊喜性)则对用户的心流体验有显著正向影响,UGC感知质量在两者的影响关系间起到中介效应。本研究的理论贡献有二:其一,通过一套规范的量表开发程序,为短视频App等内容分发平台从用户视角出发的算法推荐智能化评估提供了新的视角与工具,其二,丰富了心流理论的相关研究成果,探寻了算法推荐智能化对心流体验的路径机制。此... {URL}: https://link.cnki.net/doi/10.27032/d.cnki.ggdwu.2020.001056 {DOI}: 10.27032/d.cnki.ggdwu.2020.001056 {Database Provider}: CNKI"
